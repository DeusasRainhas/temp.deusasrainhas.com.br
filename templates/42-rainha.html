<!doctype html>
<html lang="pt-BR" data-template="42">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 42 Rainha</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       42 Rainha · narrativa · N9 / C1 / R1
       A rainha no centro, tudo em volta. A abelha da marca é o centro de
       um sistema de órbitas: as funções do app giram no primeiro anel, a
       tecnologia no segundo, abelhas pequenas no terceiro. Mais abaixo,
       as funcionalidades se distribuem em layout radial em volta do título.
       Efeito: órbitas lentas (GSAP, repeat infinito). Com movimento
       reduzido, as órbitas ficam paradas nas posições iniciais.
       N9: cabeçalho que encolhe ao rolar e vira só coroa + CTA.
       C1: listas com filetes. R1: faixas alternando creme e papel.
       Regras: nada de opacity < 1 fora do gsap.matchMedia; canto inferior
       direito livre (switcher).
       ================================================================= */

    :root { --nav-h: 88px; --respiro: var(--sp-9); }
    @media (max-width: 767px) { :root { --nav-h: 72px; --respiro: 64px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }

    /* ---------- R1: faixas ---------- */
    main > section { padding-block: var(--respiro); scroll-margin-top: 64px; }
    .faixa--papel { background: var(--creme-papel); }
    .faixa--creme { background: var(--creme); }

    /* ---------- N9: cabeçalho que encolhe ---------- */
    .cabecalho {
      position: sticky; top: 0; z-index: 50; background: var(--creme);
      border-bottom: 1px solid transparent; transition: border-color .3s ease, background-color .3s ease;
    }
    .cabecalho__barra { display: flex; align-items: center; gap: var(--sp-6); height: var(--nav-h); transition: height .35s ease; }
    .marca { display: block; flex: none; margin-right: var(--sp-4); }
    .marca__completa { width: 64px; height: 64px; }
    .marca__coroa { display: none; width: 40px; height: auto; }
    .cabecalho__links { display: flex; gap: var(--sp-6); margin-inline: auto; }
    .cabecalho__links a {
      font-weight: 600; font-size: var(--fs-small); color: var(--terra-escura); text-decoration: none; padding-block: 6px;
      background: linear-gradient(var(--mel), var(--mel)) left bottom / 0 2px no-repeat; transition: background-size .25s ease;
    }
    .cabecalho__links a:hover { background-size: 100% 2px; }
    .cabecalho .dr-btn { margin-left: auto; padding: 10px 20px; border-radius: var(--r-pill); font-size: var(--fs-small); }
    .cabecalho.encolhido { border-bottom-color: var(--linha); background: var(--creme-papel); }
    .cabecalho.encolhido .cabecalho__barra { height: 60px; }
    .cabecalho.encolhido .marca__completa { display: none; }
    .cabecalho.encolhido .marca__coroa { display: block; }
    .cabecalho.encolhido .cabecalho__links { display: none; }
    @media (max-width: 999px) { .cabecalho__links { display: none; } }
    @media (max-width: 767px) { .marca__completa { width: 56px; height: 56px; } }

    /* ---------- Hero: sistema de órbitas ---------- */
    /* Composição centrada: a rainha e o título no centro do halo, as órbitas em volta,
       o subtítulo logo abaixo do sistema. O sistema pode passar da largura no celular
       (o hero corta o excesso, sem rolagem horizontal). */
    .hero { padding: 0 0 var(--sp-8) !important; overflow: hidden; }
    .acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); margin-top: var(--sp-5); }
    .acoes .dr-btn { border-radius: var(--r-pill); }
    .hero__pe { text-align: center; margin-top: calc(var(--S-hero) * -0.04); }
    .hero__pe .dr-body-lg { max-width: 46ch; margin-inline: auto; }

    .sistema { --S: min(600px, 88vw); position: relative; width: var(--S); height: var(--S); margin-inline: auto; }
    .sistema--hero { --S: var(--S-hero); left: 50%; margin: -24px 0 0 calc(var(--S) / -2); }
    .hero { --S-hero: min(900px, 112vw); }
    @media (max-width: 767px) { .hero { --S-hero: 172vw; } .sistema--hero { margin-top: -40px; } }
    .sistema__trilhas { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .sistema__trilhas circle { fill: none; vector-effect: non-scaling-stroke; }
    .trilha-1 { stroke: var(--linha-forte); stroke-width: 1.5; }
    .trilha-2 { stroke: var(--linha-forte); stroke-width: 1; stroke-dasharray: 2 6; }
    .trilha-3 { stroke: var(--mel-claro); stroke-width: 1; }
    .halo { fill: var(--mel-veu); }
    .halo-2 { fill: none; stroke: var(--mel-claro); stroke-width: 1.5; }
    .rainha {
      position: absolute; z-index: 2; left: 50%; top: 50%; width: min(480px, calc(var(--S) * .5));
      transform: translate(-50%, -50%); text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    .rainha__abelha { width: 96px; height: 96px; }
    .rainha .dr-eyebrow { margin-top: var(--sp-2); }
    .rainha h1 { font-size: clamp(30px, 3.4vw, 48px); line-height: 1.06; text-wrap: balance; margin-top: var(--sp-3); }
    @media (max-width: 767px) {
      .rainha { width: min(310px, 84vw); }
      .rainha__abelha { width: 60px; height: 60px; }
      .rainha .dr-eyebrow { font-size: 11px; letter-spacing: .16em; }
      .rainha .acoes { gap: var(--sp-2); }
      .rainha .acoes .dr-btn { padding: 10px 14px; font-size: 14px; }
    }
    .anel { position: absolute; inset: 0; }
    .no {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0;
      transform: rotate(var(--a, 0deg)) translateX(var(--raio)) rotate(calc(-1 * var(--a, 0deg)));
    }
    .anel--1 .no { --raio: calc(var(--S) * .31); }
    .anel--2 .no { --raio: calc(var(--S) * .45); }
    .anel--3 .no { --raio: calc(var(--S) * .385); }
    .no__disco {
      position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; background: var(--branco); color: var(--petroleo);
      border: 1.5px solid var(--linha-forte); box-shadow: var(--sh-md);
    }
    .anel--2 .no__disco { left: -22px; top: -22px; width: 44px; height: 44px; background: var(--petroleo); color: var(--creme); border-color: var(--petroleo); }
    .anel--2 .dr-icone { width: 20px; height: 20px; }
    .anel--3 .no__disco { left: -5px; top: -5px; width: 10px; height: 10px; background: var(--mel); border: 0; box-shadow: none; }
    @media (max-width: 599px) {
      .no__disco { left: -21px; top: -21px; width: 42px; height: 42px; }
      .no__disco .dr-icone { width: 20px; height: 20px; }
      .anel--2 .no__disco { left: -17px; top: -17px; width: 34px; height: 34px; }
      .anel--2 .dr-icone { width: 16px; height: 16px; }
    }

    /* ---------- Cabeça de seção ---------- */
    .cabeca { max-width: 640px; }
    .cabeca .dr-eyebrow { display: inline-flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .cabeca .dr-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mel); box-shadow: 0 0 0 4px var(--mel-veu); }
    .cabeca--centro { margin-inline: auto; text-align: center; }
    .cabeca + * { margin-top: var(--sp-7); }
    .intro { margin-top: var(--sp-4); }
    @media (max-width: 767px) { .dr-h2 { font-size: 30px; } }

    /* ---------- C1: listas com filetes ---------- */
    .filetes > li { border-top: var(--bd); padding-block: var(--sp-5); }
    .filetes > li:last-of-type { border-bottom: var(--bd); }
    .item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); }
    .item .dr-icone { color: var(--petroleo); margin-top: 3px; }
    .item .dr-h4 { margin-bottom: var(--sp-2); }

    /* Prova: quatro números numa linha com filetes verticais */
    .numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: var(--bd); }
    .numeros > li { padding: var(--sp-6) var(--sp-5); text-align: center; }
    .numeros > li + li { border-left: var(--bd); }
    .numeros .dr-data { display: block; font-size: clamp(36px, 4vw, 52px); line-height: 1; color: var(--terra-escura); }
    .numeros__rotulo { display: block; margin-top: var(--sp-3); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .14em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 767px) {
      .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .numeros > li:nth-child(3) { border-left: 0; }
      .numeros > li:nth-child(n + 3) { border-top: var(--bd); }
    }

    /* Problema */
    .dupla { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
    .estatistica { margin-top: var(--sp-6); display: flex; align-items: center; gap: var(--sp-5); }
    .estatistica__valor {
      flex: none; display: grid; place-items: center; width: 140px; height: 140px; border-radius: 50%;
      border: 1.5px solid var(--terra-escura); outline: 1px dashed var(--linha-forte); outline-offset: 10px;
      font-size: 40px; color: var(--terra-escura);
    }
    .item--alerta .dr-icone { color: var(--erro); }
    @media (max-width: 899px) { .dupla { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- Funcionalidades: layout radial ---------- */
    .radial { position: relative; }
    .radial__centro { text-align: center; }
    .radial__centro .dr-eyebrow { margin-bottom: var(--sp-3); }
    .radial__elipse { display: none; }
    @media (min-width: 1024px) {
      .radial { height: 760px; }
      .radial__centro {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 320px; height: 320px; border-radius: 50%; background: var(--creme);
        display: grid; place-content: center; padding: var(--sp-6); z-index: 2;
        box-shadow: 0 0 0 14px var(--mel-veu), 0 0 0 15px var(--mel-claro);
      }
      .radial__centro .dr-h2 { font-size: 30px; }
      .radial__elipse { display: block; position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .radial__elipse ellipse { fill: none; stroke: var(--linha-forte); stroke-width: 1; stroke-dasharray: 3 7; }
      .radial__elipse line { stroke: var(--linha-forte); stroke-width: 1; }
      .radial__elipse .satelite { fill: var(--mel); }
      .radial__itens > li {
        position: absolute; width: 290px; border-bottom: 0 !important;
        left: calc(50% + var(--x) - 145px); top: calc(50% + var(--y) - 70px);
      }
    }
    @media (max-width: 1023px) { .radial__itens { margin-top: var(--sp-6); } }

    /* Como funciona: três passos sobre um arco */
    .arco { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
    .arco__linha { position: absolute; left: 16.6%; top: 0; height: 60px; width: 66.8%; overflow: visible; pointer-events: none; }
    .arco__linha path { vector-effect: non-scaling-stroke; fill: none; stroke: var(--terra-clara); stroke-width: 1.5; stroke-dasharray: 4 6; }
    .passos { display: contents; }
    .passo { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .passo:nth-child(2) { margin-top: -28px; }
    .passo__numero {
      display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; position: relative; z-index: 1;
      background: var(--mel); color: var(--terra-escura); font-size: 20px; font-weight: 700; box-shadow: 0 0 0 8px var(--creme);
    }
    .passo .dr-h4 { margin-top: var(--sp-5); }
    .passo .dr-body { margin-top: var(--sp-2); max-width: 32ch; }
    .passo figure { margin-top: var(--sp-5); }
    .passo img {
      width: 200px; height: 200px; border-radius: 50%; object-fit: cover; object-position: top;
      border: 1.5px solid var(--linha-forte); background: var(--creme-papel); outline: 1px dashed var(--linha-forte); outline-offset: 8px;
    }
    .passo figcaption { margin-top: var(--sp-4); max-width: 28ch; margin-inline: auto; }
    @media (max-width: 899px) {
      .arco { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); }
      .arco__linha { display: none; }
      .passo:nth-child(2) { margin-top: 0; }
    }

    /* Tecnologia */
    .tecnologia-grade { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); }
    .tecnologia-grade .cabeca + * { margin-top: 0; }
    .filetes--duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--sp-6); }
    .filetes--duas > li:nth-last-of-type(2) { border-bottom: var(--bd); }
    @media (max-width: 899px) {
      .tecnologia-grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); }
      .filetes--duas { grid-template-columns: minmax(0, 1fr); }
      .filetes--duas > li:nth-last-of-type(2) { border-bottom: 0; }
    }

    /* Para quem */
    .perfil { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: var(--sp-5); align-items: baseline; }
    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); display: flex; align-items: center; gap: var(--sp-3); }
    .perfil .dr-h3::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--mel-escuro); }
    @media (max-width: 767px) { .perfil { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); } }

    /* Depoimento: retrato no centro de um anel */
    .citacao { max-width: 820px; margin-inline: auto; text-align: center; }
    .citacao__retrato { position: relative; width: 132px; height: 132px; margin: 0 auto var(--sp-6); }
    .citacao__retrato img { position: absolute; inset: 22px; width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--linha-forte); }
    .citacao__retrato svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .citacao__retrato circle { fill: none; stroke: var(--linha-forte); stroke-dasharray: 2 5; }
    .citacao__retrato .ponto { fill: var(--mel); stroke: none; }
    .citacao .dr-quote { font-size: clamp(24px, 3vw, 34px); color: var(--terra-escura); text-wrap: balance; }
    .citacao__nome { display: block; margin-top: var(--sp-5); font-weight: 700; color: var(--ink); }
    .citacao__local { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }

    /* Equipe */
    .pessoas > li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-5); align-items: center; }
    .pessoas img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--linha-forte); }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); }
    .apoios { display: flex; flex-wrap: wrap; gap: var(--sp-5) var(--sp-7); align-items: center; margin-top: var(--sp-7); padding-top: var(--sp-6); border-top: var(--bd); }
    .apoio { display: flex; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 64px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); }
    .apoio__logo img { max-height: 48px; width: auto; max-width: 150px; }
    .apoio[data-fundo="escuro"] .apoio__logo { background: var(--grafite); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }

    /* Contato */
    .contato-grade { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-8); }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink);
      background: var(--branco); border: var(--bd-forte); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; border-radius: var(--r-pill); }
    .canais .item { align-items: center; }
    .canais a { font-weight: 600; font-size: var(--fs-body-lg); overflow-wrap: anywhere; text-underline-offset: 4px; }
    .contato-acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    .contato-acoes .dr-btn { border-radius: var(--r-pill); }
    @media (max-width: 899px) { .contato-grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Rodapé */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N9 · cabeçalho que encolhe ao rolar e vira só coroa + CTA) -->
  <nav data-secao="nav" class="cabecalho">
    <div class="dr-container cabecalho__barra">
      <a class="marca" href="#inicio">
        <img class="marca__completa" src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64">
        <img class="marca__coroa" src="../img/logos/coroa-cor.png" alt="" data-c-alt="marca.alt" width="40" height="29">
      </a>
      <div class="cabecalho__links">
        <a href="#problema" data-c="problema.eyebrow"></a>
        <a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a>
        <a href="#como-funciona" data-c="comoFunciona.eyebrow"></a>
        <a href="#para-quem" data-c="paraQuem.eyebrow"></a>
        <a href="#equipe" data-c="equipe.eyebrow"></a>
      </div>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
  </nav>

  <main>

    <!-- SEÇÃO: hero (a abelha rainha no centro de um sistema de órbitas) -->
    <section data-secao="hero" id="inicio" class="hero faixa--creme">
      <div class="sistema sistema--hero">
          <svg class="sistema__trilhas" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="halo" cx="50" cy="50" r="27"/>
            <circle class="halo-2" cx="50" cy="50" r="29"/>
            <circle class="trilha-1" cx="50" cy="50" r="31"/>
            <circle class="trilha-3" cx="50" cy="50" r="38.5"/>
            <circle class="trilha-2" cx="50" cy="50" r="45"/>
          </svg>
          <div class="anel anel--3" aria-hidden="true">
            <span class="no"><span class="no__disco"></span></span>
            <span class="no"><span class="no__disco"></span></span>
            <span class="no"><span class="no__disco"></span></span>
          </div>
          <ul class="anel anel--2" data-c-lista="tecnologia.pilares">
            <template>
              <li class="no">
                <span class="no__disco"><svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg></span>
                <span class="dr-sr-only" data-c="titulo"></span>
              </li>
            </template>
          </ul>
          <ul class="anel anel--1" data-c-lista="funcionalidades.itens">
            <template>
              <li class="no">
                <span class="no__disco"><svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg></span>
                <span class="dr-sr-only" data-c="titulo"></span>
              </li>
            </template>
          </ul>
          <div class="rainha">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '#';
      var SVGNS = 'http://www.w3.org/2000/svg';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      // Distribui os nós de cada anel em ângulos iguais (posição, não movimento).
      function distribuirAneis() {
        [['.anel--1', -90], ['.anel--2', -45], ['.anel--3', 30]].forEach(function (par) {
          var nos = document.querySelectorAll(par[0] + ' > .no');
          nos.forEach(function (no, i) {
            no.style.setProperty('--a', (par[1] + i * 360 / nos.length) + 'deg');
          });
        });
      }

      // Layout radial das funcionalidades: seis itens numa elipse em volta do título.
      var ANGULOS = [-140, 180, 140, -40, 0, 40];
      function montarRadial() {
        var radial = document.querySelector('.radial');
        var svg = radial.querySelector('.radial__elipse');
        var itens = radial.querySelectorAll('.radial__itens > li');
        var w = radial.clientWidth, h = 760;
        var rx = Math.min(w / 2 - 175, 440), ry = 270;
        svg.innerHTML = '';
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        var el = document.createElementNS(SVGNS, 'ellipse');
        el.setAttribute('cx', w / 2); el.setAttribute('cy', h / 2);
        el.setAttribute('rx', rx * 0.68); el.setAttribute('ry', ry * 0.86);
        svg.appendChild(el);
        itens.forEach(function (li, i) {
          var a = (ANGULOS[i] || 0) * Math.PI / 180;
          var x = Math.cos(a) * rx, y = Math.sin(a) * ry;
          li.style.setProperty('--x', x.toFixed(1) + 'px');
          li.style.setProperty('--y', y.toFixed(1) + 'px');
          var l = document.createElementNS(SVGNS, 'line');
          l.setAttribute('x1', w / 2 + x * 0.44); l.setAttribute('y1', h / 2 + y * 0.44);
          l.setAttribute('x2', w / 2 + x * 0.66); l.setAttribute('y2', h / 2 + y * 0.66);
          svg.appendChild(l);
        });
        var g = document.createElementNS(SVGNS, 'g');
        g.setAttribute('class', 'satelites');
        [0, 120, 240].forEach(function (grau) {
          var c = document.createElementNS(SVGNS, 'circle');
          var a = grau * Math.PI / 180;
          c.setAttribute('class', 'satelite');
          c.setAttribute('cx', w / 2 + Math.cos(a) * rx * 0.68); c.setAttribute('cy', h / 2 + Math.sin(a) * ry * 0.86);
          c.setAttribute('r', 5);
          g.appendChild(c);
        });
        svg.appendChild(g);
        return { w: w, h: h, rx: rx * 0.68, ry: ry * 0.86, g: g };
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });
        distribuirAneis();
        var radial = montarRadial();
        var largura = window.innerWidth;
        window.addEventListener('resize', function () {
          if (window.innerWidth === largura) return;
          largura = window.innerWidth;
          radial = montarRadial();
        });

        // N9: o cabeçalho encolhe depois de 80px de rolagem (troca de classe, sem esconder texto).
        var cab = document.querySelector('.cabecalho');
        function aoRolar() { cab.classList.toggle('encolhido', window.scrollY > 80); }
        window.addEventListener('scroll', aoRolar, { passive: true });
        aoRolar();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // Entrada: a rainha surge, os anéis se abrem e os nós chegam (termina em ~1,3s).
          var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
          tl.from('.rainha__abelha', { scale: 0.6, autoAlpha: 0, duration: 0.8, ease: 'back.out(1.6)' })
            .from('.rainha > :not(.rainha__abelha), .hero__pe', { y: 18, autoAlpha: 0, duration: 0.7, stagger: 0.08 }, 0.15)
            .from('.sistema__trilhas circle', { scale: 0.4, transformOrigin: '50% 50%', autoAlpha: 0, duration: 0.8, stagger: 0.06 }, 0.15)
            .from('.anel .no__disco', { scale: 0, duration: 0.5, ease: 'back.out(2)', stagger: 0.04 }, 0.4);

          // Efeito principal: órbitas lentas. Cada anel gira; os discos giram ao contrário e ficam em pé.
          function orbitar(sel, dur, sentido) {
            var anel = document.querySelector(sel);
            if (!anel) return;
            gsap.to(anel, { rotation: 360 * sentido, duration: dur, ease: 'none', repeat: -1 });
            gsap.to(anel.querySelectorAll('.no__disco'), { rotation: -360 * sentido, duration: dur, ease: 'none', repeat: -1 });
          }
          orbitar('.anel--1', 90, 1);
          orbitar('.anel--2', 140, -1);
          orbitar('.anel--3', 48, 1);
          gsap.to('.citacao__orbita', { rotation: 360, svgOrigin: '66 66', duration: 24, ease: 'none', repeat: -1 });

          // Satélites da elipse radial percorrem a órbita das funcionalidades.
          var prog = { t: 0 };
          gsap.to(prog, {
            t: 1, duration: 60, ease: 'none', repeat: -1,
            onUpdate: function () {
              if (!radial || !radial.g.isConnected) return;
              var cs = radial.g.querySelectorAll('circle');
              cs.forEach(function (c, i) {
                var a = (prog.t + i / cs.length) * Math.PI * 2;
                c.setAttribute('cx', radial.w / 2 + Math.cos(a) * radial.rx);
                c.setAttribute('cy', radial.h / 2 + Math.sin(a) * radial.ry);
              });
            }
          });

          // Itens do layout radial chegam do centro.
          gsap.from('.radial__itens > li', {
            autoAlpha: 0, scale: 0.9, duration: 0.7, ease: 'power2.out', stagger: 0.08,
            scrollTrigger: { trigger: '.radial', start: 'top 70%', once: true }
          });
          // C1: as outras listas sobem uma linha por vez.
          gsap.utils.toArray('.filetes:not(.radial__itens), .numeros, .apoios').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, y: 12, duration: 0.6, ease: 'power2.out', stagger: 0.08,
              scrollTrigger: { trigger: lista, start: 'top 85%', once: true }
            });
          });
          gsap.from('.passo', {
            autoAlpha: 0, y: 30, duration: 0.7, ease: 'power2.out', stagger: 0.12,
            scrollTrigger: { trigger: '.arco', start: 'top 80%', once: true }
          });
        });
      });
    })();
  </script>
