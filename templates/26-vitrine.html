<!doctype html>
<html lang="pt-BR" data-template="26">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 26 Vitrine</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       26 Vitrine · app · N5 / C6 / R5
       O celular é a vitrine: fica pinado no centro do palco e troca de
       tela conforme o scroll, com chamadas flutuantes de cada função.
       Pin só a partir de 1100px e sem movimento reduzido; abaixo disso o
       palco vira hero estático + grade de cards.
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --indice-w: 264px; --respiro: var(--sp-9); --app-fundo: #FFF8E6; --app-mel: #EBB42E; }
    @media (max-width: 899px) { :root { --respiro: 64px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }

    main > section { position: relative; padding-block: var(--respiro); scroll-margin-top: 72px; isolation: isolate; }
    @media (min-width: 900px) {
      main, footer[data-secao="rodape"] { margin-left: var(--indice-w); }
      main > section { scroll-margin-top: 0; }
    }

    /* ---------- N5: índice em coluna fixa à esquerda, com progresso ---------- */
    .indice {
      position: fixed; inset: 0 auto 0 0; z-index: 60; width: var(--indice-w);
      display: flex; flex-direction: column; gap: var(--sp-6);
      padding: var(--sp-5) var(--sp-5) var(--sp-6);
      background: var(--creme-papel); border-right: var(--bd);
    }
    .indice__marca { display: block; width: 72px; }
    .indice__marca img { width: 72px; height: 72px; }
    .indice__rotulo { color: var(--suave); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; }
    .indice__lista { position: relative; display: grid; gap: 2px; padding-left: var(--sp-5); margin-top: var(--sp-3); counter-reset: idx; }
    .indice__trilho { position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--linha); border-radius: 2px; overflow: hidden; }
    .indice__fio { position: absolute; inset: 0; background: var(--mel-escuro); transform-origin: top; transform: scaleY(0); }
    .indice__lista a {
      counter-increment: idx; display: grid; grid-template-columns: 28px 1fr; align-items: baseline;
      padding: 9px 0; color: var(--corpo); text-decoration: none; font-size: 15px; font-weight: 500;
      transition: color .2s ease;
    }
    .indice__lista a::before { content: counter(idx, decimal-leading-zero); font-family: var(--mono); font-size: 11px; color: var(--terra-clara); letter-spacing: .08em; }
    .indice__lista a:hover { color: var(--terra-escura); }
    .indice__lista a.ativo { color: var(--terra-escura); font-weight: 700; }
    .indice__lista a.ativo::before { color: var(--mel-escuro); }
    .indice__pct { margin-top: auto; display: flex; align-items: baseline; gap: var(--sp-2); border-top: var(--bd); padding-top: var(--sp-4); }
    .indice__pct b { font-family: var(--mono); font-size: 28px; font-weight: 500; color: var(--terra-escura); font-variant-numeric: tabular-nums; }
    .indice .dr-btn { width: 100%; }
    .indice__barra { display: none; }
    @media (max-width: 899px) {
      .indice {
        position: sticky; inset: auto; top: 0; width: auto; flex-direction: row; align-items: center; justify-content: space-between;
        gap: var(--sp-4); padding: var(--sp-2) 16px; border-right: 0; border-bottom: var(--bd); background: var(--creme);
      }
      .indice__marca, .indice__marca img { width: 56px; height: 56px; }
      .indice__nav, .indice__pct { display: none; }
      .indice .dr-btn { width: auto; padding: 10px 16px; font-size: var(--fs-small); }
      .indice__barra { display: block; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--mel-escuro); transform-origin: left; transform: scaleX(0); }
    }
    @media (min-width: 900px) and (max-height: 760px) { .indice__lista a { padding: 6px 0; } .indice { gap: var(--sp-4); } }

    /* ---------- R5: favo-claro em seções alternadas, esmaecendo onde há texto ---------- */
    .favo::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: url(../img/padroes/favo-claro.svg); opacity: .32;
      -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 85%);
              mask-image: linear-gradient(100deg, transparent 35%, #000 85%);
    }
    .favo--centro::before {
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 38%, transparent 40%, #000 90%);
              mask-image: radial-gradient(ellipse 60% 55% at 50% 38%, transparent 40%, #000 90%);
    }

    .miolo { max-width: 1080px; margin-inline: auto; padding-inline: 16px; }
    @media (min-width: 768px) { .miolo { padding-inline: 40px; } }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-3); }
    .cabeca .dr-h2 { text-wrap: balance; }
    .cabeca .dr-body-lg { margin-top: var(--sp-4); max-width: 52ch; }
    .cabeca--centro { text-align: center; }
    .cabeca--centro .dr-body-lg { margin-inline: auto; }
    @media (max-width: 767px) { .dr-h2 { font-size: 30px; } }

    /* ---------- O celular (desenhado em CSS) ---------- */
    .fone {
      --fw: 300px; position: relative; width: var(--fw); flex: none;
      padding: calc(var(--fw) * .034);
      background: linear-gradient(150deg, #353535, var(--grafite) 40%, #151515);
      border-radius: calc(var(--fw) * .16);
      box-shadow: inset 0 0 0 1.5px #4b4b4b, 0 40px 70px -30px rgba(78,52,46,.45), var(--sh-md);
    }
    .fone::before { /* botão lateral */
      content: ""; position: absolute; right: -3px; top: 24%; width: 3px; height: 12%; border-radius: 0 3px 3px 0; background: #2a2a2a;
    }
    .fone__tela {
      position: relative; overflow: hidden; aspect-ratio: 393 / 869;
      border-radius: calc(var(--fw) * .125); background: var(--app-fundo);
    }
    .fone__tela::after { /* câmera */
      content: ""; position: absolute; z-index: 5; top: 1.3%; left: 50%; width: 4%; aspect-ratio: 1; transform: translateX(-50%);
      border-radius: 50%; background: #0d0d0d; box-shadow: 0 0 0 2px rgba(0,0,0,.25);
    }
    .camada { position: absolute; inset: 0; background: var(--app-fundo); }
    .camada[data-tela="0"] { z-index: 2; }
    .pin-vitrine .camada[data-tela="0"] { z-index: auto; }
    .camada img, .fone__tela > img { width: 100%; height: auto; }
    /* Screenshot curto (lista de colmeias): vira um widget sob uma barra mel desenhada */
    .tela--curta { padding-top: 30%; }
    .tela--curta::before {
      content: ""; position: absolute; inset: 0 0 auto; height: 24%; z-index: 0;
      background: linear-gradient(180deg, var(--app-mel), #F2C547); border-radius: 0 0 18px 18px;
    }
    .tela--curta img { position: relative; z-index: 1; width: 92%; margin-inline: auto; border-radius: 12px; box-shadow: 0 6px 16px rgba(78,52,46,.16); }
    .tela--curta .esqueleto { display: grid; }
    .tela--curta::after { /* barra de abas desenhada */
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9%; z-index: 2;
      background:
        radial-gradient(circle at 12.5% 42%, var(--mel-escuro) 0 5%, transparent 5.5%),
        radial-gradient(circle at 37.5% 42%, var(--linha-forte) 0 5%, transparent 5.5%),
        radial-gradient(circle at 62.5% 42%, var(--linha-forte) 0 5%, transparent 5.5%),
        radial-gradient(circle at 87.5% 42%, var(--linha-forte) 0 5%, transparent 5.5%),
        #fff;
      background-size: 100% 100%; border-top: 1px solid var(--linha);
    }
    .esqueleto { display: none; position: relative; z-index: 1; gap: 8px; width: 92%; margin: 7% auto 0; }
    .esqueleto i { display: block; height: 0; padding-bottom: 19%; border-radius: 12px; background: #fff; box-shadow: 0 2px 6px rgba(78,52,46,.07); position: relative; }
    .esqueleto i::before { content: ""; position: absolute; left: 6%; top: 28%; width: 12%; height: 44%; border-radius: 50%; background: var(--mel-veu); }
    .esqueleto i::after { content: ""; position: absolute; left: 24%; top: 34%; width: 46%; height: 12%; border-radius: 6px; background: var(--linha); box-shadow: 0 calc(var(--fw) * .045) 0 -1px var(--superficie); }
    .esqueleto i:nth-child(2)::before { background: var(--sucesso-veu); }
    .esqueleto i:nth-child(3)::before, .esqueleto i:nth-child(5)::before { background: var(--erro-veu); }

    /* ---------- Hero: palco da vitrine (layout estático por padrão) ---------- */
    .palco { position: relative; }
    .palco__topo { text-align: center; max-width: 860px; margin-inline: auto; padding-inline: 16px; }
    .palco__topo .dr-eyebrow { display: inline-flex; align-items: center; gap: var(--sp-2); }
    .palco__topo .dr-eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sucesso); box-shadow: 0 0 0 4px var(--sucesso-veu); }
    .palco__titulo { margin-top: var(--sp-4); font-size: clamp(40px, 6vw, 80px); line-height: 1; letter-spacing: -.03em; text-wrap: balance; }
    .palco__sub { margin: var(--sp-5) auto 0; max-width: 46ch; }
    .acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); margin-top: var(--sp-6); }
    .palco__fone { display: flex; justify-content: center; margin-top: var(--sp-8); }
    .palco__fone .fone { --fw: 290px; }
    .marcadores { display: none; }
    @media (max-width: 767px) { .palco__fone .fone { --fw: 236px; } .palco__fone { margin-top: var(--sp-7); } }

    /* Funcionalidades = chamadas da vitrine (estático: grade de cards C6) */
    .chamadas { margin-top: var(--sp-9); }
    .chamadas .cabeca { margin-bottom: var(--sp-7); }
    .chamadas__lista { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); }
    @media (max-width: 1023px) { .chamadas__lista { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 599px) { .chamadas__lista { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- C6: cards com sombra média e tilt 3D sutil ---------- */
    .c6 {
      position: relative; background: var(--branco); border-radius: var(--r-lg); box-shadow: var(--sh-md);
      padding: var(--sp-5); transform-style: preserve-3d; will-change: transform;
      transition: box-shadow .25s ease;
    }
    .c6:hover { box-shadow: var(--sh-lg); }
    .c6__icone { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--mel-veu); color: var(--terra-escura); margin-bottom: var(--sp-4); }
    .c6 .dr-h4 { margin-bottom: var(--sp-2); font-size: 19px; }

    /* ---------- Modo pinado (classe posta pelo JS só com movimento e ≥1100px) ---------- */
    .pin-vitrine [data-secao="hero"] { padding: 0; height: 100vh; min-height: 680px; overflow: hidden; }
    .pin-vitrine .palco { height: 100%; }
    .pin-vitrine .palco__topo { position: absolute; left: 0; right: 0; top: clamp(32px, 7vh, 72px); z-index: 2; }
    .pin-vitrine .palco__fone { position: absolute; inset: 0; margin: 0; align-items: center; z-index: 3; pointer-events: none; }
    .pin-vitrine .palco__fone .fone { --fw: min(310px, calc((100vh - 120px) * .44)); pointer-events: auto; }
    .pin-vitrine .chamadas { position: absolute; inset: 0; margin: 0; z-index: 4; pointer-events: none; }
    .pin-vitrine .chamadas .cabeca { position: absolute; left: 0; right: 0; top: clamp(24px, 5vh, 56px); margin: 0; }
    .pin-vitrine .chamadas .cabeca .dr-h2 { font-size: 30px; }
    .pin-vitrine .chamadas__lista { display: block; }
    .pin-vitrine .chamada { position: absolute; width: min(290px, calc((100% - 380px) / 2 - 40px)); pointer-events: auto; }
    .pin-vitrine .chamada[data-lado="e"] { right: calc(50% + 196px); top: 34%; }
    .pin-vitrine .chamada[data-lado="d"] { left: calc(50% + 196px); top: 52%; }
    .pin-vitrine .chamada::after { /* fio até o celular */
      content: ""; position: absolute; top: 50%; width: 44px; height: 1.5px; background: var(--mel-escuro);
    }
    .pin-vitrine .chamada[data-lado="e"]::after { left: 100%; }
    .pin-vitrine .chamada[data-lado="d"]::after { right: 100%; }
    .pin-vitrine .marcadores { display: flex; position: absolute; z-index: 5; left: 50%; bottom: clamp(16px, 3vh, 32px); transform: translateX(-50%); gap: var(--sp-2); }
    .marcadores i { width: 28px; height: 4px; border-radius: 4px; background: var(--linha-forte); }
    .marcadores i.ativo { background: var(--mel-escuro); }

    /* ---------- Prova ---------- */
    .provas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-5); }
    .prova__valor { display: block; font-size: clamp(36px, 4vw, 52px); line-height: 1; color: var(--terra-escura); }
    .prova__rotulo { display: block; margin-top: var(--sp-3); color: var(--corpo); font-size: var(--fs-small); line-height: 1.5; }
    .prova__barra { display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--mel); margin-bottom: var(--sp-4); }
    @media (max-width: 899px) { .provas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); } }

    /* ---------- Problema ---------- */
    .problema { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--sp-8); align-items: start; }
    .problema__num { display: block; margin-top: var(--sp-6); font-size: clamp(80px, 10vw, 136px); line-height: .9; color: var(--terra-escura); letter-spacing: -.04em; }
    .problema__texto { margin-top: var(--sp-3); max-width: 34ch; }
    .consequencias { display: grid; gap: var(--sp-4); }
    .consequencias .c6 { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
    .consequencias .dr-icone { color: var(--erro); margin-top: 2px; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- Como funciona: três mini celulares ---------- */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); margin-top: var(--sp-7); }
    .passo { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--sp-6) var(--sp-5); }
    .passo .fone { --fw: 168px; margin-bottom: var(--sp-5); }
    .passo__num { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; color: var(--petroleo); }
    .passo .dr-h4 { margin-block: var(--sp-2); }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); max-width: 440px; margin-inline: auto; } }

    /* ---------- Para quem ---------- */
    .perfis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); margin-top: var(--sp-7); }
    .perfil { padding: var(--sp-6) var(--sp-5); border-top: 4px solid var(--mel); }
    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); margin-bottom: var(--sp-3); }
    @media (max-width: 899px) { .perfis { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Tecnologia ---------- */
    .tec { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
    .pilares { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
    .pilares .c6__icone { background: var(--petroleo-veu); color: var(--petroleo); }
    @media (max-width: 1023px) { .tec { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }
    @media (max-width: 599px) { .pilares { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Equipe ---------- */
    .pessoas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); margin-top: var(--sp-7); }
    .pessoa { display: flex; align-items: center; gap: var(--sp-4); }
    .pessoa img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; }
    .pessoa .dr-h4 { font-size: 18px; }
    .pessoa__cargo { font-size: var(--fs-small); color: var(--suave); line-height: 1.45; margin-top: 2px; }
    .apoios {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-5) var(--sp-7);
      margin-top: var(--sp-6); padding: var(--sp-6); background: var(--grafite); border-radius: var(--r-lg); box-shadow: var(--sh-md);
    }
    .apoio { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 80px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); }
    .apoio__logo img { max-height: 60px; width: auto; max-width: 170px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }
    @media (max-width: 899px) { .pessoas { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Depoimento ---------- */
    .citacao { max-width: 820px; margin-inline: auto; padding: var(--sp-8) var(--sp-7); text-align: center; }
    .citacao .dr-quote { font-size: clamp(22px, 2.6vw, 32px); color: var(--terra-escura); text-wrap: balance; }
    .citacao__aspa { display: block; font-family: var(--serif); font-size: 88px; line-height: .5; height: 36px; color: var(--mel-escuro); }
    .citacao figcaption { display: inline-flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-6); text-align: left; }
    .citacao figcaption img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
    .citacao__nome { font-weight: 700; color: var(--ink); display: block; }
    .citacao__local { font-size: var(--fs-small); color: var(--suave); }
    @media (max-width: 599px) { .citacao { padding: var(--sp-7) var(--sp-5); } }

    /* ---------- Contato ---------- */
    .contato { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--sp-6); margin-top: var(--sp-7); align-items: start; }
    .form { display: grid; gap: var(--sp-4); padding: var(--sp-6); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea { font: inherit; color: var(--ink); background: var(--creme); border: var(--bd-forte); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); width: 100%; }
    .campo textarea { min-height: 128px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-3); }
    .canal { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5); }
    .canal svg { color: var(--petroleo); flex: none; }
    .canal a { font-weight: 600; overflow-wrap: anywhere; text-underline-offset: 3px; }
    .contato .acoes { justify-content: flex-start; margin-top: var(--sp-5); }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Rodapé ---------- */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding: var(--sp-7) 0 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1080px; margin: var(--sp-5) auto 0; padding-inline: 40px; color: var(--tenue); }
    @media (max-width: 767px) { .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); } footer > [data-aviso-provisorio] { padding-inline: 16px; } }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N5 · índice em coluna fixa à esquerda com seções e progresso) -->
  <nav data-secao="nav" class="indice" aria-label="Índice">
    <a class="indice__marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="72" height="72"></a>
    <div class="indice__nav">
      <p class="indice__rotulo" data-c="marca.nome"></p>
      <div class="indice__lista">
        <span class="indice__trilho" aria-hidden="true"><span class="indice__fio"></span></span>
        <a href="#funcionalidades" data-alvo="funcionalidades" data-c="funcionalidades.eyebrow"></a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      /* Screenshot curto (proporção larga) ganha moldura de widget, sem esticar. */
      function marcarTelas() {
        document.querySelectorAll('.fone__tela img, .camada img').forEach(function (img) {
          function medir() {
            if (!img.naturalWidth) return;
            var alvo = img.closest('.camada') || img.closest('.fone__tela');
            alvo.classList.toggle('tela--curta', img.naturalHeight / img.naturalWidth < 1.2);
          }
          if (img.complete) medir(); else img.addEventListener('load', medir);
        });
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Fiação (sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) { if (email) a.setAttribute('href', 'mailto:' + email.v); });
        document.querySelectorAll('[data-ano]').forEach(function (el) { el.textContent = '© ' + new Date().getFullYear(); });
        marcarTelas();

        // Chamadas: par por tela (0: mapa + offline · 1: revisão + dúvidas · 2: colmeia + produção).
        var PARES = [[0, 4], [2, 3], [1, 5]];
        var chamadas = document.querySelectorAll('.chamada');
        PARES.forEach(function (par, p) {
          par.forEach(function (idx, k) {
            var el = chamadas[idx];
            if (!el) return;
            el.setAttribute('data-par', p);
            el.setAttribute('data-lado', k === 0 ? 'e' : 'd');
          });
        });

        /* ---- N5: progresso e seção ativa (estado, não movimento) ---- */
        var fio = document.querySelector('.indice__fio');
        var barra = document.querySelector('.indice__barra');
        var pct = document.querySelector('[data-pct]');
        var links = Array.prototype.slice.call(document.querySelectorAll('.indice__lista a'));
        var tick = false;
        function atualizar() {
          tick = false;
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var f = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
          if (fio) fio.style.transform = 'scaleY(' + f + ')';
          if (barra) barra.style.transform = 'scaleX(' + f + ')';
          if (pct) pct.textContent = String(Math.round(f * 100)).padStart(2, '0');
          var ativo = null;
          links.forEach(function (a) {
            var alvo = document.getElementById(a.getAttribute('data-alvo'));
            if (alvo && alvo.getBoundingClientRect().top < window.innerHeight * 0.45) ativo = a;
          });
          links.forEach(function (a) { a.classList.toggle('ativo', a === ativo); });
        }
        window.addEventListener('scroll', function () { if (!tick) { tick = true; requestAnimationFrame(atualizar); } }, { passive: true });
        window.addEventListener('resize', atualizar);
        atualizar();

        /* ---- Movimento ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();

        // Efeito principal: celular pinado troca de tela conforme o scroll.
        mm.add('(prefers-reduced-motion: no-preference) and (min-width: 1100px)', function () {
          var raiz = document.documentElement;
          raiz.classList.add('pin-vitrine');
          var hero = document.querySelector('[data-secao="hero"]');
          var fone = document.querySelector('[data-fone]');
          var telas = gsap.utils.toArray('[data-tela]');
          var marcas = gsap.utils.toArray('.marcadores i');
          var cabecaF = document.querySelector('.chamadas .cabeca');
          function par(p) { return gsap.utils.toArray('.chamada[data-par="' + p + '"]'); }
          function marcar(i) { marcas.forEach(function (m, k) { m.classList.toggle('ativo', k === i); }); }

          gsap.set(telas.slice(1), { yPercent: 100 });
          gsap.set(cabecaF, { autoAlpha: 0, y: 20 });
          [0, 1, 2].forEach(function (p) {
            par(p).forEach(function (c) { gsap.set(c, { autoAlpha: 0, x: c.getAttribute('data-lado') === 'e' ? -40 : 40 }); });
          });
          // O celular começa "saindo" da base do palco, abaixo do título.
          function deslocamento() { return Math.max(0, window.innerHeight * 0.5 - 40); }

          // Entrada de carga: o celular sobe até a posição de vitrine (pronto em ~1s).
          gsap.set(fone, { y: deslocamento });
          gsap.from(fone, { y: '+=160', duration: 1, ease: 'power3.out' });

          var tl = gsap.timeline({
            defaults: { ease: 'power2.inOut' },
            scrollTrigger: {
              trigger: hero, start: 'top top', end: '+=320%', pin: true, scrub: 0.6, invalidateOnRefresh: true,
              onUpdate: function (st) { marcar(st.progress < 0.45 ? 0 : st.progress < 0.75 ? 1 : 2); }
            }
          });
          tl.to('.palco__topo', { autoAlpha: 0, y: -80, duration: 0.8 }, 0)
            .to(fone, { y: 0, duration: 1 }, 0)
            .to(cabecaF, { autoAlpha: 1, y: 0, duration: 0.6 }, 0.5)
            .to(par(0), { autoAlpha: 1, x: 0, duration: 0.6, stagger: 0.15 }, 0.7)
            .to(par(0), { autoAlpha: 0, y: -24, duration: 0.5 }, 1.8)
            .to(telas[1], { yPercent: 0, duration: 0.9 }, 1.8)
            .to(telas[0], { yPercent: -18, duration: 0.9 }, 1.8)
            .to(par(1), { autoAlpha: 1, x: 0, duration: 0.6, stagger: 0.15 }, 2.3)
            .to(par(1), { autoAlpha: 0, y: -24, duration: 0.5 }, 3.3)
            .to(telas[2], { yPercent: 0, duration: 0.9 }, 3.3)
            .to(telas[1], { yPercent: -18, duration: 0.9 }, 3.3)
            .to(par(2), { autoAlpha: 1, x: 0, duration: 0.6, stagger: 0.15 }, 3.8)
            .to({}, { duration: 0.6 });

          return function () { raiz.classList.remove('pin-vitrine'); };
        });

        // Revelações gerais e tilt (só com movimento).
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          gsap.utils.toArray('.provas, .consequencias, .passos, .perfis, .pilares, .pessoas, .canais').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, y: 28, rotationX: -8, transformPerspective: 800, duration: 0.7, ease: 'power3.out', stagger: 0.09,
              scrollTrigger: { trigger: lista, start: 'top 85%', once: true }
            });
          });
          if (window.innerWidth < 1100) {
            gsap.from('.palco__topo > *', { autoAlpha: 0, y: 18, duration: 0.6, stagger: 0.08, ease: 'power2.out' });
            gsap.from('.palco__fone .fone', { y: 60, duration: 0.9, ease: 'power3.out', delay: 0.2 });
          }
        });

        // C6: tilt 3D sutil seguindo o ponteiro (só mouse; toque fica estático).
        mm.add('(prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine)', function () {
          var limpar = [];
          document.querySelectorAll('.c6').forEach(function (card) {
            var rx = gsap.quickTo(card, 'rotationX', { duration: 0.5, ease: 'power3.out' });
            var ry = gsap.quickTo(card, 'rotationY', { duration: 0.5, ease: 'power3.out' });
            gsap.set(card, { transformPerspective: 900 });
            function mover(e) {
              var r = card.getBoundingClientRect();
              ry(((e.clientX - r.left) / r.width - 0.5) * 7);
              rx(-((e.clientY - r.top) / r.height - 0.5) * 7);
            }
            function sair() { rx(0); ry(0); }
            card.addEventListener('pointermove', mover);
            card.addEventListener('pointerleave', sair);
            limpar.push(function () { card.removeEventListener('pointermove', mover); card.removeEventListener('pointerleave', sair); });
          });
          return function () { limpar.forEach(function (f) { f(); }); };
        });
      });
    })();
  </script>
