<!doctype html>
<html lang="pt-BR" data-template="07">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 07 Diário</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       07 Diário · campo · N2 / C4 / R4
       Um dia no apiário, hora a hora, em páginas de caderno pautado.
       Em telas ≥ 900px e sem movimento reduzido, o hero (que inclui o
       "como funciona") vira uma linha do tempo horizontal pinada ao scroll.
       Sem JS, em movimento reduzido ou no celular: páginas empilhadas com
       as horas numa coluna à esquerda. Nada fica escondido.
       As horas vêm de data-hora (CSS attr): são marcação do diário, não cópia.
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --respiro: var(--sp-9); --pauta: 32px; }
    @media (max-width: 767px) { :root { --respiro: 64px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--petroleo); outline-offset: 2px;
    }
    body { overflow-x: clip; }

    /* ---------- Cabeçalho do caderno (não fixo) ---------- */
    .capa-caderno { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-5); padding-block: var(--sp-4); }
    .capa-caderno img { width: 64px; height: 64px; }
    .capa-caderno time { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .16em; text-transform: uppercase; color: var(--terra); text-align: right; }
    @media (max-width: 767px) { .capa-caderno img { width: 56px; height: 56px; } .capa-caderno time { font-size: 11px; max-width: 18ch; } }

    /* ---------- N2: pílula inferior centralizada, estilo app ---------- */
    .pilula {
      position: fixed; z-index: 60; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; align-items: center; gap: var(--sp-1); padding: 6px;
      background: var(--grafite); border-radius: var(--r-pill); box-shadow: var(--sh-lg);
    }
    .pilula a {
      flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: var(--sp-2); height: 44px; padding-inline: 12px;
      border-radius: var(--r-pill); color: var(--creme); text-decoration: none;
      font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase;
      transition: background-color .2s ease, color .2s ease;
    }
    .pilula a:hover { background: var(--grafite-suave); }
    .pilula a.ativo { background: var(--mel-veu); color: var(--terra-escura); }
    .pilula .dr-icone { width: 20px; height: 20px; flex: none; }
    .pilula__coroa img { width: 30px; max-width: none; height: auto; }
    .pilula__rotulo { display: none; }
    .pilula .pilula__baixar { background: var(--mel); color: var(--terra-escura); font-family: var(--sans); font-weight: 700; font-size: var(--fs-small); letter-spacing: 0; text-transform: none; padding-inline: 18px; }
    .pilula .pilula__baixar:hover { background: var(--mel-escuro); }
    @media (min-width: 1200px) { .pilula__rotulo { display: inline; } }
    @media (max-width: 767px) {
      .pilula { left: 16px; transform: none; }
      .pilula a { padding-inline: 10px; }
      .pilula__extra { display: none !important; }
      .pilula .pilula__baixar { padding-inline: 12px; }
      .pilula__baixar span { display: none; }
    }
    @media (min-width: 768px) { .pilula__baixar svg { display: none; } }

    /* ---------- Hero: o diário (empilhado por padrão) ---------- */
    .diario {
      position: relative; padding-block: var(--sp-7) var(--sp-9);
      background-color: var(--creme-papel);
      background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--pauta) - 1px), var(--linha) calc(var(--pauta) - 1px) var(--pauta));
      border-block: 1px solid var(--linha-forte);
    }
    .pista { position: relative; display: grid; gap: var(--sp-8); }
    .pista::before { /* fio do dia, entre as horas e as notas */
      content: ""; position: absolute; top: 12px; bottom: 0; left: calc(32px + 127px); width: 2px; background: var(--mel-claro);
    }
    .pagina {
      position: relative; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--sp-6);
    }
    .pagina::before {
      content: attr(data-hora); font-family: var(--mono); font-weight: 500; font-size: 28px; line-height: 1;
      letter-spacing: -.02em; color: var(--petroleo); padding-top: 6px;
    }
    .pagina::after { /* ponto na margem */
      content: ""; position: absolute; left: 122px; top: 12px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--mel); box-shadow: 0 0 0 4px var(--creme-papel);
    }
    .pagina > * { min-width: 0; }
    .pista > [data-secao="como-funciona"] { display: grid; gap: var(--sp-8); }
    .regua { display: none; }

    .capa .dr-eyebrow { color: var(--terra); }
    .capa h1 { margin-top: var(--sp-4); font-size: clamp(44px, 5.6vw, 84px); line-height: .98; letter-spacing: -.025em; max-width: 12ch; text-wrap: balance; }
    .capa__lede { margin-top: var(--sp-5); font-size: var(--fs-body-lg); line-height: 1.6; color: var(--corpo); max-width: 40ch; }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }

    .colada { position: relative; max-width: 520px; padding: 12px 12px 18px; background: var(--branco); box-shadow: var(--sh-md); transform: rotate(-1.6deg); }
    .colada img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; }
    .colada::before, .colada::after {
      content: ""; position: absolute; top: -12px; width: 92px; height: 26px; background: rgba(251,224,140,.85);
    }
    .colada::before { left: 18px; transform: rotate(-6deg); }
    .colada::after { right: 18px; transform: rotate(5deg); }
    .colada figcaption { margin-top: var(--sp-3); font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.4; color: var(--terra); }

    .nota .dr-eyebrow { margin-bottom: var(--sp-3); }
    .nota .dr-h2 { max-width: 16ch; }
    .pagina.passo { grid-template-columns: 140px minmax(0, 520px) 170px; column-gap: var(--sp-7); align-items: start; }
    .passo__num { font-size: var(--fs-small); letter-spacing: .12em; color: var(--terra); }
    .passo .dr-h3 { margin-block: var(--sp-2) var(--sp-3); font-family: var(--serif); font-weight: 500; color: var(--terra-escura); }
    .passo img { width: 170px; height: auto; max-height: 360px; object-fit: cover; object-position: top; border-radius: 18px; border: 5px solid var(--grafite); background: var(--branco); }
    .passo .dr-caption { margin-top: var(--sp-3); color: var(--terra); }
    .fim .dr-icone { color: var(--petroleo); margin-bottom: var(--sp-3); }
    .fim .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); margin-bottom: var(--sp-3); }

    @media (max-width: 767px) {
      .pista::before { left: 20px; top: 8px; }
      .pagina { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); padding-left: 24px; }
      .pagina::after { left: -1px; top: 6px; width: 10px; height: 10px; }
      .pagina::before { font-size: 22px; padding-top: 0; }
      .pagina.passo { grid-template-columns: minmax(0, 1fr); }
      .passo img { width: 160px; }
      .colada { transform: rotate(-1deg); }
    }

    /* ---------- Hero pinado (classe posta pelo JS só ≥ 900px e com movimento) ---------- */
    .diario.e-pinado { height: 100vh; min-height: 640px; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .e-pinado .pista::before { display: none; }
    .e-pinado .pista-janela { flex: 1; min-height: 0; display: flex; align-items: stretch; }
    .e-pinado .pista {
      display: flex; gap: 0; width: max-content; max-width: none; margin: 0; height: 100%;
      padding-left: max(32px, calc((100vw - 1200px) / 2 + 32px)); padding-right: 30vw; will-change: transform;
    }
    .e-pinado .pista > [data-secao="como-funciona"] { display: flex; flex: none; gap: 0; height: 100%; }
    .e-pinado .pagina {
      display: flex; flex-direction: column; justify-content: center; gap: var(--sp-5);
      flex: none; width: var(--w, 520px); height: 100%; padding: 96px var(--sp-7) var(--sp-7);
      border-left: 1px dashed var(--linha-forte);
    }
    .e-pinado .pagina::before { position: absolute; top: 40px; left: var(--sp-7); padding: 0; font-size: 30px; }
    .e-pinado .pagina::after { left: -7px; top: 44px; width: 12px; height: 12px; }
    .e-pinado .capa { --w: 680px; border-left: 0; padding-left: 0; }
    .e-pinado .capa::before { left: 0; }
    .e-pinado .capa::after { display: none; }
    .e-pinado .foto { --w: 600px; }
    .e-pinado .nota { --w: 420px; }
    .e-pinado .passo { --w: 560px; display: grid; grid-template-columns: minmax(0, 1fr) 170px; align-content: center; }
    .e-pinado .fim { --w: 560px; }
    .e-pinado .regua { display: block; position: relative; height: 72px; flex: none; border-top: 1px solid var(--linha-forte); background: var(--creme-papel); }
    .regua__trilho { position: absolute; left: 32px; right: 32px; top: 22px; height: 2px; background: var(--linha-forte); }
    .regua__fill { position: absolute; inset: 0; background: var(--mel); transform-origin: left center; transform: scaleX(0); }
    .regua__marca { position: absolute; top: -5px; width: 2px; height: 12px; background: var(--terra-clara); }
    .regua__marca::after {
      content: attr(data-hora); position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--terra); white-space: nowrap;
    }

    /* ---------- R4: número de seção gigante em mono como marcador ---------- */
    main { counter-reset: secao; }
    .bloco { counter-increment: secao; padding-block: var(--respiro); scroll-margin-top: var(--sp-5); }
    .bloco__grade { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: var(--sp-6); }
    .marcador { position: relative; }
    .marcador::before {
      content: counter(secao, decimal-leading-zero); position: sticky; top: var(--sp-6); display: block;
      font-family: var(--mono); font-weight: 700; font-size: clamp(96px, 12vw, 184px); line-height: .8;
      letter-spacing: -.06em; color: var(--linha-forte);
    }
    .bloco__grade > :last-child { min-width: 0; padding-top: var(--sp-2); border-top: 2px solid var(--terra-escura); }
    .cabeca { padding-top: var(--sp-4); }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-3); }
    .cabeca + * { margin-top: var(--sp-7); }
    .intro { margin-top: var(--sp-4); max-width: 52ch; }
    @media (max-width: 1099px) {
      .bloco__grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); }
      .marcador::before { position: static; font-size: 88px; }
    }
    @media (max-width: 767px) { .dr-h2 { font-size: 30px; } .cabeca + * { margin-top: var(--sp-6); } }

    /* ---------- C4: hexágonos (clip-path), conteúdo centralizado ---------- */
    .hex {
      --hw: 300px; width: var(--hw); height: calc(var(--hw) * 1.1547); flex: none;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      background: var(--linha-forte); position: relative;
    }
    .hex__miolo {
      position: absolute; inset: 1.5px; clip-path: inherit; background: var(--creme-papel);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 0 calc(var(--hw) * .14);
    }
    .hex--mel .hex__miolo { background: var(--mel-veu); }
    .hex .dr-icone { color: var(--petroleo); margin-bottom: var(--sp-3); }
    .hex .dr-h4 { font-size: 18px; margin-bottom: var(--sp-2); }
    .hex .dr-body { font-size: 14.5px; line-height: 1.5; }

    .favos { display: flex; flex-wrap: wrap; --g: 10px; gap: 0 var(--g); }
    .favos--prova .hex { --hw: 196px; }
    .favos--prova .hex:nth-child(even) { margin-top: calc(var(--hw) * .5); }
    .hex__valor { font-family: var(--mono); font-weight: 500; font-size: 44px; line-height: 1; letter-spacing: -.04em; color: var(--terra-escura); }
    .hex__rotulo { margin-top: var(--sp-3); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    /* favo de três fileiras de dois, a do meio deslocada meio hexágono */
    .favos--seis { width: 772px; max-width: 100%; }
    .favos--seis .hex:nth-child(n+3) { margin-top: calc(300px * -0.2887 + 10px); }
    .favos--seis .hex:nth-child(3) { margin-left: 155px; }
    @media (max-width: 849px) {
      .favos--seis { width: auto; justify-content: center; gap: var(--g); }
      .favos--seis .hex:nth-child(n) { margin: 0; }
    }
    @media (max-width: 767px) {
      .favos--prova { justify-content: center; }
      .favos--prova .hex { --hw: 164px; }
      .favos--prova .hex:nth-child(even) { margin-top: calc(var(--hw) * .5); }
      .favos--prova .hex:nth-child(n+3) { margin-top: calc(var(--hw) * -0.2887 + 8px); }
      .favos--prova .hex:nth-child(4) { margin-top: calc(var(--hw) * .2113 + 8px); }
      .hex__valor { font-size: 32px; }
      .hex__rotulo { font-size: 10px; letter-spacing: .1em; }
      .favos--seis { display: grid; justify-content: stretch; gap: 0; }
      .favos--seis .hex { --hw: 300px; }
      .favos--seis .hex:nth-child(n+2) { margin-top: -64px; }
      .favos--seis .hex:nth-child(even) { justify-self: end; }
    }
    @media (max-width: 359px) { .favos--seis .hex { --hw: 280px; } }

    /* ---------- Problema ---------- */
    .problema { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr); gap: var(--sp-7); align-items: start; }
    .problema__valor { display: block; font-family: var(--mono); font-weight: 500; font-size: clamp(80px, 9vw, 128px); line-height: .9; letter-spacing: -.05em; color: var(--terra-escura); }
    .problema__valor + p { margin-top: var(--sp-3); max-width: 28ch; }
    .riscos > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); padding-block: var(--sp-4); border-bottom: 1px dashed var(--linha-forte); }
    .riscos .dr-icone { color: var(--erro); margin-top: 3px; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Para quem e tecnologia: linhas com selo hexagonal ---------- */
    .selos > li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-5); align-items: start; padding-block: var(--sp-5); border-top: 1px solid var(--linha); }
    .selos > li:last-of-type { border-bottom: 1px solid var(--linha); }
    .selo { width: 56px; height: 64px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--mel-veu); color: var(--terra-escura); }
    .selo--letra { font-family: var(--mono); font-weight: 700; font-size: 20px; }
    .selos--perfis { counter-reset: perfil; }
    .selos--perfis > li { counter-increment: perfil; grid-template-columns: 64px minmax(0, 4fr) minmax(0, 6fr); }
    .selos--perfis .selo::before { content: counter(perfil, upper-alpha); }
    .selos--perfis .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); }
    .selos--pilares { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--sp-6); }
    .selos--pilares > li:nth-last-of-type(2) { border-bottom: 1px solid var(--linha); }
    .selos--pilares .selo { background: var(--petroleo-veu); color: var(--petroleo); }
    .selos--pilares .dr-h4 { margin-bottom: var(--sp-2); }
    @media (max-width: 899px) {
      .selos--perfis > li { grid-template-columns: 64px minmax(0, 1fr); }
      .selos--perfis > li > p { grid-column: 2; }
      .selos--pilares { grid-template-columns: minmax(0, 1fr); }
      .selos--pilares > li:nth-last-of-type(2) { border-bottom: 0; }
    }

    /* ---------- Equipe: retratos em hexágono ---------- */
    .origem { margin-top: var(--sp-4); max-width: 56ch; }
    .pessoas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
    .pessoa { text-align: center; }
    .pessoa img { width: 168px; height: 194px; margin-inline: auto; object-fit: cover; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--creme-papel); }
    .pessoa .dr-h4 { margin-top: var(--sp-4); }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    .apoios { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-5) var(--sp-8); margin-top: var(--sp-8); padding: var(--sp-6); background: var(--grafite); border-radius: var(--r-lg); }
    .apoio { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 84px; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); }
    .apoio__logo img { max-height: 60px; width: auto; max-width: 170px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }
    @media (max-width: 767px) { .pessoas { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Depoimento: bilhete colado no diário ---------- */
    .bilhete { position: relative; max-width: 760px; padding: var(--sp-7) var(--sp-7) var(--sp-6); background-color: var(--creme-papel);
      background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--pauta) - 1px), var(--linha) calc(var(--pauta) - 1px) var(--pauta));
      box-shadow: var(--sh-md); }
    .bilhete::before { content: ""; position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: rgba(251,224,140,.85); transform: rotate(-3deg); }
    .bilhete .dr-quote { font-size: clamp(24px, 2.8vw, 34px); line-height: 1.4; color: var(--terra-escura); }
    .bilhete figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .bilhete figcaption img { width: 56px; height: 64px; object-fit: cover; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .bilhete__nome { display: block; font-weight: 700; color: var(--ink); }
    .bilhete__local { display: block; font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 767px) { .bilhete { padding: var(--sp-6) var(--sp-5) var(--sp-5); } }

    /* ---------- Contato ---------- */
    .contato { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--sp-7); }
    .form { display: grid; gap: var(--sp-4); }
    .campo-f { display: grid; gap: var(--sp-2); }
    .campo-f label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo-f input, .campo-f textarea { font: inherit; font-size: var(--fs-body); color: var(--ink); width: 100%; background: var(--branco); border: var(--bd-forte); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4); }
    .campo-f textarea { min-height: 132px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); align-items: center; padding-block: var(--sp-4); border-bottom: 1px dashed var(--linha-forte); }
    .canais .dr-icone { color: var(--petroleo); }
    .canais a { font-weight: 600; font-size: var(--fs-body-lg); overflow-wrap: anywhere; text-underline-offset: 4px; }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Rodapé ---------- */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 112px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }

  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });
        document.querySelectorAll('[data-hoje]').forEach(function (el) {
          var hoje = new Date();
          el.setAttribute('datetime', hoje.toISOString().slice(0, 10));
          el.textContent = hoje.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        });
        var baixar = DR.valor('cta.baixar.texto');
        document.querySelectorAll('.pilula a').forEach(function (a) {
          var rot = a.querySelector('[data-c]');
          if (rot && rot.textContent) a.setAttribute('aria-label', rot.textContent);
        });
        var coroa = document.querySelector('.pilula__coroa');
        if (coroa) coroa.setAttribute('aria-label', DR.valor('marca.alt').v);
        if (baixar) document.querySelector('.pilula__baixar').setAttribute('aria-label', baixar.v);

        // Pílula: destaca a seção visível.
        var links = Array.prototype.slice.call(document.querySelectorAll('.pilula a[href^="#"]:not(.pilula__coroa)'));
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function (es) {
            es.forEach(function (e) {
              // Na pista pinada a seção pode tocar a tela só pela borda direita: ignora.
              if (!e.isIntersecting || e.boundingClientRect.left > window.innerWidth / 2) return;
              links.forEach(function (a) { a.classList.toggle('ativo', a.getAttribute('href') === '#' + e.target.id); });
            });
          }, { rootMargin: '-45% 0px -50% 0px' });
          links.forEach(function (a) { var t = document.querySelector(a.getAttribute('href')); if (t) obs.observe(t); });
        }

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();

        // Efeito principal: linha do tempo horizontal pinada (só ≥ 900px).
        mm.add('(prefers-reduced-motion: no-preference) and (min-width: 900px)', function () {
          var diario = document.querySelector('.diario');
          var pista = diario.querySelector('.pista');
          var regua = diario.querySelector('.regua__trilho');
          var fill = diario.querySelector('.regua__fill');
          var paginas = Array.prototype.slice.call(pista.querySelectorAll('.pagina'));
          diario.classList.add('e-pinado');

          function distancia() { return Math.max(0, pista.scrollWidth - window.innerWidth); }

          // Marcas da régua: uma por página, na proporção do percurso.
          var marcas = paginas.map(function (p) {
            var m = document.createElement('span');
            m.className = 'regua__marca';
            m.setAttribute('data-hora', p.getAttribute('data-hora'));
            regua.appendChild(m);
            return m;
          });
          function posicionarMarcas() {
            // A página "chega" quando sua borda esquerda passa de 45% da tela.
            var d = distancia() || 1;
            var chegada = window.innerWidth * 0.45;
            paginas.forEach(function (p, i) {
              var f = Math.min(1, Math.max(0, (p.offsetLeft - chegada) / d));
              marcas[i].style.left = (f * 100) + '%';
            });
          }
          posicionarMarcas();

          var tl = gsap.timeline({
            defaults: { ease: 'none' },
            scrollTrigger: {
              trigger: diario, start: 'top top', end: function () { return '+=' + distancia(); },
              pin: true, scrub: 0.5, invalidateOnRefresh: true, anticipatePin: 1,
              onRefresh: posicionarMarcas
            }
          });
          tl.to(pista, { x: function () { return -distancia(); } }, 0)
            .to(fill, { scaleX: 1 }, 0);

          // Entrada da capa.
          gsap.from('.capa > div > *', { y: 30, autoAlpha: 0, duration: 0.8, ease: 'power3.out', stagger: 0.1 });
          // As páginas seguintes "assentam" quando entram pela direita.
          paginas.slice(1).forEach(function (p) {
            if (p.getBoundingClientRect().left < window.innerWidth * 0.85) return; // já visível na carga
            gsap.from(p.children, {
              y: 40, rotation: 1.5, autoAlpha: 0, duration: 0.6, ease: 'power2.out',
              scrollTrigger: { trigger: p, containerAnimation: tl, start: 'left 85%', toggleActions: 'play none none reverse' }
            });
          });

          // Link "como funciona" leva ao ponto certo do percurso.
          function pular(ev) {
            var st = tl.scrollTrigger, alvo = document.getElementById('como-funciona');
            if (!st || !alvo) return;
            ev.preventDefault();
            var f = (alvo.offsetLeft - paginas[0].offsetLeft) / (distancia() || 1);
            window.scrollTo({ top: st.start + f * (st.end - st.start) + 2, behavior: 'smooth' });
          }
          var atalho = document.querySelector('[data-pular-pista]');
          atalho.addEventListener('click', pular);

          return function () {
            atalho.removeEventListener('click', pular);
            diario.classList.remove('e-pinado');
            marcas.forEach(function (m) { m.remove(); });
          };
        });

        // Movimento comum (qualquer largura).
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          gsap.utils.toArray('.marcador').forEach(function (m) {
            gsap.from(m, { xPercent: -30, autoAlpha: 0, duration: 0.9, ease: 'power3.out', scrollTrigger: { trigger: m, start: 'top 85%', once: true } });
          });
          gsap.utils.toArray('.favos').forEach(function (f) {
            gsap.from(f.children, { scale: 0.6, autoAlpha: 0, duration: 0.6, ease: 'back.out(1.6)', stagger: 0.08, scrollTrigger: { trigger: f, start: 'top 85%', once: true } });
          });
          gsap.utils.toArray('.selos, .riscos, .pessoas').forEach(function (l) {
            gsap.from(l.children, { y: 20, autoAlpha: 0, duration: 0.6, ease: 'power2.out', stagger: 0.08, scrollTrigger: { trigger: l, start: 'top 85%', once: true } });
          });
        });
      });
    })();
  </script>
</body>
</html>
