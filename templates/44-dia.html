<!doctype html>
<html lang="pt-BR" data-template="44">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 44 Dia</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       44 Dia · narrativa · N1 / C5 / R7
       Um dia de campo do amanhecer ao fim de tarde. Cada seção é uma hora
       do dia, marcada por um pequeno arco solar ao lado do eyebrow.
       Efeito: o sol percorre um arco no céu conforme a página rola (scrub
       pelo documento inteiro) e o céu muda entre tons da marca:
       creme -> véu de mel -> mel claro -> superfície. Com movimento e
       >= 900px o céu fica fixo atrás de tudo; abaixo disso ou com movimento
       reduzido, o céu fica só no hero, parado no amanhecer.
       N1: trilho lateral com ícones do sprite (no celular vira barra no topo).
       C5: linhas de tabela com sparkline. R7: scroll contínuo, sem divisões;
       só a tipografia marca a mudança de seção.
       Regras: nada de opacity < 1 fora do gsap.matchMedia; canto inferior
       direito livre (switcher).
       ================================================================= */

    :root { --trilho: 76px; --respiro: 120px; }
    @media (max-width: 767px) { :root { --trilho: 0px; --respiro: 80px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }

    body { padding-left: var(--trilho); }
    @media (max-width: 767px) { body { padding-top: 60px; } }

    /* ---------- N1: trilho lateral ---------- */
    .trilho {
      position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: var(--trilho);
      display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
      padding-block: var(--sp-4); background: var(--creme-papel); border-right: 1px solid var(--linha);
    }
    .trilho__coroa { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: var(--sp-4); }
    .trilho__coroa img { width: 40px; height: auto; }
    .trilho ul { display: flex; flex-direction: column; gap: var(--sp-1); }
    .trilho a.trilho__item {
      position: relative; display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-md);
      color: var(--terra); text-decoration: none; transition: background-color .2s ease, color .2s ease;
    }
    .trilho a.trilho__item:hover, .trilho a.trilho__item:focus-visible { background: var(--mel-veu); color: var(--terra-escura); }
    .trilho a.trilho__item[aria-current="true"] { background: var(--terra-escura); color: var(--mel); }
    .trilho__rotulo {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
    }
    .trilho a.trilho__item:hover .trilho__rotulo, .trilho a.trilho__item:focus-visible .trilho__rotulo {
      width: auto; height: auto; clip: auto; overflow: visible; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
      padding: 6px 12px; border-radius: var(--r-sm); background: var(--grafite); color: var(--creme);
      font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase;
    }
    .trilho__cta { margin-top: auto; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--mel); color: var(--terra-escura); position: relative; }
    .trilho__cta:hover { background: var(--mel-escuro); }
    .trilho__cta:hover .trilho__rotulo, .trilho__cta:focus-visible .trilho__rotulo {
      width: auto; height: auto; clip: auto; overflow: visible; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
      padding: 6px 12px; border-radius: var(--r-sm); background: var(--grafite); color: var(--creme); font-weight: 600; font-size: var(--fs-small);
    }
    @media (max-width: 767px) {
      .trilho { right: 0; bottom: auto; width: auto; height: 60px; flex-direction: row; padding: 0 var(--sp-3); border-right: 0; border-bottom: 1px solid var(--linha); }
      .trilho__coroa { margin: 0 auto 0 0; width: 44px; }
      .trilho__coroa img { width: 34px; }
      .trilho ul { flex-direction: row; gap: 0; }
      .trilho a.trilho__item { width: 38px; height: 44px; }
      .trilho a.trilho__item .dr-icone { width: 21px; height: 21px; }
      .trilho__cta { display: none; }
    }

    /* ---------- O céu ---------- */
    .ceu { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--creme); overflow: hidden; }
    .ceu svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ceu .arco-sol { fill: none; stroke: var(--mel-escuro); stroke-width: 1.5; stroke-dasharray: 2 10; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .ceu .halo { fill: var(--mel-claro); }
    .ceu .halo-2 { fill: var(--mel-veu); }
    .ceu .sol { fill: var(--mel); }
    html.ceu-vivo .ceu { position: fixed; left: var(--trilho); }
    html.ceu-vivo main > section, html.ceu-vivo .hero { background: transparent; }
    main { position: relative; z-index: 1; }
    main > section { position: relative; z-index: 1; }

    /* ---------- Hero: amanhecer ---------- */
    .hero { position: relative; min-height: min(100vh, 980px); display: flex; flex-direction: column; overflow: hidden; }
    html.ceu-vivo .hero { overflow: visible; }
    .hero__conteudo { position: relative; z-index: 2; flex: 1; padding-top: var(--sp-7); padding-bottom: 220px; }
    .hero__marca { width: 64px; height: 64px; margin-bottom: var(--sp-7); }
    .hero h1 { margin-top: var(--sp-4); font-size: clamp(44px, 6vw, 84px); max-width: 13ch; }
    .hero .dr-body-lg { margin-top: var(--sp-5); max-width: 42ch; color: var(--ink); }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    .horizonte { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; width: 100%; height: 260px; }
    .horizonte .morro-1 { fill: var(--superficie); }
    .horizonte .morro-2 { fill: var(--linha-forte); }
    .horizonte .morro-3 { fill: var(--terra-clara); }
    .horizonte .caixa { fill: var(--terra); }
    .horizonte .tampa { fill: var(--terra-escura); }
    .horizonte .flor { fill: var(--mel); }
    .horizonte .haste { stroke: var(--terra); stroke-width: 1.5; fill: none; }
    @media (max-width: 767px) { .hero__conteudo { padding-bottom: 170px; } .horizonte { height: 180px; } .hero__marca { margin-bottom: var(--sp-6); } }

    /* ---------- R7: seções contínuas, tipografia marca a hora ---------- */
    main > section:not(.hero) { padding-block: var(--respiro) 0; scroll-margin-top: 24px; }
    main > section:last-child { padding-bottom: var(--respiro); }
    .hora { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .hora svg { width: 44px; height: 24px; flex: none; overflow: visible; }
    .hora .mini-arco { fill: none; stroke: var(--terra-clara); stroke-width: 1.5; }
    .hora .mini-chao { stroke: var(--terra-clara); stroke-width: 1.5; }
    .hora .mini-sol { fill: var(--mel-escuro); }
    .titulo { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 4.6vw, 60px); line-height: 1.05; letter-spacing: -.02em; color: var(--terra-escura); max-width: 18ch; text-wrap: balance; }
    .titulo + * { margin-top: var(--sp-7); }
    .intro { margin-top: var(--sp-5); max-width: 52ch; }
    .intro + * { margin-top: var(--sp-7); }

    /* ---------- C5: linhas de tabela com sparkline ---------- */
    .tabela { border-top: 1.5px solid var(--terra-escura); }
    .tabela > li {
      display: grid; grid-template-columns: 40px minmax(0, 3fr) minmax(0, 5fr) 140px; gap: var(--sp-5); align-items: center;
      padding-block: var(--sp-4); border-bottom: 1px solid var(--linha-forte);
    }
    .tabela .dr-icone { color: var(--petroleo); }
    .tabela .dr-h4 { font-size: 18px; }
    .tabela .dr-body { color: var(--corpo); }
    .spark { width: 140px; height: 40px; overflow: visible; }
    .spark path { fill: none; stroke: var(--petroleo); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .spark .area { fill: var(--petroleo-veu); stroke: none; }
    .spark circle { fill: var(--mel); stroke: var(--terra-escura); stroke-width: 1; }
    .tabela--numeros > li { grid-template-columns: minmax(0, 2fr) minmax(0, 4fr) 140px; }
    .tabela--numeros .dr-data { font-size: clamp(32px, 4vw, 48px); line-height: 1; color: var(--terra-escura); }
    .tabela__rotulo { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .14em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 899px) {
      .tabela > li { grid-template-columns: 32px minmax(0, 1fr) 96px; gap: var(--sp-2) var(--sp-4); align-items: start; }
      .tabela > li > .dr-body { grid-column: 2 / 4; }
      .tabela > li > .spark { grid-column: 3; grid-row: 1; width: 96px; height: 32px; }
      .tabela--numeros > li { grid-template-columns: minmax(0, 1fr) 96px; }
      .tabela--numeros > li > .tabela__rotulo { grid-column: 1 / 3; }
      .tabela--numeros > li > .spark { grid-column: 2; grid-row: 1; }
    }

    /* Problema */
    .problema-grade { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
    .estatistica__valor { display: block; font-size: clamp(96px, 12vw, 160px); line-height: .85; letter-spacing: -.05em; color: var(--terra-escura); }
    .estatistica p { margin-top: var(--sp-4); max-width: 30ch; }
    .consequencias > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); padding-block: var(--sp-4); }
    .consequencias .dr-icone { color: var(--erro); margin-top: 3px; }
    @media (max-width: 899px) { .problema-grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Como funciona: três horas do manejo */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-7); }
    .passo__numero { font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 1; color: var(--mel-escuro); }
    .passo .dr-h4 { margin-top: var(--sp-3); }
    .passo .dr-body { margin-top: var(--sp-2); }
    .passo figure { margin-top: var(--sp-5); }
    .passo img { width: 100%; max-width: 230px; aspect-ratio: 9 / 16; object-fit: cover; object-position: top; border-radius: 26px; border: 7px solid var(--grafite); background: var(--creme); }
    .passo figcaption { margin-top: var(--sp-3); max-width: 230px; color: var(--suave); }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); } }

    /* Para quem */
    .perfis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-7); }
    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--terra-escura); }
    .perfil p { margin-top: var(--sp-3); }
    @media (max-width: 899px) { .perfis { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); } }

    /* Depoimento */
    .citacao .dr-quote { font-size: clamp(28px, 4vw, 48px); line-height: 1.25; color: var(--terra-escura); max-width: 24ch; text-wrap: balance; }
    .citacao figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .citacao img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--linha-forte); }
    .citacao__nome { display: block; font-weight: 700; color: var(--ink); }
    .citacao__local { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }

    /* Equipe */
    .pessoas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
    .pessoa img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--linha-forte); }
    .pessoa .dr-h4 { margin-top: var(--sp-4); }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); }
    .apoios { display: flex; flex-wrap: wrap; gap: var(--sp-5) var(--sp-7); align-items: center; margin-top: var(--sp-8); }
    .apoio { display: flex; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 64px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); }
    .apoio__logo img { max-height: 48px; width: auto; max-width: 150px; }
    .apoio[data-fundo="escuro"] .apoio__logo { background: var(--grafite); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 899px) { .pessoas { grid-template-columns: minmax(0, 1fr); } .pessoa { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--sp-4); align-items: center; } .pessoa img { width: 72px; height: 72px; } .pessoa .dr-h4 { margin-top: 0; } }

    /* Contato */
    .contato-grade { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-8); }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink);
      background: var(--branco); border: var(--bd-forte); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-4); }
    .canais li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-3); align-items: center; }
    .canais .dr-icone { color: var(--petroleo); }
    .canais a { font-weight: 600; font-size: var(--fs-body-lg); overflow-wrap: anywhere; text-underline-offset: 3px; }
    .contato-acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    @media (max-width: 899px) { .contato-grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Rodapé: o anoitecer */
    footer[data-secao="rodape"] { position: relative; z-index: 1; background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N1 · trilho lateral com ícones do sprite) -->
  <nav data-secao="nav" class="trilho">
    <a class="trilho__coroa" href="#inicio"><img src="../img/logos/coroa-cor.png" alt="" data-c-alt="marca.alt" width="40" height="29"></a>
    <ul>
      <li><a class="trilho__item" href="#problema"><svg class="dr-icone" aria-hidden="true"><use href="#dr-alerta"></use></svg><span class="trilho__rotulo" data-c="problema.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#como-funciona"><svg class="dr-icone" aria-hidden="true"><use href="#dr-revisao"></use></svg><span class="trilho__rotulo" data-c="comoFunciona.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#funcionalidades"><svg class="dr-icone" aria-hidden="true"><use href="#dr-colmeia"></use></svg><span class="trilho__rotulo" data-c="funcionalidades.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#tecnologia"><svg class="dr-icone" aria-hidden="true"><use href="#dr-drone"></use></svg><span class="trilho__rotulo" data-c="tecnologia.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#para-quem"><svg class="dr-icone" aria-hidden="true"><use href="#dr-abelha"></use></svg><span class="trilho__rotulo" data-c="paraQuem.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#equipe"><svg class="dr-icone" aria-hidden="true"><use href="#dr-rainha"></use></svg><span class="trilho__rotulo" data-c="equipe.eyebrow"></span></a></li>
      <li><a class="trilho__item" href="#contato"><svg class="dr-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span class="trilho__rotulo" data-c="contato.eyebrow"></span></a></li>
    </ul>
    <a class="trilho__cta" data-c-href="cta.baixar.url">
      <svg class="dr-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="trilho__rotulo" data-c="cta.baixar.texto"></span>
    </a>
  </nav>

  <main>

    <!-- SEÇÃO: hero (amanhecer no apiário: céu, sol nascendo atrás dos morros) -->
    <section data-secao="hero" id="inicio" class="hero">
      <div class="ceu" aria-hidden="true">
        <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
          <path class="arco-sol" d="M60 540 Q 500 -60 940 540"/>
          <g class="sol-grupo">
            <circle class="halo-2" r="96"/>
            <circle class="halo" r="66"/>
            <circle class="sol" r="42"/>
          </g>
        </svg>
      </div>
      <div class="dr-container hero__conteudo">
        <img class="hero__marca" src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64">
        <div class="hora">
          <svg viewBox="0 0 44 24" aria-hidden="true" data-hora="0"></svg>
          <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
        </div>
        <h1 class="dr-display" data-c="hero.titulo"></h1>
        <p class="dr-body-lg" data-c="hero.subtitulo"></p>
        <div class="acoes">
          <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
          <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
          <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
        </div>
      </div>
      <svg class="horizonte" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">
        <path class="morro-1" d="M0 120 C 220 60, 420 70, 640 110 S 1100 150, 1440 70 V260 H0 Z"/>
        <path class="morro-2" d="M0 170 C 260 120, 520 140, 760 170 S 1200 190, 1440 140 V260 H0 Z"/>
        <path class="morro-3" d="M0 215 C 300 190, 640 200, 900 215 S 1300 230, 1440 205 V260 H0 Z"/>
        <g transform="translate(1040 168)">
          <rect class="caixa" x="0" y="8" width="34" height="26"/><rect class="tampa" x="-3" y="2" width="40" height="7"/>
          <rect class="caixa" x="52" y="12" width="30" height="22"/><rect class="tampa" x="49" y="6" width="36" height="7"/>
          <rect class="caixa" x="100" y="10" width="32" height="24"/><rect class="tampa" x="97" y="4" width="38" height="7"/>
        </g>
        <g>
          <path class="haste" d="M180 230 v-22 M210 232 v-28 M240 230 v-18 M1290 222 v-24 M1320 224 v-18"/>
          <circle class="flor" cx="180" cy="206" r="5"/><circle class="flor" cx="210" cy="202" r="6"/><circle class="flor" cx="240" cy="210" r="4"/>
          <circle class="flor" cx="1290" cy="196" r="5"/><circle class="flor" cx="1320" cy="204" r="4"/>
        </g>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '#';
      var SVGNS = 'http://www.w3.org/2000/svg';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }
      function el(nome, attrs, pai) {
        var e = document.createElementNS(SVGNS, nome);
        Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (pai) pai.appendChild(e);
        return e;
      }

      // Céu: tons da marca do amanhecer ao fim de tarde.
      var CEU = ['#FFFBE6', '#FDEFC2', '#FBE08C', '#F4ECD2']; // creme, véu de mel, mel claro, superfície
      var T0 = 0.03, T1 = 0.97; // o sol nasce um pouco acima do horizonte e se põe antes de sumir

      // Ponto na curva quadrática do arco do sol (mesmos números do path).
      function pontoArco(t) {
        var x0 = 60, y0 = 540, cx = 500, cy = ARCO_CY, x1 = 940, y1 = 540, u = 1 - t;
        return { x: u * u * x0 + 2 * u * t * cx + t * t * x1, y: u * u * y0 + 2 * u * t * cy + t * t * y1 };
      }
      var ARCO_CY = -60, ultimoT = 0;
      function porSol(t) {
        ultimoT = t;
        var p = pontoArco(T0 + (T1 - T0) * t);
        document.querySelector('.sol-grupo').setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
      }

      // Pequeno arco solar ao lado de cada eyebrow: a hora daquela seção.
      function desenharHoras() {
        var svgs = document.querySelectorAll('[data-hora]');
        var total = 7;
        svgs.forEach(function (s) {
          var t = Number(s.getAttribute('data-hora')) / total;
          el('path', { 'class': 'mini-arco', d: 'M2 22 Q 22 -10 42 22' }, s);
          el('line', { 'class': 'mini-chao', x1: 0, y1: 22, x2: 44, y2: 22 }, s);
          var u = 1 - t;
          var x = u * u * 2 + 2 * u * t * 22 + t * t * 42, y = u * u * 22 + 2 * u * t * -10 + t * t * 22;
          el('circle', { 'class': 'mini-sol', cx: x.toFixed(1), cy: y.toFixed(1), r: 4 }, s);
        });
      }

      // C5: sparklines determinísticas (atividade ao longo do dia).
      function desenharSparks() {
        document.querySelectorAll('[data-spark]').forEach(function (s, i) {
          var pts = [], semente = (i + 3) * 9301;
          for (var k = 0; k < 12; k++) {
            semente = (semente * 9301 + 49297) % 233280;
            var base = Math.sin((k / 11) * Math.PI) * 18;
            pts.push([k * (140 / 11), 34 - base - (semente / 233280) * 12]);
          }
          var d = pts.map(function (p, j) { return (j ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
          el('path', { 'class': 'area', d: d + ' L140 40 L0 40 Z' }, s);
          el('path', { 'class': 'linha', d: d }, s);
          var u = pts[pts.length - 1];
          el('circle', { cx: u[0].toFixed(1), cy: u[1].toFixed(1), r: 3.5 }, s);
        });
      }

      // N1: marca no trilho a seção visível (não é movimento).
      function marcarTrilho() {
        var links = Array.prototype.slice.call(document.querySelectorAll('.trilho__item'));
        if (!('IntersectionObserver' in window)) return;
        var io = new IntersectionObserver(function (entradas) {
          entradas.forEach(function (e) {
            if (!e.isIntersecting) return;
            links.forEach(function (a) {
              a.setAttribute('aria-current', a.getAttribute('href') === '#' + e.target.id ? 'true' : 'false');
            });
          });
        }, { rootMargin: '-45% 0px -50% 0px' });
        links.forEach(function (a) {
          var alvo = document.querySelector(a.getAttribute('href'));
          if (alvo) io.observe(alvo);
        });
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el2, i) {
            var item = itens[i] || {};
            var use = el2.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el2.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (e) {
          e.textContent = '© ' + new Date().getFullYear();
        });
        var cta = document.querySelector('.trilho__cta');
        var rot = cta.querySelector('.trilho__rotulo');
        cta.setAttribute('aria-label', rot.textContent);
        desenharHoras();
        desenharSparks();
        marcarTrilho();
        porSol(0); // estático: amanhecer
        // Em tela estreita o céu ancora à esquerda, para o sol nascente continuar à vista.
        var svgCeu = document.querySelector('.ceu svg');
        function ajustarCeu() {
          var estreito = window.innerWidth < 900;
          svgCeu.setAttribute('preserveAspectRatio', estreito ? 'xMinYMax slice' : 'xMidYMid slice');
          // No estreito o arco fica baixo, entre os morros e a fileira de botões.
          ARCO_CY = estreito ? 300 : -60;
          svgCeu.querySelector('.arco-sol').setAttribute('d', 'M60 540 Q 500 ' + ARCO_CY + ' 940 540');
          porSol(ultimoT);
        }
        ajustarCeu();
        window.addEventListener('resize', ajustarCeu);

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        var raiz = document.documentElement;
        var ceu = document.querySelector('.ceu');

        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // Amanhecer (termina em ~1,3s): o sol sobe de trás dos morros e o texto chega.
          var sol = { t: -0.06 };
          gsap.timeline({ defaults: { ease: 'power3.out' } })
            .from('.hero__conteudo > *', { y: 24, autoAlpha: 0, duration: 0.7, stagger: 0.08 })
            .from('.horizonte path', { yPercent: 30, duration: 1, stagger: 0.1 }, 0)
            .to(sol, { t: 0, duration: 1.1, onUpdate: function () { porSol(Math.max(sol.t, -0.06)); } }, 0.1)
            .from('.arco-sol', { strokeDashoffset: 400, duration: 1.2, ease: 'none' }, 0);

          gsap.utils.toArray('.tabela, .passos, .perfis, .pessoas, .consequencias').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, y: 16, duration: 0.6, ease: 'power2.out', stagger: 0.08,
              scrollTrigger: { trigger: lista, start: 'top 85%', once: true }
            });
          });
          gsap.utils.toArray('.spark .linha').forEach(function (p) {
            var len = p.getTotalLength();
            gsap.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, {
              strokeDashoffset: 0, duration: 1.2, ease: 'power1.inOut',
              scrollTrigger: { trigger: p.closest('li'), start: 'top 90%', once: true }
            });
          });
        });

        // Efeito principal: o sol percorre o arco e o céu muda com a rolagem da página inteira (>= 900px).
        mm.add('(prefers-reduced-motion: no-preference) and (min-width: 900px)', function () {
          raiz.classList.add('ceu-vivo');
          var cor = gsap.utils.interpolate(CEU);
          ScrollTrigger.create({
            start: 0, end: 'max', scrub: 0.4,
            onUpdate: function (self) {
              porSol(self.progress);
              ceu.style.background = cor(self.progress);
            }
          });
          return function () {
            raiz.classList.remove('ceu-vivo');
            ceu.style.background = '';
            porSol(0);
          };
        });

        document.fonts.ready.then(function () { ScrollTrigger.refresh(); });
      });
    })();
  </script>
