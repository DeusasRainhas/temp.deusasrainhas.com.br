<!doctype html>
<html lang="pt-BR" data-template="40">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 40 Índice</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       40 Índice · mínimo · N1 / C6 / R9
       O hero é o sumário da própria página: uma lista numerada das seções.
       Passar o cursor por um item traz uma prévia em imagem que segue o
       ponteiro; no toque, o primeiro toque mostra a prévia e o segundo navega.
       Regras que todo template segue:
       - nada de opacity < 1 fora do gsap.matchMedia (texto "apagado" usa cor);
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --trilho: 88px; --respiro: clamp(88px, 13vh, 144px); }
    @media (max-width: 767px) { :root { --trilho: 56px; --respiro: 72px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--petroleo); outline-offset: 2px;
    }
    body { padding-left: var(--trilho); }
    main > section { padding-block: var(--respiro); }
    .dr-container { max-width: 1160px; }

    /* ---------- N1: trilho lateral vertical com ícones do sprite ---------- */
    .trilho {
      position: fixed; inset: 0 auto 0 0; z-index: 50; width: var(--trilho);
      background: var(--creme); border-right: var(--bd);
      display: flex; flex-direction: column; align-items: center; padding-block: var(--sp-4);
    }
    .trilho .marca img { width: 64px; height: 64px; }
    .trilho .marca__coroa { display: none; }
    .trilho__lista { margin-top: var(--sp-6); display: grid; gap: var(--sp-2); }
    .trilho__lista a {
      position: relative; display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-md);
      color: var(--terra-clara); transition: color .2s ease, background-color .2s ease;
    }
    .trilho__lista a:hover { color: var(--terra-escura); background: var(--superficie); }
    .trilho__lista a.ativo { color: var(--petroleo); background: var(--petroleo-veu); }
    .trilho__lista a::before {
      content: ""; position: absolute; left: -20px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px;
      background: transparent; transition: background-color .2s ease;
    }
    .trilho__lista a.ativo::before { background: var(--mel); }
    .dica {
      display: none; position: absolute; left: calc(100% + 14px); top: 50%; translate: 0 -50%;
      white-space: nowrap; padding: 6px 12px; border-radius: var(--r-sm);
      background: var(--grafite); color: var(--creme);
      font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    }
    @media (hover: hover) and (pointer: fine) {
      .trilho__lista a:hover .dica, .trilho__lista a:focus-visible .dica { display: block; }
    }
    @media (max-width: 767px) {
      .trilho .marca__abelha { display: none; }
      .trilho .marca__coroa { display: block; width: 34px; height: auto; margin: 10px 0; }
      .trilho__lista { margin-top: var(--sp-4); gap: var(--sp-1); }
      .trilho__lista a { width: 40px; height: 40px; }
      .trilho__lista a::before { left: -8px; }
      .trilho__lista .dr-icone { width: 20px; height: 20px; }
    }

    /* ---------- Hero: o índice da página ---------- */
    [data-secao="hero"] { padding-block: clamp(40px, 7vh, 72px) var(--respiro) !important; min-height: 100svh; }
    .topo { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-7); align-items: end; }
    .topo .dr-eyebrow { margin-bottom: var(--sp-4); }
    .topo h1 {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(34px, 3.8vw, 52px); line-height: 1.06; letter-spacing: -.018em; color: var(--terra-escura);
      max-width: 15ch; text-wrap: balance;
    }
    .topo p:not(.dr-eyebrow) { font-size: var(--fs-body); line-height: 1.6; color: var(--corpo); max-width: 40ch; }
    .topo__acoes { margin-top: var(--sp-4); display: flex; flex-wrap: wrap; gap: var(--sp-3); }
    .topo__acoes .dr-btn { padding: 10px 18px; font-size: var(--fs-small); }
    @media (max-width: 899px) { .topo { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); } }

    .sumario { margin-top: clamp(40px, 7vh, 72px); border-top: 1px solid var(--terra-escura); counter-reset: item; }
    .sumario li { counter-increment: item; border-bottom: var(--bd); }
    .sumario a {
      display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, auto); gap: var(--sp-5);
      align-items: baseline; padding-block: clamp(12px, 1.9vh, 18px);
      text-decoration: none; color: var(--terra-escura);
      transition: color .25s ease, padding-left .35s cubic-bezier(.2,.7,.2,1);
    }
    .sumario a::before {
      content: counter(item, decimal-leading-zero);
      font-family: var(--mono); font-size: var(--fs-small); color: var(--petroleo); letter-spacing: .06em;
    }
    .sumario__nome { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3.1vw, 44px); line-height: 1.05; letter-spacing: -.015em; }
    .sumario__titulo { font-size: var(--fs-small); color: var(--suave); text-align: right; transition: color .25s ease; }
    .sumario a:hover, .sumario a.tocado { color: var(--petroleo); padding-left: var(--sp-3); }
    .sumario a:hover .sumario__titulo, .sumario a.tocado .sumario__titulo { color: var(--corpo); }
    @media (max-width: 767px) {
      .sumario a { grid-template-columns: 36px minmax(0, 1fr); gap: var(--sp-3); }
      .sumario__titulo { display: none; }
    }

    /* Prévia que segue o cursor (só imagem; texto nenhum). */
    .previa {
      position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none;
      width: 240px; height: 300px; border-radius: var(--r-lg); overflow: hidden;
      background: var(--creme-papel); box-shadow: var(--sh-lg);
      visibility: hidden;
    }
    .previa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: none; }
    .previa img.ativa { display: block; }
    @media (max-width: 767px) { .previa { width: 168px; height: 210px; } }

    .vitrine { margin-top: var(--respiro); display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-6); align-items: end; }
    .vitrine img { width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--r-lg); box-shadow: var(--sh-md); }
    @media (max-width: 767px) { .vitrine { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- R9: o fundo muda por seção ---------- */
    .f-creme { background: var(--creme); }
    .f-papel { background: var(--creme-papel); }
    .f-superficie { background: var(--superficie); }
    .f-veu { background: var(--mel-veu); }
    main > section { scroll-margin-top: 0; }

    .cabeca { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-5); align-items: baseline; max-width: 820px; }
    .cabeca::before {
      content: attr(data-n); font-family: var(--mono); font-size: var(--fs-small); color: var(--petroleo); letter-spacing: .06em;
    }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-3); color: var(--terra); }
    .cabeca h2 {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; letter-spacing: -.015em; color: var(--terra-escura); text-wrap: balance;
    }
    .cabeca .intro { margin-top: var(--sp-4); max-width: 52ch; }
    .cabeca + * { margin-top: var(--sp-8); }
    @media (max-width: 767px) {
      .cabeca { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
      .cabeca + * { margin-top: var(--sp-7); }
    }

    /* ---------- C6: cards com sombra média e tilt 3D sutil no hover ---------- */
    .cards { display: grid; gap: var(--sp-5); perspective: 900px; }
    .card {
      background: var(--branco); border-radius: var(--r-lg); box-shadow: var(--sh-md);
      padding: var(--sp-6) var(--sp-5); transform-style: preserve-3d;
    }
    .card .dr-icone { color: var(--petroleo); display: block; margin-bottom: var(--sp-5); }
    .card .dr-h4 { margin-bottom: var(--sp-2); font-size: 19px; }
    .cards--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cards--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1023px) { .cards--4, .cards--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 599px) { .cards--3, .cards--2 { grid-template-columns: minmax(0, 1fr); } .cards--4 { gap: var(--sp-3); } }
    .stat__valor { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(36px, 3.6vw, 52px); line-height: 1; color: var(--terra-escura); }
    .stat .dr-small { margin-top: var(--sp-3); color: var(--corpo); }
    @media (max-width: 599px) { .stat { padding: var(--sp-5) var(--sp-4); } }

    /* Problema */
    .problema { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); padding-left: 84px; }
    .problema__valor { display: block; font-family: var(--serif); font-size: clamp(80px, 9vw, 128px); line-height: .9; color: var(--terra-escura); letter-spacing: -.03em; }
    .problema__texto { margin-top: var(--sp-4); max-width: 30ch; }
    .consequencias { border-top: 1px solid var(--linha-forte); }
    .consequencias li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); padding-block: var(--sp-5); border-bottom: 1px solid var(--linha-forte); }
    .consequencias .dr-icone { color: var(--terra); margin-top: 3px; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); padding-left: 0; } }

    /* Como funciona */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); padding-left: 84px; }
    .passo__numero { font-family: var(--mono); font-size: var(--fs-small); color: var(--petroleo); }
    .passo .dr-h4 { margin-block: var(--sp-3) var(--sp-2); }
    .passo figure { margin-top: var(--sp-5); }
    .passo img { width: 100%; max-width: 240px; height: auto; max-height: 380px; object-fit: cover; object-position: top; border-radius: var(--r-lg); box-shadow: var(--sh-md); background: var(--branco); }
    .passo figcaption { margin-top: var(--sp-3); max-width: 240px; }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); padding-left: 0; } }

    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); margin-bottom: var(--sp-3); }
    .recuo { padding-left: 84px; }
    @media (max-width: 767px) { .recuo { padding-left: 0; } }

    /* Equipe */
    .equipe { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); padding-left: 84px; }
    .origem { font-family: var(--serif); font-size: clamp(20px, 1.8vw, 24px); line-height: 1.5; color: var(--terra-escura); }
    .pessoas { display: grid; gap: var(--sp-4); }
    .pessoa { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-4); align-items: center; padding-bottom: var(--sp-4); border-bottom: 1px solid var(--linha-forte); }
    .pessoa img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
    .pessoa .dr-h4 { font-size: 18px; }
    .apoios { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-6); }
    .apoio { display: grid; justify-items: start; gap: var(--sp-2); }
    .apoio__logo { display: grid; place-items: center; height: 68px; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--branco); }
    .apoio[data-fundo="escuro"] .apoio__logo { background: var(--grafite); }
    .apoio__logo img { max-height: 44px; width: auto; max-width: 132px; }
    .apoio__nome { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 899px) { .equipe { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); padding-left: 0; } }

    /* Depoimento */
    .fala { padding-left: 84px; max-width: 980px; }
    .fala blockquote { margin: 0; }
    .fala .dr-quote { font-size: clamp(26px, 3.2vw, 42px); line-height: 1.28; color: var(--terra-escura); text-wrap: balance; }
    .fala figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .fala figcaption img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .fala__nome { display: block; font-weight: 700; color: var(--ink); }
    @media (max-width: 767px) { .fala { padding-left: 0; } }

    /* Contato */
    .contato { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-6); padding-left: 84px; align-items: start; }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink);
      background: var(--creme); border: var(--bd-forte); border-radius: var(--r-md);
      padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo textarea { min-height: 132px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-4); }
    .canais li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-3); align-items: center; }
    .canais .dr-icone { color: var(--petroleo); }
    .canais a { font-weight: 600; overflow-wrap: anywhere; text-underline-offset: 4px; }
    .contato-acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); padding-left: 0; } }

    /* Rodapé */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 104px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1160px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N1 · trilho lateral vertical com ícones do sprite) -->
  <nav data-secao="nav" class="trilho">
    <a class="marca" href="#inicio">
      <img class="marca__abelha" src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64">
      <img class="marca__coroa" src="../img/logos/coroa-cor.png" alt="" data-c-alt="marca.alt" width="129" height="93">
    </a>
    <ul class="trilho__lista">
      <li><a href="#problema" data-alvo="problema"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-alerta"></use></svg><span class="dr-sr-only" data-c="problema.eyebrow"></span><span class="dica" aria-hidden="true" data-c="problema.eyebrow"></span></a></li>
      <li><a href="#funcionalidades" data-alvo="funcionalidades"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-colmeia"></use></svg><span class="dr-sr-only" data-c="funcionalidades.eyebrow"></span><span class="dica" aria-hidden="true" data-c="funcionalidades.eyebrow"></span></a></li>
      <li><a href="#como-funciona" data-alvo="como-funciona"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-revisao"></use></svg><span class="dr-sr-only" data-c="comoFunciona.eyebrow"></span><span class="dica" aria-hidden="true" data-c="comoFunciona.eyebrow"></span></a></li>
      <li><a href="#para-quem" data-alvo="para-quem"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-abelha"></use></svg><span class="dr-sr-only" data-c="paraQuem.eyebrow"></span><span class="dica" aria-hidden="true" data-c="paraQuem.eyebrow"></span></a></li>
      <li><a href="#tecnologia" data-alvo="tecnologia"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-drone"></use></svg><span class="dr-sr-only" data-c="tecnologia.eyebrow"></span><span class="dica" aria-hidden="true" data-c="tecnologia.eyebrow"></span></a></li>
      <li><a href="#equipe" data-alvo="equipe"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-rainha"></use></svg><span class="dr-sr-only" data-c="equipe.eyebrow"></span><span class="dica" aria-hidden="true" data-c="equipe.eyebrow"></span></a></li>
      <li><a href="#contato" data-alvo="contato"><svg class="dr-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span class="dr-sr-only" data-c="contato.eyebrow"></span><span class="dica" aria-hidden="true" data-c="contato.eyebrow"></span></a></li>
    </ul>
  </nav>

  <main>

    <!-- SEÇÃO: hero (lista numerada das seções como hero) -->
    <section data-secao="hero" id="inicio" class="f-creme">
      <div class="dr-container">
        <div class="topo">
          <div>
            <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
            <h1 data-c="hero.titulo"></h1>
          </div>
          <div>
            <p data-c="hero.subtitulo"></p>
            <div class="topo__acoes">
              <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
              <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
              <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
            </div>
          </div>
        </div>
        <ol class="sumario">
          <li><a href="#problema" data-previa="0"><span class="sumario__nome" data-c="problema.eyebrow"></span><span class="sumario__titulo" data-c="problema.titulo"></span></a></li>
          <li><a href="#funcionalidades" data-previa="1"><span class="sumario__nome" data-c="funcionalidades.eyebrow"></span><span class="sumario__titulo" data-c="funcionalidades.titulo"></span></a></li>
          <li><a href="#como-funciona" data-previa="2"><span class="sumario__nome" data-c="comoFunciona.eyebrow"></span><span class="sumario__titulo" data-c="comoFunciona.titulo"></span></a></li>
          <li><a href="#para-quem" data-previa="3"><span class="sumario__nome" data-c="paraQuem.eyebrow"></span><span class="sumario__titulo" data-c="paraQuem.titulo"></span></a></li>
          <li><a href="#tecnologia" data-previa="4"><span class="sumario__nome" data-c="tecnologia.eyebrow"></span><span class="sumario__titulo" data-c="tecnologia.titulo"></span></a></li>
          <li><a href="#equipe" data-previa="5"><span class="sumario__nome" data-c="equipe.eyebrow"></span><span class="sumario__titulo" data-c="equipe.titulo"></span></a></li>
          <li><a href="#contato" data-previa="6"><span class="sumario__nome" data-c="contato.eyebrow"></span><span class="sumario__titulo" data-c="contato.titulo"></span></a></li>
        </ol>
        <figure class="vitrine">
          <img data-c-src="hero.imagem" data-c-alt="hero.imagemAlt" alt="" width="1600" height="1000" loading="lazy">
          <figcaption class="dr-caption" data-c="hero.imagemAlt"></figcaption>
        </figure>
      </div>
      <!-- Prévias do sumário, na mesma ordem dos itens; só imagem, decorativas. -->
      <div class="previa" aria-hidden="true">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }
      var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)');
      var toque = window.matchMedia('(pointer: coarse)');

      /* N1: o ícone da seção visível fica aceso no trilho. */
      function ligarTrilho() {
        var links = Array.prototype.slice.call(document.querySelectorAll('.trilho__lista a'));
        var alvos = links.map(function (a) { return document.getElementById(a.getAttribute('data-alvo')); });
        function atualizar() {
          var meio = window.innerHeight * 0.4;
          var atual = -1;
          alvos.forEach(function (s, i) { if (s.getBoundingClientRect().top <= meio) atual = i; });
          links.forEach(function (a, i) {
            a.classList.toggle('ativo', i === atual);
            if (i === atual) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
          });
        }
        window.addEventListener('scroll', atualizar, { passive: true });
        atualizar();
      }

      /* Prévia do sumário. Cursor: segue o ponteiro (com atraso suave se houver movimento).
         Toque: o primeiro toque num item mostra a prévia ao lado dele; o segundo navega. */
      function ligarPrevia() {
        var previa = document.querySelector('.previa');
        var imgs = previa.querySelectorAll('img');
        var itens = document.querySelectorAll('.sumario a');
        var tocado = null;
        var segueX, segueY;
        function moverPara(x, y) {
          if (segueX) { segueX(x); segueY(y); } else { previa.style.left = x + 'px'; previa.style.top = y + 'px'; }
        }
        function escolher(i) {
          imgs.forEach(function (img, k) { img.classList.toggle('ativa', k === i); });
        }
        function mostrar() {
          if (window.gsap && !reduzido.matches) {
            gsap.to(previa, { autoAlpha: 1, scale: 1, rotation: -2, duration: 0.35, ease: 'power3.out', overwrite: 'auto' });
          } else if (window.gsap) {
            gsap.set(previa, { autoAlpha: 1, scale: 1 });
          } else {
            previa.style.visibility = 'visible';
          }
        }
        function esconder() {
          if (window.gsap && !reduzido.matches) {
            gsap.to(previa, { autoAlpha: 0, scale: 0.85, rotation: 0, duration: 0.25, ease: 'power2.in', overwrite: 'auto' });
          } else if (window.gsap) {
            gsap.set(previa, { autoAlpha: 0 });
          } else {
            previa.style.visibility = 'hidden';
          }
          if (tocado) { tocado.classList.remove('tocado'); tocado = null; }
        }
        if (window.gsap) {
          gsap.set(previa, { xPercent: -50, yPercent: -50, left: 0, top: 0, autoAlpha: 0, scale: 0.85 });
          if (!reduzido.matches) {
            segueX = gsap.quickTo(previa, 'x', { duration: 0.55, ease: 'power3.out' });
            segueY = gsap.quickTo(previa, 'y', { duration: 0.55, ease: 'power3.out' });
          } else {
            segueX = function (x) { gsap.set(previa, { x: x }); };
            segueY = function (y) { gsap.set(previa, { y: y }); };
          }
        }
        itens.forEach(function (a) {
          var i = Number(a.getAttribute('data-previa'));
          a.addEventListener('pointerenter', function (e) {
            if (e.pointerType !== 'mouse') return;
            escolher(i);
            moverPara(e.clientX + 150, e.clientY);
            mostrar();
          });
          a.addEventListener('pointermove', function (e) {
            if (e.pointerType !== 'mouse') return;
            // A prévia fica à direita do cursor, para não cobrir o nome do item.
            moverPara(e.clientX + 150, e.clientY);
          });
          a.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') esconder(); });
          a.addEventListener('focus', function () {
            if (toque.matches) return;
            var r = a.getBoundingClientRect();
            escolher(i);
            moverPara(Math.min(window.innerWidth - 140, r.left + r.width * 0.62), r.top + r.height / 2);
            mostrar();
          });
          a.addEventListener('blur', function () { if (!toque.matches) esconder(); });
          a.addEventListener('click', function (e) {
            if (!toque.matches) return;
            if (tocado !== a) {
              e.preventDefault();
              if (tocado) tocado.classList.remove('tocado');
              tocado = a;
              a.classList.add('tocado');
              var r = a.getBoundingClientRect();
              escolher(i);
              var w = previa.offsetWidth;
              // Abaixo do item tocado (ou acima, se não couber), para não cobrir o nome.
              var h = previa.offsetHeight;
              var y = r.bottom + 8 + h / 2;
              if (y + h / 2 > window.innerHeight - 72) y = r.top - 8 - h / 2;
              moverPara(window.innerWidth - w / 2 - 16, y);
              mostrar();
            } else {
              esconder();
            }
          });
        });
        document.addEventListener('click', function (e) {
          if (tocado && !e.target.closest('.sumario')) esconder();
        });
        window.addEventListener('scroll', function () { if (tocado) esconder(); }, { passive: true });
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });
        ligarTrilho();
        ligarPrevia();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // O sumário se monta item a item, rápido (termina antes de 1s).
          gsap.from('.topo > *', { autoAlpha: 0, y: 14, duration: 0.6, ease: 'power2.out', stagger: 0.08 });
          gsap.from('.sumario li', { autoAlpha: 0, y: 18, duration: 0.5, ease: 'power2.out', stagger: 0.05, delay: 0.15 });

          gsap.utils.toArray('[data-sobe-filhos]').forEach(function (lista) {
            gsap.from(lista.querySelectorAll(':scope > li'), {
              autoAlpha: 0, y: 18, duration: 0.6, ease: 'power2.out', stagger: 0.07,
              scrollTrigger: { trigger: lista, start: 'top 86%', once: true }
            });
          });
        });
        // C6: tilt 3D sutil, só com cursor fino e movimento liberado.
        mm.add('(prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine)', function () {
          var limpar = [];
          document.querySelectorAll('[data-tilt]').forEach(function (card) {
            function mover(e) {
              var r = card.getBoundingClientRect();
              var px = (e.clientX - r.left) / r.width - 0.5;
              var py = (e.clientY - r.top) / r.height - 0.5;
              gsap.to(card, { rotationY: px * 7, rotationX: -py * 7, duration: 0.4, ease: 'power2.out', overwrite: 'auto' });
            }
            function sair() { gsap.to(card, { rotationY: 0, rotationX: 0, duration: 0.6, ease: 'power3.out', overwrite: 'auto' }); }
            card.addEventListener('pointermove', mover);
            card.addEventListener('pointerleave', sair);
            limpar.push(function () { card.removeEventListener('pointermove', mover); card.removeEventListener('pointerleave', sair); gsap.set(card, { clearProps: 'transform' }); });
          });
          return function () { limpar.forEach(function (f) { f(); }); };
        });
      });
    })();
  </script>
