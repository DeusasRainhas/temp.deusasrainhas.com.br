<!doctype html>
<html lang="pt-BR" data-template="31">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 31 Noite</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       31 Noite · cinema · N6 / C7 / R6
       Cada seção é uma tela grafite de canto --r-xl sobre o creme. Uma só
       poça de luz mel atravessa todas as telas: o gradiente é fixo na
       janela (background-attachment: fixed) e a posição dele acompanha o
       progresso do scroll, descendo e trocando de lado a cada capítulo.
       Regras herdadas do 01:
       - nada de opacity < 1 fora do gsap.matchMedia (texto "apagado" usa cor);
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root {
      --nav-h: 0px;
      --gutter: 12px;
      --respiro: var(--sp-9);
      /* posição da poça de luz (em % da janela); o JS atualiza */
      --fx: 70%; --fy: 34%;
      /* paleta noturna: contraste AA ou melhor sobre --grafite */
      --t1: var(--creme);
      --t2: #D8CFBB;
      --t3: var(--tenue);
      --fio: rgba(255, 251, 230, .14);
      --borda-c7: 2px solid var(--terra);
    }
    @media (max-width: 767px) { :root { --gutter: 8px; --respiro: 56px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    body { background: var(--creme); }
    a { color: var(--mel-claro); }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--mel); outline-offset: 3px;
    }
    .dr-btn:focus-visible { outline-color: var(--mel); }

    /* ---------- R6: cada seção é uma tela de canto --r-xl sobre o creme ---------- */
    main { display: grid; gap: var(--gutter); padding: var(--gutter); }
    .tela {
      position: relative; overflow: hidden;
      border-radius: var(--r-xl);
      color: var(--t2);
      /* a luz: um único gradiente fixo na janela, visto através de todas as telas */
      background:
        radial-gradient(circle at var(--fx) var(--fy),
          rgba(245, 192, 44, .34) 0,
          rgba(245, 192, 44, .15) 13vmax,
          rgba(217, 165, 33, .05) 28vmax,
          rgba(32, 32, 32, 0) 44vmax) fixed,
        var(--grafite);
      padding-block: var(--respiro);
    }
    .tela .dr-h2, .tela .dr-h3, .tela .dr-h4, .tela .dr-display { color: var(--t1); }
    .tela .dr-body, .tela .dr-body-lg { color: var(--t2); }
    .tela .dr-eyebrow { color: var(--mel); }
    .tela .dr-caption { color: var(--t3); }

    /* ---------- N6: pontos laterais, um por capítulo ---------- */
    .pontos {
      position: fixed; z-index: 60; right: 22px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 14px;
      padding: 14px 8px; border-radius: var(--r-pill);
      background: rgba(32, 32, 32, .72);
    }
    .ponto { position: relative; display: block; width: 14px; height: 14px; }
    .ponto::before {
      content: ""; position: absolute; inset: 3px; border-radius: 50%;
      border: 1.5px solid var(--t3); transition: transform .3s ease, background-color .3s ease, border-color .3s ease;
    }
    .ponto[aria-current="true"]::before {
      background: var(--mel); border-color: var(--mel); transform: scale(1.5);
      box-shadow: 0 0 12px rgba(245, 192, 44, .7);
    }
    .ponto:hover::before { border-color: var(--mel); }
    .ponto__rotulo {
      position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
      white-space: nowrap; padding: 6px 12px; border-radius: var(--r-pill);
      background: var(--grafite); border: 1px solid var(--fio);
      font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .16em;
      text-transform: uppercase; color: var(--creme);
      clip-path: inset(50%); pointer-events: none;
    }
    .ponto:hover .ponto__rotulo, .ponto:focus-visible .ponto__rotulo { clip-path: none; }
    @media (max-width: 767px) {
      .pontos { right: 10px; gap: 10px; padding: 10px 5px; }
      .ponto { width: 10px; height: 10px; }
      .ponto::before { inset: 2px; }
    }

    /* ---------- Hero: grafite total, um foco de luz mel ---------- */
    .tela--hero {
      min-height: calc(100svh - 2 * var(--gutter));
      display: flex; flex-direction: column; padding-block: var(--sp-5) var(--sp-6);
    }
    .tela--hero > .dr-container { width: 100%; }
    .hero__topo { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
    /* PNG quadrada com respiro transparente: 64px ≈ 42px de abelha visível; o respiro cobre a coroa */
    .marca img { width: 64px; height: 64px; }
    .hero__topo .dr-btn { padding: 10px 18px; font-size: var(--fs-small); }
    .hero__corpo {
      flex: 1; display: grid; align-content: center; gap: var(--sp-5);
      padding-block: var(--sp-8) var(--sp-7); max-width: 980px;
    }
    .hero__corpo .dr-eyebrow { display: flex; align-items: center; gap: var(--sp-3); }
    .hero__corpo .dr-eyebrow::before { content: ""; width: 40px; height: 1.5px; background: var(--mel); }
    .titulo-noite {
      font-family: var(--serif); font-weight: 500; color: var(--t1);
      font-size: clamp(46px, 8.4vw, 128px); line-height: .96; letter-spacing: -.03em;
      text-wrap: balance;
      text-shadow: 0 0 60px rgba(245, 192, 44, .18);
    }
    .hero__sub { max-width: 40ch; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.6; color: var(--t2); }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
    .dr-btn--noite { background: transparent; color: var(--creme); border: 1.5px solid rgba(255, 251, 230, .4); }
    .dr-btn--noite:hover { background: rgba(255, 251, 230, .08); border-color: var(--creme); }
    .hero__base {
      display: flex; align-items: center; gap: var(--sp-3);
      padding-top: var(--sp-4); border-top: 1px solid var(--fio);
      font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .18em; text-transform: uppercase; color: var(--t3);
    }
    .hero__seta { width: 20px; height: 20px; color: var(--mel); }

    /* ---------- Cabeça de seção ---------- */
    .cabeca { max-width: 720px; }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-4); }
    .cabeca .dr-h2 { font-size: clamp(32px, 4vw, 52px); line-height: 1.06; text-wrap: balance; }
    .cabeca .dr-body-lg { margin-top: var(--sp-5); max-width: 52ch; }
    .cabeca + * { margin-top: var(--sp-7); }
    .dupla { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
    .dupla > .cabeca + * { margin-top: 0; }
    @media (max-width: 899px) { .dupla { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- C7: blocos de borda grossa 2px terra, sem raio ---------- */
    .bloco { border: var(--borda-c7); border-radius: 0; padding: var(--sp-5); background: rgba(32, 32, 32, .3); }
    .bloco .dr-icone { color: var(--mel); }
    .bloco .dr-h4 { margin-block: var(--sp-4) var(--sp-2); }
    .grade { display: grid; gap: var(--sp-4); }
    .grade--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grade--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grade--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 1023px) { .grade--3, .grade--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 599px) { .grade--3, .grade--2 { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Prova ---------- */
    .tela--prova { padding-block: var(--sp-7); }
    .stat { display: flex; flex-direction: column; gap: var(--sp-3); }
    .stat__valor { font-size: clamp(40px, 4.4vw, 64px); line-height: 1; color: var(--mel); }
    .stat__rotulo { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .14em; text-transform: uppercase; color: var(--t2); line-height: 1.6; }
    @media (max-width: 599px) { .grade--4 { gap: var(--sp-3); } .tela--prova .bloco { padding: var(--sp-4); } }

    /* ---------- Problema ---------- */
    .grande { display: block; margin-top: var(--sp-6); font-size: clamp(88px, 12vw, 168px); line-height: .85; color: var(--mel); letter-spacing: -.04em; }
    .grande + p { margin-top: var(--sp-4); max-width: 34ch; }
    .consequencias { display: grid; gap: var(--sp-4); }
    .consequencias .bloco { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
    .consequencias .dr-icone { margin-top: 4px; }

    /* ---------- Como funciona ---------- */
    .passo { display: flex; flex-direction: column; }
    .passo__num { font-size: var(--fs-h3); color: var(--mel); }
    .passo figure { margin-top: auto; padding-top: var(--sp-5); }
    .passo img {
      width: 100%; max-width: 220px; aspect-ratio: 393 / 560; object-fit: cover; object-position: top;
      border-radius: var(--r-md); border: 1px solid var(--fio); background: var(--creme-papel);
    }
    .passo figcaption { margin-top: var(--sp-3); max-width: 240px; }

    /* ---------- Para quem ---------- */
    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 2.6vw, 34px); color: var(--t1); margin-bottom: var(--sp-4); }
    .perfil { padding: var(--sp-6) var(--sp-5); }
    .perfil::before { content: ""; display: block; width: 32px; height: 3px; background: var(--mel); margin-bottom: var(--sp-5); }

    /* ---------- Equipe ---------- */
    .pessoa { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--sp-4); align-items: center; }
    .pessoa img { width: 72px; height: 72px; object-fit: cover; border: 2px solid var(--terra); }
    .pessoa .dr-h4 { margin: 0; font-size: 19px; }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--t3); line-height: 1.5; }
    .apoios { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-5) var(--sp-7); margin-top: var(--sp-7); padding-top: var(--sp-6); border-top: 1px solid var(--fio); }
    .apoio { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 80px; padding: var(--sp-3) var(--sp-4); }
    .apoio__logo img { max-height: 56px; width: auto; max-width: 170px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }

    /* ---------- Depoimento ---------- */
    .tela--depoimento { padding-block: calc(var(--respiro) * 1.2); }
    .citacao { max-width: 900px; margin-inline: auto; text-align: center; }
    .citacao .dr-quote { font-size: clamp(26px, 3.4vw, 44px); line-height: 1.28; color: var(--t1); text-wrap: balance; }
    .citacao__aspas { display: block; font-family: var(--serif); font-size: 120px; line-height: .5; height: 48px; color: var(--mel); }
    .citacao figcaption { display: inline-flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); text-align: left; }
    .citacao figcaption img { width: 56px; height: 56px; object-fit: cover; border: 2px solid var(--terra); }
    .citacao__nome { font-weight: 700; color: var(--t1); }
    .citacao__local { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--t3); }

    /* ---------- Contato ---------- */
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--t1); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--creme);
      background: #2A2A2A; border: 2px solid var(--terra); border-radius: 0;
      padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo input:focus, .campo textarea:focus { border-color: var(--mel); }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-4); }
    .canal { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); align-items: center; }
    .canal a { font-weight: 600; font-size: var(--fs-body-lg); color: var(--creme); text-underline-offset: 4px; text-decoration-color: var(--mel); overflow-wrap: anywhere; }
    .canais + .acoes { margin-top: var(--sp-6); }

    /* ---------- Rodapé: a última tela ---------- */
    .rodape-tela { margin: 0 var(--gutter) var(--gutter); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; color: var(--t3); }
    .rodape__razao { color: var(--creme) !important; font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--t3); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N6 · pontos laterais, um por capítulo; o rótulo aparece no hover/foco) -->
  <nav data-secao="nav" class="pontos" aria-label="Capítulos">
    <a class="ponto" href="#inicio"><span class="ponto__rotulo" data-c="marca.nome"></span></a>
    <a class="ponto" href="#problema"><span class="ponto__rotulo" data-c="problema.eyebrow"></span></a>
    <a class="ponto" href="#funcionalidades"><span class="ponto__rotulo" data-c="funcionalidades.eyebrow"></span></a>
    <a class="ponto" href="#como-funciona"><span class="ponto__rotulo" data-c="comoFunciona.eyebrow"></span></a>
    <a class="ponto" href="#para-quem"><span class="ponto__rotulo" data-c="paraQuem.eyebrow"></span></a>
    <a class="ponto" href="#tecnologia"><span class="ponto__rotulo" data-c="tecnologia.eyebrow"></span></a>
    <a class="ponto" href="#equipe"><span class="ponto__rotulo" data-c="equipe.eyebrow"></span></a>
    <a class="ponto" href="#contato"><span class="ponto__rotulo" data-c="contato.eyebrow"></span></a>
  </nav>

  <main>

    <!-- SEÇÃO: hero (grafite total; a poça de luz mel começa atrás do título) -->
    <section data-secao="hero" id="inicio" class="tela tela--hero">
      <div class="dr-container hero__topo">
        <a class="marca" href="#inicio"><img src="../img/logos/logo-negativa.png" alt="" data-c-alt="marca.alt" width="64" height="64"></a>
        <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
      </div>
      <div class="dr-container hero__corpo">
        <p class="dr-eyebrow" data-surge data-c="hero.eyebrow"></p>
        <h1 class="titulo-noite" data-surge data-c="hero.titulo"></h1>
        <p class="hero__sub" data-surge data-c="hero.subtitulo"></p>
        <div class="acoes" data-surge>
          <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
          <a class="dr-btn dr-btn--noite" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
          <a class="dr-btn dr-btn--noite" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
        </div>
      </div>
      <div class="dr-container">
        <div class="hero__base">
          <svg class="hero__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
          <span data-c="rodape.endereco"></span>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: prova (quatro blocos C7) -->
    <section data-secao="prova" class="tela tela--prova">
      <div class="dr-container">
        <ul class="grade grade--4" data-c-lista="prova.stats">
          <template>
            <li class="bloco stat">
              <span class="dr-data stat__valor" data-c="valor"></span>
              <span class="stat__rotulo" data-c="rotulo"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: problema -->
    <section data-secao="problema" id="problema" class="tela">
      <div class="dr-container dupla">
        <div>
          <header class="cabeca">
            <p class="dr-eyebrow" data-c="problema.eyebrow"></p>
            <h2 class="dr-h2" data-c="problema.titulo"></h2>
          </header>
          <span class="dr-data grande" data-c="problema.estatistica.valor"></span>
          <p class="dr-body-lg" data-c="problema.estatistica.texto"></p>
        </div>
        <ul class="consequencias" data-c-lista="problema.consequencias">
          <template>
            <li class="bloco">
              <svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-alerta"></use></svg>
              <p class="dr-body-lg" data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: funcionalidades (grade 3 × 2 de blocos C7) -->
    <section data-secao="funcionalidades" id="funcionalidades" class="tela">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="funcionalidades.eyebrow"></p>
          <h2 class="dr-h2" data-c="funcionalidades.titulo"></h2>
        </header>
        <ul class="grade grade--3" data-c-lista="funcionalidades.itens">
          <template>
            <li class="bloco">
              <svg class="dr-icone dr-icone--lg" aria-hidden="true"><use data-icone></use></svg>
              <h3 class="dr-h4" data-c="titulo"></h3>
              <p class="dr-body" data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: como-funciona (três blocos com a tela do app) -->
    <section data-secao="como-funciona" id="como-funciona" class="tela">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="comoFunciona.eyebrow"></p>
          <h2 class="dr-h2" data-c="comoFunciona.titulo"></h2>
        </header>
        <ol class="grade grade--3" data-c-lista="comoFunciona.passos">
          <template>
            <li class="bloco passo">
              <span class="dr-data passo__num" data-c="numero"></span>
              <h3 class="dr-h4" data-c="titulo"></h3>
              <p class="dr-body" data-c="texto"></p>
              <figure>
                <img data-c-src="imagem" data-c-alt="alt" alt="" loading="lazy">
                <figcaption class="dr-caption" data-c="alt"></figcaption>
              </figure>
            </li>
          </template>
        </ol>
      </div>
    </section>

    <!-- SEÇÃO: para-quem -->
    <section data-secao="para-quem" id="para-quem" class="tela">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="paraQuem.eyebrow"></p>
          <h2 class="dr-h2" data-c="paraQuem.titulo"></h2>
        </header>
        <ul class="grade grade--3" data-c-lista="paraQuem.perfis">
          <template>
            <li class="bloco perfil">
              <h3 class="dr-h3" data-c="titulo"></h3>
              <p class="dr-body" data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: tecnologia -->
    <section data-secao="tecnologia" id="tecnologia" class="tela">
      <div class="dr-container dupla">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="tecnologia.eyebrow"></p>
          <h2 class="dr-h2" data-c="tecnologia.titulo"></h2>
          <p class="dr-body-lg" data-c="tecnologia.texto"></p>
        </header>
        <ul class="grade grade--2" data-c-lista="tecnologia.pilares">
          <template>
            <li class="bloco">
              <svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg>
              <h3 class="dr-h4" data-c="titulo"></h3>
              <p class="dr-body" data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: equipe (origem, pessoas e apoios; Centelha só no escuro, as outras ganham placa creme) -->

            <li class="bloco pessoa">

              <div>
                <h3 class="dr-h4" data-c="nome"></h3>
                <p class="pessoa__cargo" data-c="cargo"></p>
              </div>
            </li>
          </template>
        </ul>
        <ul class="apoios" data-c-lista="equipe.apoios">
          <template>
            <li class="apoio">
              <span class="apoio__logo"><img data-c-src="logo" data-c-alt="alt" alt=""></span>

          </template>

    <!-- SEÇÃO: depoimento -->
    <section data-secao="depoimento" class="tela tela--depoimento">

    <section data-secao="contato" id="contato" class="tela">

            <h2 class="dr-h2" data-c="contato.titulo"></h2>
            <p class="dr-body-lg" data-c="contato.texto"></p>
          </header>
          <ul class="canais" style="margin-top: var(--sp-6)">
            <li class="canal">
              <svg class="dr-icone" style="color: var(--mel)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <a data-mailto data-c="contato.email"></a>
            </li>
            <li class="canal">
              <svg class="dr-icone" style="color: var(--mel)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
              <a target="_blank" rel="noopener" data-c="contato.whatsapp" data-c-href="contato.whatsappUrl"></a>
            </li>
            <li class="canal">
              <svg class="dr-icone" style="color: var(--mel)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              <a target="_blank" rel="noopener" data-c="contato.instagram" data-c-href="contato.instagramUrl"></a>
            </li>
          </ul>
          <div class="acoes">
            <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
            <a class="dr-btn dr-btn--noite" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
          </div>
        </div>
        <form class="form bloco" method="post" data-form-contato>
          <span class="dr-sr-only" data-c="contato.formEndpoint"></span>
          <div class="campo">
            <label for="f-nome" data-c="contato.form.nome"></label>
            <input id="f-nome" name="nome" type="text" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="f-email" data-c="contato.form.email"></label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="f-msg" data-c="contato.form.mensagem"></label>
            <textarea id="f-msg" name="mensagem" required></textarea>
          </div>
          <button class="dr-btn dr-btn--primario" type="submit" data-c="contato.form.enviar"></button>
        </form>
      </div>

  </main>

  <!-- SEÇÃO: rodape (a última tela; hidratar.js acrescenta o aviso de dados provisórios) -->
  <footer data-secao="rodape" class="tela rodape-tela">
    <div class="dr-container rodape">
      <img src="../img/logos/logo-negativa.png" alt="" data-c-alt="marca.alt" width="72" height="72">

        <p class="rodape__razao" data-c="rodape.razaoSocial"></p>

        <p data-c="rodape.endereco"></p>
      </div>
      <div>
        <p><a data-c="rodape.privacidade.texto" data-c-href="rodape.privacidade.url"></a></p>
        <p><span data-ano></span> <span data-c="rodape.direitos"></span></p>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });

        // N6: o ponto do capítulo visível fica aceso (vale também com movimento reduzido).
        var pontos = Array.prototype.slice.call(document.querySelectorAll('.ponto'));
        var alvos = pontos.map(function (p) { return document.querySelector(p.getAttribute('href')); });
        function marcar() {
          var meio = window.innerHeight * 0.45, ativo = 0;
          alvos.forEach(function (a, i) { if (a && a.getBoundingClientRect().top <= meio) ativo = i; });
          pontos.forEach(function (p, i) {
            if (i === ativo) p.setAttribute('aria-current', 'true'); else p.removeAttribute('aria-current');
          });
        }
        window.addEventListener('scroll', marcar, { passive: true });
        window.addEventListener('resize', marcar);
        marcar();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          var raiz = document.documentElement;

          // Efeito principal: a poça de luz mel acompanha o progresso do scroll.
          // Desce pela janela e troca de lado a cada capítulo (uma onda por ~2 telas).
          var luz = { x: 70, y: 34 };
          function pintar() {
            raiz.style.setProperty('--fx', luz.x.toFixed(2) + '%');
            raiz.style.setProperty('--fy', luz.y.toFixed(2) + '%');
          }
          var seguirX = gsap.quickTo(luz, 'x', { duration: 1.1, ease: 'power3.out', onUpdate: pintar });
          var seguirY = gsap.quickTo(luz, 'y', { duration: 1.1, ease: 'power3.out', onUpdate: pintar });
          var mover = ScrollTrigger.create({
            start: 0, end: 'max',
            onUpdate: function (st) {
              var p = st.progress;
              seguirX(50 + 20 * Math.cos(p * Math.PI * 9));
              seguirY(34 + 36 * p);
            }
          });

          // A luz se acende ao abrir a página.
          gsap.fromTo(luz, { x: 78, y: 18 }, { x: 70, y: 34, duration: 1, ease: 'power2.out', onUpdate: pintar });
          gsap.from('[data-surge]', { autoAlpha: 0, y: 18, duration: 0.7, ease: 'power2.out', stagger: 0.1, delay: 0.05 });

          // Blocos C7 surgem da sombra ao entrar na tela.
          gsap.utils.toArray('.tela:not(.tela--hero) .grade, .consequencias').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, y: 24, duration: 0.7, ease: 'power2.out', stagger: 0.08,
              scrollTrigger: { trigger: lista, start: 'top 86%', once: true }
            });
          });
          gsap.utils.toArray('.tela:not(.tela--hero) .cabeca, .citacao, .grande').forEach(function (el) {
            gsap.from(el, {
              autoAlpha: 0, y: 20, duration: 0.8, ease: 'power2.out',
              scrollTrigger: { trigger: el, start: 'top 88%', once: true }
            });
          });

          return function () {
            mover.kill();
            raiz.style.removeProperty('--fx');
            raiz.style.removeProperty('--fy');
          };
        });
      });
    })();
  </script>
</body>
</html>
