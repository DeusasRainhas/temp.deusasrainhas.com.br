<!doctype html>
<html lang="pt-BR" data-template="10">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 10 Cerrado</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       10 Cerrado · campo · N5 / C0 / R3
       Mapa de Goiás em SVG (contorno simplificado, projeção equirretangular
       a partir de coordenadas reais), com Cocalzinho de Goiás marcado.
       Os pinos dos municípios caem em sequência e linhas saem de Cocalzinho
       até cada um. Sem movimento: pinos e linhas já desenhados.
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --coluna: 264px; --barra-h: 64px; --respiro: 128px; }
    @media (max-width: 1023px) { :root { --coluna: 0px; --respiro: 80px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }
    body { overflow-x: clip; }
    main, footer { margin-left: var(--coluna); }

    /* ---------- R3: hairlines e muito espaço em branco ---------- */
    main > section { padding-block: var(--respiro); scroll-margin-top: var(--sp-5); }
    main > section + section { border-top: 1px solid var(--linha); }
    @media (max-width: 1023px) { main > section { scroll-margin-top: var(--barra-h); } }
    .dr-container { max-width: 1120px; }

    /* ---------- N5: índice em coluna fixa à esquerda com seções e progresso ---------- */
    .indice {
      position: fixed; z-index: 60; top: 0; bottom: 0; left: 0; width: var(--coluna);
      display: flex; flex-direction: column; padding: var(--sp-5) var(--sp-5) var(--sp-6);
      background: var(--creme-papel); border-right: 1px solid var(--linha);
    }
    .indice__marca img { width: 72px; height: 72px; }
    .indice__lista { position: relative; margin-top: var(--sp-7); padding-left: var(--sp-5); counter-reset: idx; }
    .indice__trilho { position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: var(--linha); border-radius: 1px; }
    .indice__trilho i { position: absolute; inset: 0; background: var(--petroleo); transform-origin: top; transform: scaleY(0); border-radius: 1px; }
    .indice__lista a {
      counter-increment: idx; display: flex; gap: var(--sp-3); align-items: baseline; padding-block: 9px;
      font-size: var(--fs-small); font-weight: 500; color: var(--corpo); text-decoration: none;
    }
    .indice__lista a::before { content: counter(idx, decimal-leading-zero); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--suave); min-width: 2ch; }
    .indice__lista a:hover { color: var(--terra-escura); }
    .indice__lista a.ativo { color: var(--terra-escura); font-weight: 700; }
    .indice__lista a.ativo::before { color: var(--petroleo); }
    .indice__pe { margin-top: auto; display: grid; gap: var(--sp-3); }
    .indice__pe .dr-btn { width: 100%; }
    .indice__barra { display: none; }
    @media (max-width: 1023px) {
      .indice {
        bottom: auto; right: 0; width: auto; height: var(--barra-h); flex-direction: row; align-items: center;
        gap: var(--sp-4); padding: 0 var(--sp-4); border-right: 0; border-bottom: 1px solid var(--linha);
      }
      .indice__marca img { width: 52px; height: 52px; }
      .indice__lista { display: none; }
      .indice__pe { margin: 0 0 0 auto; }
      .indice__pe .dr-btn { width: auto; padding: 10px 16px; font-size: var(--fs-small); }
      .indice__barra { display: block; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--linha); }
      .indice__barra i { position: absolute; inset: 0; background: var(--petroleo); transform-origin: left; transform: scaleX(0); }
    }

    /* ---------- Hero: mapa de Goiás ---------- */
    .hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-6); align-items: center; padding-top: var(--sp-8) !important; }
    .hero .dr-eyebrow { display: flex; align-items: center; gap: var(--sp-3); }
    .hero .dr-eyebrow svg { width: 16px; height: 16px; }
    .hero h1 { margin-top: var(--sp-4); font-size: clamp(44px, 5.2vw, 76px); line-height: 1; letter-spacing: -.025em; text-wrap: balance; }
    .hero__lede { margin-top: var(--sp-5); font-size: var(--fs-body-lg); line-height: 1.6; color: var(--corpo); max-width: 38ch; }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    .mapa { position: relative; }
    .mapa svg { display: block; width: 100%; height: auto; overflow: visible; }
    .mapa__estado { fill: var(--creme-papel); stroke: var(--terra); stroke-width: 1.6; stroke-linejoin: round; }
    .mapa__df { fill: none; stroke: var(--terra-clara); stroke-width: 1.2; stroke-dasharray: 4 4; }
    .mapa__linha { fill: none; stroke: var(--petroleo); stroke-width: 1.4; stroke-linecap: round; }
    .pino path { fill: var(--terra-escura); }
    .pino circle { fill: var(--creme); }
    .pino--casa path { fill: var(--mel); stroke: var(--terra-escura); stroke-width: 1.6; }
    .pino--casa circle { fill: var(--terra-escura); }
    .pino--casa .mapa__pulso { fill: none; stroke: var(--mel-escuro); stroke-width: 1.6; }
    .mapa__guia { fill: none; stroke: var(--terra); stroke-width: 1.2; stroke-dasharray: 3 4; }
    .mapa__rotulo { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; fill: var(--terra-escura); paint-order: stroke; stroke: var(--creme); stroke-width: 6px; stroke-linejoin: round; }
    .legenda { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-6); align-items: center; margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px solid var(--linha); }
    .legenda__item { display: flex; align-items: center; gap: var(--sp-3); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }
    .legenda__item svg { flex: none; width: 14px; height: 18px; }
    .legenda__valor { font-family: var(--serif); font-size: 32px; letter-spacing: -.02em; text-transform: none; color: var(--terra-escura); }
    @media (max-width: 1023px) { .hero { padding-top: calc(var(--barra-h) + var(--sp-7)) !important; } }
    @media (max-width: 899px) { .hero { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); } }

    /* ---------- Cabeça de seção ---------- */
    .cabeca { max-width: 720px; }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-3); }
    .cabeca + * { margin-top: var(--sp-8); }
    .intro { margin-top: var(--sp-4); max-width: 52ch; }
    @media (max-width: 767px) { .dr-h2 { font-size: 30px; } .cabeca + * { margin-top: var(--sp-6); } }

    /* ---------- C0: cards com hairline, raio --r-lg, ícone em petróleo ---------- */
    .cards { display: grid; gap: var(--sp-5); }
    .card { border: 1px solid var(--linha); border-radius: var(--r-lg); padding: var(--sp-6); background: transparent; }
    .card .dr-icone { color: var(--petroleo); margin-bottom: var(--sp-5); }
    .card .dr-h4 { margin-bottom: var(--sp-2); }
    .cards--prova { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cards--prova .card { padding: var(--sp-5); }
    .card__valor { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 4vw, 56px); line-height: 1; letter-spacing: -.02em; color: var(--terra-escura); }
    .card__rotulo { display: block; margin-top: var(--sp-4); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); line-height: 1.6; }
    .cards--seis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards--tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards--tres .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); margin-bottom: var(--sp-3); }
    .cards--quatro { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1199px) { .cards--seis, .cards--tres { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards--prova { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 767px) { .cards--seis, .cards--tres, .cards--quatro { grid-template-columns: minmax(0, 1fr); } .card { padding: var(--sp-5); } }

    /* ---------- Problema ---------- */
    .problema { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--sp-8); align-items: start; }
    .problema__valor { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(96px, 11vw, 160px); line-height: .85; letter-spacing: -.04em; color: var(--terra-escura); }
    .problema__dado { margin-top: var(--sp-7); }
    .problema__valor + p { margin-top: var(--sp-4); max-width: 28ch; }
    .riscos > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); padding-block: var(--sp-5); border-top: 1px solid var(--linha); }
    .riscos > li:last-of-type { border-bottom: 1px solid var(--linha); }
    .riscos .dr-icone { color: var(--erro); margin-top: 3px; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- Como funciona ---------- */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); }
    .passo { display: flex; flex-direction: column; }
    .passo__tela { display: flex; justify-content: center; align-items: flex-end; height: 300px; margin: calc(var(--sp-6) * -1) calc(var(--sp-6) * -1) var(--sp-5); padding-top: var(--sp-6); border-bottom: 1px solid var(--linha); overflow: hidden; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--creme-papel); }
    .passo__tela img { width: 180px; height: auto; max-height: 280px; object-fit: cover; object-position: top; border-radius: 16px 16px 0 0; border: 5px solid var(--grafite); border-bottom: 0; }
    .passo__num { font-family: var(--mono); font-size: var(--fs-small); letter-spacing: .12em; color: var(--petroleo); }
    .passo .dr-h4 { margin-block: var(--sp-2); }
    .passo .dr-caption { margin-top: var(--sp-3); color: var(--terra); }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); } .passo__tela { margin: calc(var(--sp-5) * -1) calc(var(--sp-5) * -1) var(--sp-5); } }

    /* ---------- Tecnologia ---------- */
    .tec { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: var(--sp-7); align-items: start; }
    .tec .cabeca + * { margin-top: 0; }
    @media (max-width: 899px) { .tec { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- Equipe ---------- */
    .origem { margin-top: var(--sp-4); max-width: 56ch; }
    .pessoa { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--sp-4); align-items: center; }
    .pessoa img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid var(--linha); }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    .pessoa .dr-h4 { margin: 0; font-size: 19px; }
    .apoios { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-5) var(--sp-8); margin-top: var(--sp-7); padding: var(--sp-6); border-radius: var(--r-lg); background: var(--grafite); }
    .apoio { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 84px; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); }
    .apoio__logo img { max-height: 60px; width: auto; max-width: 170px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }

    /* ---------- Depoimento ---------- */
    .citacao { max-width: 820px; }
    .citacao .dr-quote { font-size: clamp(26px, 3vw, 38px); line-height: 1.35; color: var(--terra-escura); text-wrap: balance; }
    .citacao figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .citacao figcaption img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 1px solid var(--linha); }
    .citacao__nome { display: block; font-weight: 700; color: var(--ink); }
    .citacao__local { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }
    .citacao__local svg { width: 14px; height: 14px; color: var(--petroleo); }

    /* ---------- Contato ---------- */
    .contato { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--sp-8); align-items: start; }
    .form { display: grid; gap: var(--sp-4); }
    .campo-f { display: grid; gap: var(--sp-2); }
    .campo-f label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo-f input, .campo-f textarea { font: inherit; font-size: var(--fs-body); color: var(--ink); width: 100%; background: var(--branco); border: var(--bd-forte); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4); }
    .campo-f textarea { min-height: 132px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { margin-top: var(--sp-6); }
    .canais > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-4); align-items: center; padding-block: var(--sp-4); border-top: 1px solid var(--linha); }
    .canais > li:last-child { border-bottom: 1px solid var(--linha); }
    .canais .dr-icone { color: var(--petroleo); }
    .canais a { font-weight: 600; font-size: var(--fs-body-lg); overflow-wrap: anywhere; text-underline-offset: 4px; }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- Rodapé ---------- */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1120px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) { .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); } footer > [data-aviso-provisorio] { padding-inline: 16px; } }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N5 · índice em coluna fixa à esquerda com seções e progresso; barra no topo abaixo de 1024px) -->
  <nav data-secao="nav" class="indice">
    <a class="indice__marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="72" height="72"></a>
    <div class="indice__lista">
      <span class="indice__trilho" aria-hidden="true"><i></i></span>
      <a href="#problema" data-c="problema.eyebrow"></a>
      <a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a>
      <a href="#como-funciona" data-c="comoFunciona.eyebrow"></a>
      <a href="#para-quem" data-c="paraQuem.eyebrow"></a>
      <a href="#tecnologia" data-c="tecnologia.eyebrow"></a>
      <a href="#equipe" data-c="equipe.eyebrow"></a>
      <a href="#contato" data-c="contato.eyebrow"></a>
    </div>
    <div class="indice__pe">
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
    <span class="indice__barra" aria-hidden="true"><i></i></span>
  </nav>

  <main>

    <!-- SEÇÃO: hero (mapa de Goiás em SVG com Cocalzinho marcado) -->
    <section data-secao="hero" id="inicio">
      <div class="dr-container hero">
        <div>
          <p class="dr-eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span data-c="rodape.endereco"></span></p>
          <h1 class="dr-display" data-c="hero.titulo"></h1>
          <p class="hero__lede" data-c="hero.subtitulo"></p>
          <div class="acoes">
            <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
            <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
            <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
          </div>
        </div>
        <figure class="mapa">
          <svg viewBox="0 0 770 700" role="img" aria-labelledby="mapa-rotulo">
            <defs>
              <pattern id="pontos" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D8CBA8"/></pattern>
              <clipPath id="recorte-go"><path d="M310 20 L380 40 L440 30 L510 50 L580 30 L650 25 L710 20 L735 60 L745 120 L725 170 L705 220 L655 255 L655 300 L615 350 L605 420 L585 480 L575 530 L535 570 L480 565 L420 585 L350 610 L290 640 L240 665 L180 670 L135 640 L80 590 L35 540 L20 490 L45 440 L80 380 L125 320 L180 260 L225 190 L255 120 L290 60 Z"/></clipPath>
            </defs>
            <path class="mapa__estado" d="M310 20 L380 40 L440 30 L510 50 L580 30 L650 25 L710 20 L735 60 L745 120 L725 170 L705 220 L655 255 L655 300 L615 350 L605 420 L585 480 L575 530 L535 570 L480 565 L420 585 L350 610 L290 640 L240 665 L180 670 L135 640 L80 590 L35 540 L20 490 L45 440 L80 380 L125 320 L180 260 L225 190 L255 120 L290 60 Z"/>
            <rect width="770" height="700" fill="url(#pontos)" clip-path="url(#recorte-go)"/>
            <rect class="mapa__df" x="512" y="280" width="97" height="55" rx="3"/>
            <g class="mapa__linhas" data-origem="463,309"></g>
            <g class="mapa__pinos">
              <g class="pino" transform="translate(415 398)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(445 363)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(380 260)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(607 284)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(494 177)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(326 323)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>
              <g class="pino" transform="translate(579 407)"><g class="pino__cai"><path d="M0 0C-2-5-8-9-8-15a8 8 0 1 1 16 0C8-9 2-5 0 0Z"/><circle cy="-15" r="3"/></g></g>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      var SVGNS = 'http://www.w3.org/2000/svg';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) { if (email) a.setAttribute('href', 'mailto:' + email.v); });
        document.querySelectorAll('[data-ano]').forEach(function (el) { el.textContent = '© ' + new Date().getFullYear(); });

        // Rede: uma curva de Cocalzinho até cada pino (desenhada sempre; o GSAP só anima).
        var grupo = document.querySelector('.mapa__linhas');
        var o = grupo.getAttribute('data-origem').split(',').map(Number);
        var pinos = Array.prototype.slice.call(document.querySelectorAll('.mapa__pinos .pino'));
        var linhas = pinos.map(function (p) {
          var m = /translate\(([\d.]+)[ ,]+([\d.]+)\)/.exec(p.getAttribute('transform'));
          var x = +m[1], y = +m[2];
          var mx = (o[0] + x) / 2, my = (o[1] + y) / 2;
          var dx = x - o[0], dy = y - o[1];
          var cx = mx - dy * 0.18, cy = my + dx * 0.18 - 10;
          var path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('class', 'mapa__linha');
          path.setAttribute('d', 'M' + o[0] + ' ' + (o[1] - 12) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x + ' ' + (y - 15));
          grupo.appendChild(path);
          return path;
        });

        // N5: seção ativa e progresso.
        var links = Array.prototype.slice.call(document.querySelectorAll('.indice__lista a'));
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function (es) {
            es.forEach(function (e) {
              if (!e.isIntersecting) return;
              links.forEach(function (a) { a.classList.toggle('ativo', a.getAttribute('href') === '#' + e.target.id); });
            });
          }, { rootMargin: '-40% 0px -55% 0px' });
          links.forEach(function (a) { var t = document.querySelector(a.getAttribute('href')); if (t) obs.observe(t); });
        }
        var trilho = document.querySelector('.indice__trilho i');
        var barra = document.querySelector('.indice__barra i');
        function progresso() {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
          trilho.style.transform = 'scaleY(' + p + ')';
          barra.style.transform = 'scaleX(' + p + ')';
        }
        progresso();
        window.addEventListener('scroll', progresso, { passive: true });
        window.addEventListener('resize', progresso);

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // Efeito principal: os pinos caem em sequência e as linhas ligam cada um a Cocalzinho.
          var casa = document.querySelector('.pino--casa .pino__cai');
          var tl = gsap.timeline({ delay: 0.15 });
          tl.from('.mapa__estado', { strokeDasharray: 3000, strokeDashoffset: 3000, duration: 0.7, ease: 'power2.inOut' }, 0)
            .from(casa, { y: -120, autoAlpha: 0, duration: 0.5, ease: 'bounce.out' }, 0.15)
            .from('.mapa__guia', { strokeDashoffset: 400, duration: 0.5, ease: 'power2.out' }, 0.4)
            .from('.mapa__rotulo', { autoAlpha: 0, x: 12, duration: 0.3 }, 0.6);
          // Pinos em ordem de distância a Cocalzinho: a rede cresce a partir de casa.
          var ordem = pinos.map(function (p, i) { return i; }).sort(function (a, b) {
            return linhas[a].getTotalLength() - linhas[b].getTotalLength();
          });
          ordem.forEach(function (i, k) {
            var t = 0.45 + k * 0.045;
            var len = linhas[i].getTotalLength();
            gsap.set(linhas[i], { strokeDasharray: len });
            tl.from(pinos[i].querySelector('.pino__cai'), { y: -70, autoAlpha: 0, duration: 0.42, ease: 'bounce.out' }, t)
              .fromTo(linhas[i], { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, t + 0.18);
          });
          // Pulso contínuo em Cocalzinho.
          gsap.fromTo('.mapa__pulso', { scale: 0.6, transformOrigin: 'center', opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 1.8, ease: 'power1.out', repeat: -1, delay: 1.2 });
          gsap.from('.hero > div:first-child > *', { y: 28, autoAlpha: 0, duration: 0.8, ease: 'power3.out', stagger: 0.1 });

          // R3: os blocos entram com calma, sem chamar atenção.
          gsap.utils.toArray('.cards, .riscos, .passos').forEach(function (l) {
            gsap.from(l.children, { y: 20, autoAlpha: 0, duration: 0.7, ease: 'power2.out', stagger: 0.07, scrollTrigger: { trigger: l, start: 'top 85%', once: true } });
          });
        });
      });
    })();
  </script>
