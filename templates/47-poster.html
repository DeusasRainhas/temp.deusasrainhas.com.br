<!doctype html>
<html lang="pt-BR" data-template="47">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 47 Poster</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       47 Poster · estrutural · N0 / C0 / R2
       Cartaz tipográfico: o título, gigante e girado 90°, fica fixo numa
       coluna à esquerda enquanto as seções passam ao lado. A rotação é
       recurso de diagramação; a logo nunca gira. Sobre os blocos grafite
       (R2) o cartaz troca de tinta: terra escura no creme, creme no grafite.
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root {
      --nav-h: 76px;
      --cartaz-w: min(30vw, 440px);
      --respiro: var(--sp-9);
      --tinta: var(--terra-escura);
      --tinta-sub: var(--terra);
      --cartaz-fundo: var(--creme);
    }
    @media (max-width: 1023px) { :root { --nav-h: 68px; --cartaz-w: 48px; --respiro: var(--sp-8); } }
    body.sobre-escuro { --tinta: var(--creme); --tinta-sub: var(--mel-claro); --cartaz-fundo: var(--grafite); }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    img { height: auto; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }

    /* ---------- N0: barra superior fixa ---------- */
    .barra {
      position: fixed; inset: 0 0 auto 0; z-index: 60; height: var(--nav-h);
      background: var(--creme); border-bottom: 3px solid var(--terra-escura);
    }
    .barra__in { display: flex; align-items: center; gap: var(--sp-5); height: 100%; padding-inline: var(--sp-6); }
    .marca { display: block; flex: none; }
    .marca img { width: 64px; height: 64px; }
    .barra__links { display: flex; gap: var(--sp-5); margin-inline: auto; }
    .barra__links a {
      font-family: var(--mono); font-size: var(--fs-eyebrow); font-weight: 500; letter-spacing: .16em;
      text-transform: uppercase; color: var(--terra-escura); text-decoration: none; padding-block: var(--sp-2);
      border-bottom: 2px solid transparent;
    }
    .barra__links a:hover { border-bottom-color: var(--mel); }
    .barra .dr-btn { margin-left: auto; padding: 10px 18px; font-size: var(--fs-small); }
    @media (max-width: 1099px) { .barra__links { display: none; } }
    @media (max-width: 767px) {
      .barra__in { padding-inline: var(--sp-4); }
      .marca img { width: 54px; height: 54px; }
    }
    body { padding-top: var(--nav-h); }
    main { overflow-x: clip; }

    /* ---------- O cartaz: coluna fixa com o título girado ---------- */
    .cartaz {
      position: fixed; z-index: 40; left: 0; top: var(--nav-h); bottom: 0; width: var(--cartaz-w);
      border-right: 3px solid var(--tinta); pointer-events: none;
      display: flex; align-items: stretch; justify-content: flex-start;
      padding: var(--sp-6) 0 var(--sp-6) var(--sp-6);
      /* fundo próprio que troca junto com a tinta: o título nunca fica sobre a faixa errada */
      background: var(--cartaz-fundo);
      transition: border-color .3s ease, background-color .3s ease;
    }
    .cartaz__titulo {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: var(--serif); font-weight: 500; color: var(--tinta);
      font-size: min(13.2vh, 8.4vw); line-height: .9; letter-spacing: -.035em;
      max-block-size: 100%; text-wrap: balance;
      transition: color .3s ease;
    }
    .cartaz__titulo .linha { display: block; }
    .cartaz__lado {
      position: absolute; right: var(--sp-5); top: var(--sp-6); bottom: var(--sp-6);
      display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
    }
    .cartaz__indice {
      writing-mode: vertical-rl; font-family: var(--mono); font-size: var(--fs-eyebrow); font-weight: 500;
      letter-spacing: .22em; text-transform: uppercase; color: var(--tinta-sub); overflow: hidden;
      transition: color .3s ease;
    }
    .cartaz__indice span { display: inline-block; }
    .cartaz__trilho { position: relative; width: 3px; flex: 1; margin-block: var(--sp-5); background: var(--tinta); opacity: 1; }
    .cartaz__trilho i { position: absolute; inset: 0 0 auto 0; height: 22%; background: var(--mel); }
    @media (max-width: 1023px) {
      .cartaz { padding: var(--sp-4) 0 var(--sp-4) 6px; border-right-width: 2px; }
      .cartaz__titulo { font-size: min(4.6vh, 38px); line-height: 1; letter-spacing: -.02em; text-wrap: nowrap; white-space: nowrap; }
      .cartaz__lado { display: none; }
    }

    /* ---------- R2: blocos grafite full-bleed intercalados com creme ---------- */
    main > section { padding: var(--respiro) 0 var(--respiro) var(--cartaz-w); scroll-margin-top: var(--nav-h); }
    .escuro { background: var(--grafite); color: var(--tenue); }
    .escuro .dr-h2, .escuro .dr-h3, .escuro .dr-h4 { color: var(--creme); }
    .escuro .dr-body, .escuro .dr-body-lg { color: var(--tenue); }
    .escuro .dr-eyebrow { color: var(--mel-claro); }
    .miolo { max-width: 960px; margin-inline: auto; padding-inline: var(--sp-7); }
    @media (max-width: 767px) { .miolo { padding-inline: var(--sp-4); } }

    .cabeca { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-7); max-width: 720px; }
    .cabeca .dr-h2 { font-size: clamp(32px, 4vw, 52px); line-height: 1.04; letter-spacing: -.02em; }
    .cabeca .dr-body-lg { margin-top: var(--sp-2); }
    .cabeca::after { content: ""; width: 72px; height: 6px; background: var(--mel); margin-top: var(--sp-3); }

    /* ---------- Hero (o título está no cartaz) ---------- */
    main > section[data-secao="hero"] { padding-top: var(--sp-8); min-height: calc(100vh - var(--nav-h)); display: flex; align-items: center; }
    .hero { display: grid; gap: var(--sp-6); }
    .hero__sub { font-family: var(--serif); font-size: clamp(26px, 3vw, 40px); line-height: 1.18; color: var(--terra-escura); letter-spacing: -.01em; max-width: 22ch; }
    .hero__acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
    .hero__foto { display: grid; gap: var(--sp-3); margin-top: var(--sp-3); }
    .hero__foto img { width: 100%; aspect-ratio: 21 / 9; object-fit: cover; border: 3px solid var(--terra-escura); }
    .hero__foto figcaption { color: var(--terra); }
    @media (max-width: 767px) {
      main > section[data-secao="hero"] { min-height: 0; padding-top: var(--sp-7); }
      .hero__foto img { aspect-ratio: 4 / 3; }
    }

    /* ---------- Prova (grafite) ---------- */
    .placar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 3px solid var(--mel); }
    .placar > li { padding: var(--sp-6) var(--sp-5) var(--sp-6) 0; border-bottom: 1px solid var(--grafite-suave); }
    .placar > li:nth-child(even) { padding-left: var(--sp-6); border-left: 1px solid var(--grafite-suave); }
    .placar__valor { display: block; font-size: clamp(56px, 7vw, 104px); line-height: .9; color: var(--mel); letter-spacing: -.05em; }
    .placar__rotulo { display: block; margin-top: var(--sp-3); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .16em; text-transform: uppercase; color: var(--creme); }
    @media (max-width: 599px) {
      .placar { grid-template-columns: minmax(0, 1fr); }
      .placar > li:nth-child(even) { padding-left: 0; border-left: 0; }
    }

    /* ---------- Problema ---------- */
    .problema { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-7); align-items: start; }
    .problema__valor { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(96px, 10vw, 150px); line-height: .8; color: var(--terra-escura); letter-spacing: -.05em; }
    .problema__texto { margin-top: var(--sp-4); max-width: 26ch; }
    .consequencias > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-4); padding-block: var(--sp-5); border-top: 3px solid var(--terra-escura); }
    .consequencias > li:last-child { border-bottom: 3px solid var(--terra-escura); }
    .consequencias .dr-icone { color: var(--erro); margin-top: 4px; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- C0: cards hairline, raio lg, ícone petróleo ---------- */
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-5); }
    .card { background: var(--branco); border: var(--bd); border-radius: var(--r-lg); padding: var(--sp-6); display: grid; gap: var(--sp-3); align-content: start; }
    .card .dr-icone { color: var(--petroleo); width: 32px; height: 32px; }
    .card__topo { display: flex; justify-content: space-between; align-items: center; }
    @media (max-width: 767px) { .cards { grid-template-columns: minmax(0, 1fr); } .card { padding: var(--sp-5); } }

    /* ---------- Como funciona (grafite) ---------- */
    .passos { display: grid; gap: var(--sp-7); }
    .passo { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--sp-6); align-items: center; padding-top: var(--sp-6); border-top: 1px solid var(--grafite-suave); }
    .passo__numero { display: block; font-size: 64px; line-height: 1; color: var(--mel); letter-spacing: -.04em; margin-bottom: var(--sp-3); }
    .passo .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin-bottom: var(--sp-3); }
    .passo img { width: 200px; max-height: 300px; object-fit: cover; object-position: top; border-radius: var(--r-lg); border: 3px solid var(--grafite-suave); background: var(--creme-papel); }
    @media (max-width: 599px) { .passo { grid-template-columns: minmax(0, 1fr); } .passo img { width: 180px; } }

    /* ---------- Para quem ---------- */
    .perfis { display: grid; gap: var(--sp-4); }
    .perfil { background: var(--branco); border: var(--bd); border-radius: var(--r-lg); padding: var(--sp-6); display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--sp-6); align-items: baseline; }
    .perfil .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--terra-escura); }
    @media (max-width: 767px) { .perfil { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); padding: var(--sp-5); } }

    /* ---------- Tecnologia (grafite) ---------- */
    .tec-texto { font-family: var(--serif); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3; color: var(--creme); max-width: 30ch; margin-bottom: var(--sp-7); }
    .pilares { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--sp-7); counter-reset: pilar; }
    .pilar { counter-increment: pilar; padding-block: var(--sp-5); border-top: 3px solid var(--mel); display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--sp-4); }
    .pilar .dr-icone { color: var(--mel-claro); margin-top: 2px; }
    .pilar .dr-h4 { margin-bottom: var(--sp-2); }
    @media (max-width: 767px) { .pilares { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Equipe ---------- */
    .origem { font-size: var(--fs-body-lg); max-width: 56ch; margin-bottom: var(--sp-7); }
    .pessoas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); }
    .pessoa { border-top: 3px solid var(--terra-escura); padding-top: var(--sp-4); }
    .pessoa img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--r-lg); border: var(--bd); margin-bottom: var(--sp-4); }
    .pessoa .dr-h4 { font-size: 19px; }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    .apoios { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-7); }
    .apoio { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-5); border: var(--bd); border-radius: var(--r-lg); background: var(--branco); }
    .apoio[data-fundo="escuro"] { background: var(--grafite); border-color: var(--grafite); }
    .apoio img { max-height: 44px; width: auto; max-width: 140px; }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }
    .apoio[data-fundo="escuro"] .apoio__nome { color: var(--mel-claro); }
    @media (max-width: 767px) { .pessoas { grid-template-columns: minmax(0, 1fr); } .pessoa img { aspect-ratio: 16 / 9; } }

    /* ---------- Depoimento (grafite) ---------- */
    .citacao__aspas { display: block; font-family: var(--serif); font-size: 160px; line-height: .7; height: 80px; color: var(--mel); }
    .citacao .dr-quote { font-size: clamp(28px, 3.6vw, 46px); line-height: 1.22; color: var(--creme); max-width: 24ch; }
    .citacao figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-7); padding-top: var(--sp-5); border-top: 1px solid var(--grafite-suave); }
    .citacao figcaption img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .citacao__nome { font-weight: 700; color: var(--creme); }
    .citacao__local { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--mel-claro); }

    /* ---------- Contato ---------- */
    .contato { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--sp-7); }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink); background: var(--branco);
      border: var(--bd-forte); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-3); align-content: start; }
    .canal { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-3); align-items: center; padding: var(--sp-4) var(--sp-5); border: var(--bd); border-radius: var(--r-lg); background: var(--branco); }
    .canal .dr-icone { color: var(--petroleo); }
    .canal a { font-weight: 600; text-underline-offset: 4px; overflow-wrap: anywhere; }
    .contato__acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-3); }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Rodapé (grafite) ---------- */
    footer[data-secao="rodape"] { position: relative; z-index: 45; background: var(--grafite); color: var(--tenue); padding: var(--sp-7) 0 96px var(--cartaz-w); }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 960px; margin: var(--sp-5) auto 0; padding-inline: var(--sp-7); color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: var(--sp-4); }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N0 · barra superior fixa, logo à esquerda, CTA à direita) -->
  <nav data-secao="nav" class="barra">
    <div class="barra__in">
      <a class="marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64"></a>
      <div class="barra__links">
        <a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a>
        <a href="#como-funciona" data-c="comoFunciona.eyebrow"></a>
        <a href="#para-quem" data-c="paraQuem.eyebrow"></a>
        <a href="#equipe" data-c="equipe.eyebrow"></a>
        <a href="#contato" data-c="contato.eyebrow"></a>
      </div>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
  </nav>

  <main>

    <!-- SEÇÃO: hero (cartaz tipográfico rotacionado: o h1 fica fixo na coluna esquerda) -->
    <section data-secao="hero" id="inicio" data-tom="claro">
      <div class="cartaz" data-cartaz>
        <h1 class="cartaz__titulo" data-c="hero.titulo"></h1>
        <div class="cartaz__lado" aria-hidden="true">
          <p class="cartaz__indice"><span data-indice></span></p>
          <div class="cartaz__trilho"><i data-trilho></i></div>
        </div>
      </div>
      <div class="miolo hero">
        <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
        <p class="hero__sub" data-c="hero.subtitulo"></p>
        <div class="hero__acoes">
          <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
          <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
          <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
        </div>
        <figure class="hero__foto">
          <img data-c-src="hero.imagem" data-c-alt="hero.imagemAlt" alt="" width="1600" height="1000">
          <figcaption class="dr-caption" data-c="hero.imagemAlt"></figcaption>
        </figure>
      </div>
    </section>

    <!-- SEÇÃO: prova (bloco grafite) -->
    <section data-secao="prova" class="escuro" data-tom="escuro" data-rotulo="hero.eyebrow">
      <div class="miolo">
        <ul class="placar" data-entra data-c-lista="prova.stats">
          <template>
            <li>
              <span class="dr-data placar__valor" data-c="valor"></span>
              <span class="placar__rotulo" data-c="rotulo"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: problema -->
    <section data-secao="problema" data-tom="claro" data-rotulo="problema.eyebrow">
      <div class="miolo">
        <header class="cabeca" data-entra>
          <p class="dr-eyebrow" data-c="problema.eyebrow"></p>
          <h2 class="dr-h2" data-c="problema.titulo"></h2>
        </header>
        <div class="problema">
          <div data-entra>
            <span class="problema__valor" data-c="problema.estatistica.valor"></span>
            <p class="dr-body-lg problema__texto" data-c="problema.estatistica.texto"></p>
          </div>
          <ul class="consequencias" data-entra data-c-lista="problema.consequencias">
            <template>
              <li>
                <svg class="dr-icone" aria-hidden="true"><use href="#dr-alerta"></use></svg>
                <p class="dr-body-lg" data-c="texto"></p>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: funcionalidades (C0 · cards hairline) -->
    <section data-secao="funcionalidades" id="funcionalidades" data-tom="claro" data-rotulo="funcionalidades.eyebrow">
      <div class="miolo">
        <header class="cabeca" data-entra>
          <p class="dr-eyebrow" data-c="funcionalidades.eyebrow"></p>
          <h2 class="dr-h2" data-c="funcionalidades.titulo"></h2>
        </header>
        <ul class="cards" data-entra data-c-lista="funcionalidades.itens">
          <template>
            <li class="card">
              <svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg>
              <h3 class="dr-h4" data-c="titulo"></h3>
              <p class="dr-body" data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: como-funciona (bloco grafite) -->
    <section data-secao="como-funciona" id="como-funciona" class="escuro" data-tom="escuro" data-rotulo="comoFunciona.eyebrow">
      <div class="miolo">
        <header class="cabeca" data-entra>
          <p class="dr-eyebrow" data-c="comoFunciona.eyebrow"></p>
          <h2 class="dr-h2" data-c="comoFunciona.titulo"></h2>
        </header>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });

        /* ---- O cartaz acompanha a seção que passa ao lado (troca de estado, sempre) ----
           Tinta: escura sobre creme, creme sobre grafite. Índice: número + rótulo da seção. */
        var secoes = Array.prototype.slice.call(document.querySelectorAll('main > section, footer[data-secao]'));
        var indice = document.querySelector('[data-indice]');
        var trilho = document.querySelector('[data-trilho]');
        var atual = -1;
        function rotuloDe(sec, i) {
          var caminho = sec.getAttribute('data-rotulo') || 'hero.eyebrow';
          var r = DR.valor(caminho);
          return String(i + 1).padStart(2, '0') + ' / ' + String(secoes.length - 1).padStart(2, '0') + '  ' + (r ? r.v : '');
        }
        function acompanhar() {
          var meio = window.innerHeight * 0.5;
          var achou = 0;
          secoes.forEach(function (sec, i) {
            var r = sec.getBoundingClientRect();
            if (r.top <= meio && r.bottom > meio) achou = i;
          });
          document.body.classList.toggle('sobre-escuro', secoes[achou].getAttribute('data-tom') === 'escuro');
          var max = document.documentElement.scrollHeight - window.innerHeight;
          if (trilho) trilho.style.top = (max > 0 ? (window.scrollY / max) * 78 : 0) + '%';
          if (achou !== atual && achou < secoes.length - 1) {
            atual = achou;
            if (indice) {
              indice.textContent = rotuloDe(secoes[achou], achou);
              document.dispatchEvent(new CustomEvent('cartaz:troca'));
            }
          }
        }
        window.addEventListener('scroll', acompanhar, { passive: true });
        window.addEventListener('resize', acompanhar);
        acompanhar();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          var titulo = document.querySelector('.cartaz__titulo');

          // O cartaz "sobe" ao longo do próprio eixo e o fio lateral se estica (≈1s).
          var tl = gsap.timeline();
          tl.from('.cartaz', { borderRightColor: 'rgba(0,0,0,0)', duration: 0.01 })
            .fromTo(titulo, { clipPath: 'inset(100% 0 0 0)', yPercent: 12 },
              { clipPath: 'inset(0% 0 0 0)', yPercent: 0, duration: 0.9, ease: 'power4.out' }, 0)
            .from('.hero > *', { x: 40, autoAlpha: 0, duration: 0.6, ease: 'power3.out', stagger: 0.08 }, 0.25);

          // O índice lateral troca de rótulo deslizando, como uma régua de cartaz.
          function trocar() { gsap.fromTo('[data-indice]', { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: 'power3.out' }); }
          document.addEventListener('cartaz:troca', trocar);

          // Conteúdo passa: cada bloco entra deslizando da direita, rente ao cartaz.
          gsap.utils.toArray('[data-entra]').forEach(function (el) {
            var alvo = el.children.length > 1 && el.matches('ul, ol') ? el.children : el;
            gsap.from(alvo, {
              x: 48, autoAlpha: 0, duration: 0.7, ease: 'power3.out', stagger: 0.08,
              scrollTrigger: { trigger: el, start: 'top 85%', once: true }
            });
          });

          return function () { document.removeEventListener('cartaz:troca', trocar); };
        });
      });
    })();
  </script>
