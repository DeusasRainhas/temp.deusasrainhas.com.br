<!doctype html>
<html lang="pt-BR" data-template="18">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 18 Enxame</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       18 Enxame · favo · N5 / C8 / R9
       Partículas douradas sobre creme: um enxame em canvas que chega,
       zumbe e se organiza num favo de sete células. O cursor espanta as
       abelhas; um toque dispersa o favo, que se refaz em seguida.
       Regras herdadas do 01:
       - nada de opacity < 1 fora do gsap.matchMedia (texto "apagado" usa cor);
       - canto inferior direito livre (pílula do switcher).
       Canvas: redimensiona, limita partículas pela área, pausa com a aba
       oculta ou fora da tela e não roda com movimento reduzido (fica o
       favo pontilhado estático em SVG).
       ================================================================= */

    :root { --indice: 256px; --respiro: clamp(64px, 9vw, 120px); --topo: 0px; }
    @media (max-width: 1099px) { :root { --indice: 0px; --topo: 60px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--petroleo); outline-offset: 2px;
    }
    main, footer[data-secao="rodape"] { margin-left: var(--indice); }
    main > section { scroll-margin-top: var(--topo); }
    .miolo { max-width: 1040px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 56px); }

    /* ---------- N5: índice em coluna fixa à esquerda, com progresso ---------- */
    .indice {
      position: fixed; inset: 0 auto 0 0; z-index: 60; width: var(--indice);
      display: flex; flex-direction: column; gap: var(--sp-6);
      padding: var(--sp-6) var(--sp-5) var(--sp-6) var(--sp-6);
      background: var(--creme); border-right: 1px solid var(--linha);
    }
    .indice__marca img { width: 64px; height: 64px; }
    .indice__lista { display: grid; gap: 2px; counter-reset: i; }
    .indice__lista li { counter-increment: i; }
    .indice__lista a {
      --p: 0;
      position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: var(--sp-2);
      padding: 10px 0 12px; text-decoration: none; color: var(--suave);
      font-family: var(--sans); font-weight: 600; font-size: var(--fs-small); line-height: 1.3;
    }
    .indice__lista a::before {
      content: counter(i, decimal-leading-zero);
      font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--terra-clara); padding-top: 1px;
    }
    .indice__lista a::after {
      content: ""; position: absolute; left: 34px; right: 0; bottom: 4px; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--mel) calc(var(--p) * 100%), var(--linha) 0);
    }
    .indice__lista a:hover { color: var(--terra-escura); }
    .indice__lista a[aria-current="true"] { color: var(--terra-escura); }
    .indice__lista a[aria-current="true"]::before { color: var(--petroleo); }
    .indice__pe { margin-top: auto; display: grid; gap: var(--sp-3); }
    .indice__pe .dr-btn { width: 100%; }
    .indice__total { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--terra); }
    .indice__alternar, .indice__atual { display: none; }

    @media (max-width: 1099px) {
      .indice {
        inset: 0 0 auto 0; width: auto; height: var(--topo); flex-direction: row; align-items: center; gap: var(--sp-3);
        padding: 0 var(--sp-4); border-right: 0; border-bottom: 1px solid var(--linha);
      }
      .indice::after {
        content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: calc(var(--total, 0) * 100%); background: var(--mel);
      }
      .indice__marca img { width: 48px; height: 48px; }
      .indice__atual {
        display: block; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--terra-escura);
      }
      .indice__alternar {
        display: inline-flex; align-items: center; gap: var(--sp-2); flex: none;
        height: 40px; padding: 0 14px; border: var(--bd-forte); border-radius: var(--r-pill); background: var(--branco);
        color: var(--terra-escura); cursor: pointer;
      }
      .indice__alternar svg { width: 18px; height: 18px; }
      .indice__lista {
        position: absolute; top: var(--topo); left: 0; right: 0; padding: var(--sp-3) var(--sp-5) var(--sp-5);
        background: var(--creme); border-bottom: 1px solid var(--linha); box-shadow: var(--sh-md);
      }
      .indice__lista[data-fechado] { display: none; }
      .indice__pe { display: none; }
      body { padding-top: var(--topo); }
    }

    /* ---------- R9: fundo muda por seção ---------- */
    .s-creme { background: var(--creme); }
    .s-papel { background: var(--creme-papel); }
    .s-sup { background: var(--superficie); }
    .s-veu { background: var(--mel-veu); }
    .secao { padding-block: var(--respiro); }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-3); }
    .cabeca .dr-body-lg { margin-top: var(--sp-4); max-width: 54ch; }
    .cabeca + * { margin-top: var(--sp-7); }
    @media (max-width: 767px) { .dr-h2 { font-size: 30px; } }

    /* ---------- Hero: enxame em canvas sobre creme ---------- */
    .hero { position: relative; min-height: max(660px, calc(100svh - var(--topo))); display: grid; overflow: hidden; }
    .hero__canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    .hero--vivo .hero__canvas { display: block; }
    .hero__grade {
      position: relative; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-rows: 1fr auto;
      width: 100%; padding-block: var(--sp-8) var(--sp-8);
    }
    .hero__alvo { grid-column: 2; grid-row: 1 / span 2; align-self: center; position: relative; aspect-ratio: 1; width: 100%; max-width: 420px; justify-self: end; margin-left: var(--sp-6); }
    .hero__alvo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .hero--vivo .hero__alvo svg { visibility: hidden; }
    .hero__texto { grid-column: 1; grid-row: 2; position: relative; max-width: 620px; }
    .hero__texto .dr-eyebrow { display: inline-flex; align-items: center; gap: var(--sp-3); }
    .hero__texto .dr-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mel); box-shadow: 12px 0 0 var(--mel-claro), 24px 0 0 var(--mel-escuro); margin-right: 26px; }
    .hero__titulo { margin-top: var(--sp-5); font-size: clamp(46px, 6.4vw, 92px); line-height: .96; letter-spacing: -.032em; text-wrap: balance; }
    .hero__sub { margin-top: var(--sp-5); max-width: 42ch; }
    .hero__acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    @media (max-width: 899px) {
      .hero { min-height: 0; }
      .hero__grade { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; padding-block: var(--sp-5) var(--sp-7); }
      .hero__alvo { grid-column: 1; grid-row: 1; max-width: 300px; }
      .hero__texto { grid-column: 1; grid-row: 2; margin-top: var(--sp-5); }
      .hero__titulo { font-size: 42px; }
    }

    /* ---------- C8: fichas brancas com eyebrow e dado em destaque ---------- */
    .ficha {
      position: relative; background: var(--branco); border: 1px solid var(--linha); border-radius: 6px;
      padding: var(--sp-5) var(--sp-5) var(--sp-6); box-shadow: var(--sh-sm);
    }
    .ficha::before {
      /* furo de fichário */
      content: ""; position: absolute; top: 14px; right: 16px; width: 10px; height: 10px; border-radius: 50%;
      background: var(--creme); box-shadow: inset 0 1px 2px rgba(78,52,46,.18);
    }
    .ficha__eyebrow {
      display: flex; align-items: center; gap: var(--sp-2); padding-bottom: var(--sp-3); margin-bottom: var(--sp-4);
      border-bottom: 1px dashed var(--linha-forte);
      font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--petroleo);
    }
    .ficha__eyebrow .dr-icone { width: 18px; height: 18px; }
    .ficha__dado { display: block; font-family: var(--mono); font-weight: 500; font-size: clamp(38px, 4vw, 56px); line-height: 1; letter-spacing: -.02em; color: var(--terra-escura); }
    .ficha__dado::after { content: ""; display: block; width: 40px; height: 6px; margin-top: var(--sp-4); border-radius: 3px; background: var(--mel); }
    .ficha .dr-h4 { margin-bottom: var(--sp-2); }

    .placar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); }
    @media (max-width: 899px) { .placar { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); } .placar .ficha { padding: var(--sp-4); } .ficha__dado { font-size: 34px; } }

    /* Problema */
    .problema { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-7); align-items: start; }
    .problema .ficha--grande .ficha__dado { font-size: clamp(80px, 10vw, 128px); }
    .problema .ficha--grande p { margin-top: var(--sp-4); }
    .consequencias { display: grid; gap: var(--sp-3); margin-top: var(--sp-6); }
    .consequencias li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--sp-3); }
    .consequencias .dr-icone { width: 20px; height: 20px; color: var(--erro); margin-top: 4px; }
    .cabeca .consequencias .dr-body-lg { margin-top: 0; }
    .placar .ficha__eyebrow { min-height: 48px; align-items: flex-start; }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); } }

    /* Funcionalidades: fichas soltas, levemente fora de esquadro */
    .fichas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); }
    .fichas .ficha:nth-child(3n+1) { transform: rotate(-.6deg); }
    .fichas .ficha:nth-child(3n+3) { transform: rotate(.5deg); }
    .fichas .ficha:hover { transform: translateY(-4px) rotate(0); box-shadow: var(--sh-md); transition: transform .3s ease, box-shadow .3s ease; }
    .ficha__titulo { font-family: var(--serif); font-weight: 500; font-size: 25px; line-height: 1.15; color: var(--terra-escura); margin-bottom: var(--sp-3); }
    @media (max-width: 1023px) { .fichas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 599px) { .fichas { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); } .fichas .ficha:nth-child(n) { transform: none; } }

    /* Como funciona: linha do tempo com telas */
    .passos { display: grid; gap: var(--sp-7); counter-reset: p; }
    .passo { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--sp-7); align-items: center; }
    .passo img { width: 200px; max-height: 340px; object-fit: cover; object-position: top; border-radius: 18px; border: 6px solid var(--grafite); background: var(--creme-papel); }
    .passo__num { display: inline-block; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; color: var(--terra-escura); background: var(--mel); padding: 4px 10px; border-radius: var(--r-pill); }
    .passo .dr-h3 { margin-block: var(--sp-4) var(--sp-3); font-family: var(--serif); font-weight: 500; color: var(--terra-escura); }
    .passo figcaption { margin-top: var(--sp-4); }
    .passo:nth-child(even) { grid-template-columns: minmax(0, 1fr) 200px; }
    .passo:nth-child(even) > figure { order: 2; }
    @media (max-width: 699px) {
      .passo, .passo:nth-child(even) { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      .passo:nth-child(even) > figure { order: 0; }
      .passo img { width: 180px; }
    }

    /* Para quem / Tecnologia */
    .perfis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
    .pilares { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
    @media (max-width: 899px) { .perfis { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 599px) { .pilares { grid-template-columns: minmax(0, 1fr); } }

    /* Equipe */
    .pessoas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
    .pessoa { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-4); align-items: center; }
    .pessoa img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--mel); }
    .pessoa__cargo { margin-top: var(--sp-1); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    .apoios { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-6); }
    .apoio { display: grid; grid-template-columns: auto auto; align-items: center; gap: var(--sp-4); }
    .apoio__logo { display: grid; place-items: center; width: 160px; height: 84px; border-radius: 6px; background: var(--branco); border: 1px solid var(--linha); }
    .apoio[data-fundo="escuro"] .apoio__logo { background: var(--grafite); border-color: var(--grafite); }
    .apoio__logo img { max-width: 124px; max-height: 52px; width: auto; }
    .apoio__nome { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }
    @media (max-width: 899px) { .pessoas { grid-template-columns: minmax(0, 1fr); } }

    /* Depoimento */
    .citacao { max-width: 820px; }
    .citacao .dr-quote { font-size: clamp(26px, 3.4vw, 42px); line-height: 1.28; color: var(--terra-escura); text-wrap: balance; }
    .citacao .dr-quote::before { content: "\201C"; display: block; font-size: 1.8em; line-height: .6; color: var(--mel-escuro); margin-bottom: var(--sp-3); }
    .citacao figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .citacao figcaption img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .citacao__nome { display: block; font-weight: 700; color: var(--ink); }
    .citacao__local { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }

    /* Contato */
    .contato { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--sp-7); align-items: start; }
    .contato .cabeca + * { margin-top: var(--sp-5); }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--terra-escura); }
    .campo input, .campo textarea { font: inherit; font-size: var(--fs-body); color: var(--ink); width: 100%; background: var(--creme); border: 0; border-bottom: 1.5px solid var(--linha-forte); border-radius: 4px 4px 0 0; padding: var(--sp-3); }
    .campo textarea { min-height: 120px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais { display: grid; gap: var(--sp-3); }
    .canais li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--sp-3); align-items: center; }
    .canais .dr-icone { width: 20px; height: 20px; color: var(--petroleo); }
    .canais a { font-weight: 600; overflow-wrap: anywhere; text-underline-offset: 4px; }
    .contato__acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); } }

    /* Rodapé */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1040px; margin: var(--sp-5) auto 0; padding-inline: clamp(16px, 4vw, 56px); color: var(--tenue); }
    @media (max-width: 767px) { .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); } }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N5 · índice em coluna fixa à esquerda com seções e progresso; no celular vira barra com índice recolhível) -->
  <nav data-secao="nav" class="indice" data-indice>
    <a class="indice__marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64"></a>
    <span class="indice__atual" data-atual aria-hidden="true"></span>
    <button class="indice__alternar" type="button" aria-expanded="false" aria-controls="indice-lista" data-alternar>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="dr-sr-only" data-c="marca.nome"></span>
    </button>
    <ol class="indice__lista" id="indice-lista" data-lista>
      <li><a href="#problema" data-c="problema.eyebrow"></a></li>
      <li><a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a></li>
      <li><a href="#como-funciona" data-c="comoFunciona.eyebrow"></a></li>
      <li><a href="#para-quem" data-c="paraQuem.eyebrow"></a></li>
      <li><a href="#tecnologia" data-c="tecnologia.eyebrow"></a></li>
      <li><a href="#equipe" data-c="equipe.eyebrow"></a></li>
      <li><a href="#contato" data-c="contato.eyebrow"></a></li>
    </ol>
    <div class="indice__pe">
      <span class="indice__total dr-data" data-total-texto aria-hidden="true"></span>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
  </nav>

  <main>

    <!-- SEÇÃO: hero (partículas douradas sobre creme que se organizam em favo) -->
    <section data-secao="hero" id="inicio" class="hero s-creme" data-hero>
      <canvas class="hero__canvas" data-canvas aria-hidden="true"></canvas>
      <div class="miolo hero__grade">
        <div class="hero__alvo" data-alvo>
          <!-- Favo pontilhado estático: é o que fica quando não há movimento -->
          <svg viewBox="-1 -1 2 2" aria-hidden="true"><path data-favo-estatico fill="none" stroke="var(--mel)" stroke-width=".022" stroke-linecap="round" stroke-dasharray="0 .045"/></svg>
        </div>
        <div class="hero__texto">
          <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
          <h1 class="dr-display hero__titulo" data-c="hero.titulo"></h1>
          <p class="dr-body-lg hero__sub" data-c="hero.subtitulo"></p>
          <div class="hero__acoes">
            <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
            <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
            <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: prova (fichas com o dado em destaque) -->
    <section data-secao="prova" class="secao s-papel" style="padding-block: var(--sp-7)">
      <div class="miolo">
        <ul class="placar" data-c-lista="prova.stats">
          <template>
            <li class="ficha">
              <span class="ficha__eyebrow" data-c="rotulo"></span>
              <span class="ficha__dado" data-c="valor"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: problema -->
    <section data-secao="problema" id="problema" class="secao s-sup">
      <div class="miolo problema">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="problema.eyebrow"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      /* ---------- Geometria do favo: sete células "de pé" (centro + seis) ---------- */
      function celulas(cx, cy, R) {
        var cs = [[cx, cy]], d = Math.sqrt(3) * R;
        for (var k = 0; k < 6; k++) {
          var a = k * Math.PI / 3;
          cs.push([cx + d * Math.cos(a), cy + d * Math.sin(a)]);
        }
        return cs;
      }
      function vertices(c, R) {
        var vs = [];
        for (var k = 0; k < 6; k++) {
          var a = -Math.PI / 2 + k * Math.PI / 3;
          vs.push([c[0] + R * Math.cos(a), c[1] + R * Math.sin(a)]);
        }
        return vs;
      }
      // Arestas sem repetição (as células vizinhas dividem paredes).
      function arestas(cx, cy, R) {
        var vistas = {}, lista = [];
        celulas(cx, cy, R).forEach(function (c) {
          var vs = vertices(c, R);
          for (var i = 0; i < 6; i++) {
            var a = vs[i], b = vs[(i + 1) % 6];
            var k1 = Math.round(a[0] * 10) + ',' + Math.round(a[1] * 10), k2 = Math.round(b[0] * 10) + ',' + Math.round(b[1] * 10);
            var chave = k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1;
            if (vistas[chave]) continue;
            vistas[chave] = 1;
            lista.push([a, b]);
          }
        });
        return lista;
      }

      // SVG estático (sem movimento): raio 1/(1+√3) cabe no quadrado -1..1.
      function desenharEstatico() {
        var p = document.querySelector('[data-favo-estatico]');
        if (!p) return;
        var R = 0.36, d = '';
        arestas(0, 0, R).forEach(function (s) { d += 'M' + s[0][0].toFixed(4) + ' ' + s[0][1].toFixed(4) + 'L' + s[1][0].toFixed(4) + ' ' + s[1][1].toFixed(4); });
        p.setAttribute('d', d);
      }

      /* ---------- Enxame em canvas ---------- */
      var CORES = ['#F5C02C', '#D9A521', '#FBE08C', '#F5C02C', '#D9A521', '#A1887F'];
      function enxame(hero, canvas, alvo) {
        var ctx = canvas.getContext('2d');
        var dpr = 1, W = 0, H = 0, parts = [], raf = 0, visivel = true, naTela = true;
        var mouse = { x: -9999, y: -9999 }, disperso = 0, t0 = performance.now();
        var centro = { x: 0, y: 0 }, R = 60, dispersaoRolagem = 0, texto = null;
        var blocoTexto = hero.querySelector('.hero__texto');

        function medir() {
          var hr = hero.getBoundingClientRect(), ar = alvo.getBoundingClientRect();
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = hr.width; H = hr.height;
          canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          centro.x = ar.left - hr.left + ar.width / 2;
          centro.y = ar.top - hr.top + ar.height / 2;
          R = ar.width * 0.18;
          var tr = blocoTexto.getBoundingClientRect();
          texto = { l: tr.left - hr.left - 16, t: tr.top - hr.top - 16, r: tr.right - hr.left + 16, b: tr.bottom - hr.top + 16 };
        }

        function montar() {
          medir();
          // Teto de partículas pela área visível (cerca de 1 a cada 1.900 px²).
          var N = Math.round(Math.min(900, Math.max(160, (W * H) / 1900)));
          var segs = arestas(centro.x, centro.y, R), alvos = [];
          var passo = Math.max(4.5, R / 11);
          segs.forEach(function (s) {
            var dx = s[1][0] - s[0][0], dy = s[1][1] - s[0][1], L = Math.hypot(dx, dy), n = Math.max(2, Math.round(L / passo));
            for (var i = 0; i < n; i++) alvos.push([s[0][0] + dx * i / n, s[0][1] + dy * i / n]);
          });
          var nAlvo = Math.min(alvos.length, Math.round(N * 0.82));
          // Distribui os alvos de modo uniforme pelas paredes.
          var escolhidos = [];
          for (var i = 0; i < nAlvo; i++) escolhidos.push(alvos[Math.floor(i * alvos.length / nAlvo)]);
          var antigas = parts;
          parts = [];
          for (var j = 0; j < N; j++) {
            var velha = antigas[j];
            var p = {
              x: velha ? velha.x : -40 - Math.random() * W * 0.3,
              y: velha ? velha.y : H * (0.5 + Math.random() * 0.6),
              vx: velha ? velha.vx : 2 + Math.random() * 3, vy: velha ? velha.vy : -1 - Math.random() * 2,
              r: 0.9 + Math.random() * 1.6,
              cor: CORES[j % CORES.length],
              fase: Math.random() * Math.PI * 2,
              tx: null, ty: null,
              orbita: 1.15 + Math.random() * 1.1
            };
            if (j < nAlvo) { p.tx = escolhidos[j][0]; p.ty = escolhidos[j][1]; p.r = 1.2 + Math.random() * 1.2; }
            parts.push(p);
          }
        }

        function quadro(agora) {
          raf = 0;
          var t = (agora - t0) / 1000;
          // Até ~0,9 s o enxame voa solto; depois as abelhas vão para as paredes.
          var forma = Math.min(1, Math.max(0, (t - 0.5) / 0.9));
          var solto = Math.max(disperso, dispersaoRolagem);
          disperso = Math.max(0, disperso - 0.012);
          ctx.clearRect(0, 0, W, H);
          var porCor = {};
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var zum = Math.sin(t * 9 + p.fase) * 0.35;
            if (p.tx !== null) {
              var mola = 0.06 * forma * (1 - solto);
              p.vx += (p.tx + Math.cos(t * 7 + p.fase) * 0.8 - p.x) * mola;
              p.vy += (p.ty + Math.sin(t * 8 + p.fase) * 0.8 - p.y) * mola;
              p.vx *= 0.82 + 0.1 * (1 - forma); p.vy *= 0.82 + 0.1 * (1 - forma);
            } else {
              // Abelhas livres orbitam o favo num voo em oito.
              var ang = t * 0.6 * (i % 2 ? 1 : -1) + p.fase;
              var ox = centro.x + Math.cos(ang) * R * 2.2 * p.orbita * 0.55;
              var oy = centro.y + Math.sin(ang * 2) * R * 1.6 * p.orbita * 0.55;
              p.vx += (ox - p.x) * 0.004; p.vy += (oy - p.y) * 0.004;
              p.vx *= 0.96; p.vy *= 0.96;
            }
            if (solto > 0) { p.vx += Math.cos(p.fase + t) * 0.35 * solto; p.vy += Math.sin(p.fase * 1.3 + t) * 0.35 * solto; }
            // O cursor espanta as abelhas próximas.
            var dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
            if (d2 < 8100) { var f = (1 - d2 / 8100) * 2.4, d = Math.sqrt(d2) || 1; p.vx += dx / d * f; p.vy += dy / d * f; }
            // Ninguém pousa sobre o texto: quem entra na caixa é empurrado para fora.
            if (texto && p.x > texto.l && p.x < texto.r && p.y > texto.t && p.y < texto.b && t > 1.2) {
              var sx = Math.min(p.x - texto.l, texto.r - p.x), sy = Math.min(p.y - texto.t, texto.b - p.y);
              if (sx < sy) p.vx += (p.x - texto.l < texto.r - p.x ? -1 : 1) * 0.9; else p.vy += (p.y - texto.t < texto.b - p.y ? -1 : 1) * 0.9;
            }
            p.x += p.vx + zum * 0.2; p.y += p.vy + zum * 0.2;
            (porCor[p.cor] = porCor[p.cor] || []).push(p);
          }
          for (var cor in porCor) {
            ctx.fillStyle = cor;
            ctx.beginPath();
            porCor[cor].forEach(function (q) { ctx.moveTo(q.x + q.r, q.y); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); });
            ctx.fill();
          }
          pedir();
        }
        function pedir() { if (!raf && visivel && naTela) raf = requestAnimationFrame(quadro); }
        function parar() { if (raf) cancelAnimationFrame(raf); raf = 0; }

        function aoMover(e) { var r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; }
        function aoSair() { mouse.x = mouse.y = -9999; }
        function aoTocar(e) { aoMover(e); disperso = 1; if (e.pointerType !== 'mouse') setTimeout(aoSair, 260); }
        function aoVisibilidade() { visivel = !document.hidden; if (visivel) pedir(); else parar(); }
        var largura = window.innerWidth, espera;
        function aoRedimensionar() {

        hero.addEventListener('pointerleave', aoSair);
        hero.addEventListener('pointerdown', aoTocar);
        document.addEventListener('visibilitychange', aoVisibilidade);
        window.addEventListener('resize', aoRedimensionar);
        io.observe(hero);

        return {
          rolar: function (p) { dispersaoRolagem = Math.max(0, (p - 0.25) / 0.75) * 0.9; },
          desligar: function () {
            parar(); io.disconnect();

            hero.removeEventListener('pointerleave', aoSair);
            hero.removeEventListener('pointerdown', aoTocar);
            document.removeEventListener('visibilitychange', aoVisibilidade);
            window.removeEventListener('resize', aoRedimensionar);
            hero.classList.remove('hero--vivo');

          }
        };
      }

      /* ---------- N5: índice com progresso por seção ---------- */
      function ligarIndice() {
        var nav = document.querySelector('[data-indice]');
        var links = Array.prototype.slice.call(nav.querySelectorAll('.indice__lista a'));
        var alvos = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
        var atual = nav.querySelector('[data-atual]');
        var total = nav.querySelector('[data-total-texto]');
        var lista = nav.querySelector('[data-lista]');
        var botao = nav.querySelector('[data-alternar]');
        var compacto = window.matchMedia('(max-width: 1099px)');
        function ajustarLista() {
          if (compacto.matches && botao.getAttribute('aria-expanded') !== 'true') lista.setAttribute('data-fechado', '');
          else lista.removeAttribute('data-fechado');
        }
        botao.addEventListener('click', function () {
          var aberto = botao.getAttribute('aria-expanded') === 'true';
          botao.setAttribute('aria-expanded', String(!aberto));
          ajustarLista();
        });
        lista.addEventListener('click', function (e) {
          if (e.target.closest('a') && compacto.matches) { botao.setAttribute('aria-expanded', 'false'); ajustarLista(); }
        });
        compacto.addEventListener('change', ajustarLista);
        ajustarLista();

        function medir() {
          pedido = false;
          var vh = window.innerHeight, ref = vh * 0.35, ativo = -1;
          alvos.forEach(function (s, i) {
            if (!s) return;
            var r = s.getBoundingClientRect();
            var p = Math.min(1, Math.max(0, (ref - r.top) / r.height));
            links[i].style.setProperty('--p', p.toFixed(3));
            if (r.top <= ref && r.bottom > ref) ativo = i;
          });
          links.forEach(function (a, i) { if (i === ativo) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });

          nav.style.setProperty('--total', pt.toFixed(3));
          total.textContent = String(Math.round(pt * 100)).padStart(2, '0') + ' / 100';
        }
        window.addEventListener('scroll', function () { if (!pedido) { pedido = true; requestAnimationFrame(medir); } }, { passive: true });
        window.addEventListener('resize', medir);
        medir();
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
            var num = el.querySelector('[data-num]');
            if (num) num.textContent = 'Nº ' + String(i + 1).padStart(2, '0');
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });
        desenharEstatico();
        ligarIndice();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          var hero = document.querySelector('[data-hero]');
          var bando = enxame(hero, hero.querySelector('[data-canvas]'), hero.querySelector('[data-alvo]'));
          // Rolando para fora do hero, o favo se desfaz em enxame; voltando, se refaz.
          ScrollTrigger.create({ trigger: hero, start: 'top top', end: 'bottom top', onUpdate: function (st) { bando.rolar(st.progress); } });

          gsap.from('.hero__texto > *', { y: 24, autoAlpha: 0, duration: 0.8, ease: 'power3.out', stagger: 0.09, delay: 0.15 });
          // Fichas caem na mesa uma a uma.
          gsap.utils.toArray('.placar, .fichas, .perfis, .pilares, .pessoas, .passos, .consequencias').forEach(function (lista) {
            gsap.from(lista.children, {
              y: 30, rotate: function (i) { return i % 2 ? 2.5 : -2.5; }, autoAlpha: 0, duration: 0.7, ease: 'power3.out', stagger: 0.07, clearProps: 'transform',
              scrollTrigger: { trigger: lista, start: 'top 86%', once: true }
            });
          });
          gsap.from('.ficha--grande', { y: 40, rotate: 3, autoAlpha: 0, duration: 0.9, ease: 'power3.out', clearProps: 'transform', scrollTrigger: { trigger: '.ficha--grande', start: 'top 85%', once: true } });
          return function () { bando.desligar(); };
        });
      });
    })();
  </script>
</body>
</html>
