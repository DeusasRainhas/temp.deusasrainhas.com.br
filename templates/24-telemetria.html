<!doctype html>
<html lang="pt-BR" data-template="24">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 24 Telemetria</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       24 Telemetria · dados · N7 / C1 / R3
       Gráfico de linha de produção como hero, de ponta a ponta da tela:
       uma cabeça de leitura percorre o eixo e desenha a curva. Cada
       gráfico da página (anel do 95%, linha dos passos, sinais dos
       sensores) se desenha ao entrar na tela.
       - gráficos decorativos (aria-hidden), sem números inventados;
       - nada de opacity < 1 fora do gsap.matchMedia; no movimento
         reduzido os gráficos já aparecem completos;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --nav-h: 68px; --respiro: 128px; }
    @media (max-width: 767px) { :root { --nav-h: 64px; --respiro: 72px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--petroleo); outline-offset: 2px;
    }
    body { padding-top: var(--nav-h); }
    main > section { padding-block: var(--respiro); scroll-margin-top: var(--nav-h); }
    /* R3: hairlines e muito espaço em branco */
    main > section + section { border-top: var(--bd); }

    .prov[data-provisorio]::after, .prov [data-provisorio]::after {
      content: "*"; font-size: .5em; vertical-align: super; margin-left: .06em; color: var(--terra-clara);
    }
    [data-aviso-provisorio]::before { content: "* "; }

    /* ---------- N7: barra de progresso no topo com rótulos de seção ---------- */
    .barra {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: var(--nav-h);
      background: rgba(255,251,230,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: var(--bd);
    }
    .barra__linha { display: flex; align-items: center; gap: var(--sp-5); height: 100%; }
    .marca { display: block; flex: none; margin-right: var(--sp-2); }
    .marca img { width: 56px; height: 56px; }
    .trilhos { flex: 1; display: flex; gap: 6px; min-width: 0; }
    .trilho { flex: 1 1 0; min-width: 0; text-decoration: none; padding-top: 6px; }
    .trilho__rotulo {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      color: var(--suave); transition: color .2s ease;
    }
    .trilho__barra { display: block; height: 3px; margin-top: 8px; background: var(--linha); border-radius: 2px; overflow: hidden; }
    .trilho__barra i { display: block; height: 100%; width: 100%; background: var(--petroleo); transform-origin: left center; transform: scaleX(0); }
    .trilho.ativo .trilho__rotulo { color: var(--petroleo); }
    .trilho:hover .trilho__rotulo { color: var(--terra-escura); }
    .barra .dr-btn { flex: none; padding: 9px 16px; font-size: var(--fs-small); }
    .barra__atual { display: none; }
    @media (max-width: 1099px) {
      /* rótulo some só visualmente (técnica .dr-sr-only): o link mantém o nome acessível */
      .trilho__rotulo {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      .trilho { padding-block: 11px 10px; } /* área de toque ≥ 24px */
      .trilho__barra { margin-top: 0; }
      .trilhos { flex-direction: row; align-self: flex-end; margin-bottom: 2px; }
      .barra__atual {
        display: block; position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
        font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--petroleo);
        white-space: nowrap;
      }
    }
    @media (max-width: 767px) {
      .marca img { width: 52px; height: 52px; }
      .barra .dr-btn { display: none; }
      .barra__atual { left: auto; right: 16px; transform: none; top: 16px; }
    }

    /* ---------- Hero: gráfico de linha ---------- */
    section[data-secao="hero"] { padding: var(--sp-8) 0 0; overflow: hidden; }
    .hero__grade { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: var(--sp-7); align-items: end; }
    .hero__titulo { font-size: clamp(42px, 6vw, 84px); line-height: .98; letter-spacing: -.028em; margin-top: var(--sp-4); text-wrap: balance; }
    .hero__sub { margin-top: var(--sp-5); font-size: var(--fs-body-lg); line-height: 1.6; color: var(--corpo); max-width: 44ch; }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }

    /* Legenda/leitura do gráfico: os quatro números de prova */
    .leituras { border-top: 2px solid var(--ink); }
    .leitura { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: baseline; padding-block: var(--sp-3); border-bottom: var(--bd); }
    /* marcador neutro: os números não são legenda das curvas decorativas */
    .leitura::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--linha-forte); justify-self: start; transform: translateY(-2px); }
    .leitura__rotulo { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); line-height: 1.5; }
    .leitura__valor { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 28px; line-height: 1; color: var(--ink); letter-spacing: -.02em; }
    @media (max-width: 899px) { .hero__grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    .grafico { position: relative; margin-top: var(--sp-7); height: clamp(220px, 34vw, 400px); }
    .grafico svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .grafico .grade line { stroke: var(--linha); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .grafico .tiques line { stroke: var(--linha-forte); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .grafico .area { fill: url(#g-area); }
    .grafico .curva { fill: none; stroke: var(--petroleo); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .grafico .anterior { fill: none; stroke: var(--terra-clara); stroke-width: 1.6; stroke-dasharray: 6 6; vector-effect: non-scaling-stroke; }
    .grafico .projecao { fill: none; stroke: var(--petroleo-claro); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .cabecote { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--petroleo); pointer-events: none; }
    .cabecote i {
      position: absolute; left: -8px; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%;
      background: var(--mel); border: 2.5px solid var(--terra-escura);
    }
    @media (prefers-reduced-motion: no-preference) {
      .cabecote.pulsa i::after {
        content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--mel);
        animation: pulso 1.8s ease-out infinite;
      }
      @keyframes pulso { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    }

    /* ---------- Cabeças de seção ---------- */
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-4); }
    .cabeca .dr-h2 { font-size: clamp(32px, 3.6vw, 46px); text-wrap: balance; max-width: 20ch; }
    .cabeca .intro { margin-top: var(--sp-4); max-width: 48ch; }
    .cabeca + * { margin-top: var(--sp-7); }
    .dupla { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
    .dupla > .cabeca + * { margin-top: 0; }
    @media (max-width: 899px) { .dupla { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* ---------- C1: itens separados por filetes horizontais ---------- */
    .filetes { counter-reset: item; }
    .filetes > li { counter-increment: item; border-top: var(--bd); padding-block: var(--sp-5); }
    .filetes > li:last-of-type { border-bottom: var(--bd); }
    .item { display: grid; grid-template-columns: 34px 24px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
    .item::before { content: counter(item, decimal-leading-zero); font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .1em; color: var(--suave); padding-top: 4px; }
    .item .dr-icone { color: var(--petroleo); }
    .item .dr-h4 { font-size: 19px; margin-bottom: var(--sp-1); }
    .item--sem-icone { grid-template-columns: 34px minmax(0, 1fr); }
    .filetes--duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--sp-8); }
    .filetes--duas > li:nth-last-of-type(2) { border-bottom: var(--bd); }
    @media (max-width: 767px) {
      .filetes--duas { grid-template-columns: minmax(0, 1fr); }
      .filetes--duas > li:nth-last-of-type(2) { border-bottom: 0; }
    }

    /* ---------- Problema: anel do 95% ---------- */
    .anel { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--sp-5); align-items: center; margin-top: var(--sp-6); }
    .anel__figura { position: relative; width: 180px; height: 180px; }
    .anel__figura svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .anel__fundo { fill: none; stroke: var(--superficie); stroke-width: 14; }
    .anel__arco { fill: none; stroke: var(--terra); stroke-width: 14; stroke-linecap: butt; }
    .anel__valor { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: 44px; letter-spacing: -.04em; color: var(--terra-escura); }
    @media (max-width: 599px) { .anel { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- Como funciona: linha dos passos ---------- */
    .percurso { position: relative; }
    .percurso svg { display: block; width: 100%; height: 120px; overflow: visible; }
    .percurso .degraus { fill: none; stroke: var(--petroleo); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .percurso .sombra { fill: var(--petroleo-veu); }
    .percurso .eixo { stroke: var(--linha-forte); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); margin-top: var(--sp-5); }
    .passo { border-top: var(--bd); padding-top: var(--sp-4); }
    .passo__numero { font-family: var(--mono); font-size: var(--fs-small); color: var(--petroleo); }
    .passo .dr-h4 { margin: var(--sp-2) 0; }
    .passo figure { margin-top: var(--sp-5); }
    .passo img { width: 100%; max-width: 230px; height: 320px; object-fit: cover; object-position: top; border: var(--bd); border-radius: var(--r-lg); box-shadow: var(--sh-sm); }
    .passo figcaption { margin-top: var(--sp-2); max-width: 230px; }
    @media (max-width: 899px) {
      .passos { grid-template-columns: minmax(0, 1fr); }
      .percurso svg { height: 80px; }
    }

    /* ---------- Para quem ---------- */
    .perfis .item .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; color: var(--terra-escura); }
    .perfis .item { grid-template-columns: 34px minmax(0, 4fr) minmax(0, 7fr); }
    @media (max-width: 767px) { .perfis .item { grid-template-columns: 34px minmax(0, 1fr); } .perfis .item p { grid-column: 2; } }

    /* ---------- Tecnologia: sinais dos sensores ---------- */
    .sinais { margin-top: var(--sp-6); border: var(--bd); border-radius: var(--r-md); background: var(--branco); padding: var(--sp-4); }
    .sinais svg { display: block; width: 100%; height: 140px; overflow: visible; }
    .sinais .grade line { stroke: var(--linha); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .sinais .s1 { fill: none; stroke: var(--petroleo); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .sinais .s2 { fill: none; stroke: var(--mel-escuro); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .sinais__legenda { display: flex; gap: var(--sp-4); margin-top: var(--sp-3); }
    .sinais__legenda span { display: inline-flex; align-items: center; gap: var(--sp-2); }
    .sinais__legenda .dr-icone { width: 18px; height: 18px; }

    /* ---------- Equipe ---------- */
    .pessoas .item { grid-template-columns: 34px 64px minmax(0, 1fr); align-items: center; }
    .pessoas img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: var(--bd); }
    .pessoa__cargo { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--terra); }
    .apoios { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-5) var(--sp-7); margin-top: var(--sp-7); padding-top: var(--sp-6); border-top: var(--bd); }
    .apoio { display: flex; align-items: center; gap: var(--sp-3); }
    .apoio__logo { display: grid; place-items: center; height: 72px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); }
    .apoio__logo img { max-height: 52px; width: auto; max-width: 160px; }
    .apoio[data-fundo="escuro"] .apoio__logo { background: var(--grafite); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--terra); }

    /* ---------- Depoimento ---------- */
    .citacao { max-width: 900px; }
    .citacao .dr-quote { font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; color: var(--terra-escura); text-wrap: balance; }
    .citacao blockquote { margin: 0; }
    .citacao figcaption { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-6); }
    .citacao figcaption img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: var(--bd); }
    .citacao__nome { font-weight: 700; color: var(--ink); }
    .citacao__local { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }

    /* ---------- Contato ---------- */
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink);
      background: var(--branco); border: var(--bd-forte); border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4); width: 100%;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais .item { grid-template-columns: 34px 24px minmax(0, 1fr); align-items: center; }
    .canais a { font-weight: 600; font-size: var(--fs-body-lg); text-underline-offset: 4px; overflow-wrap: anywhere; }
    .contato-col > * + * { margin-top: var(--sp-6); }

    /* ---------- Rodapé ---------- */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N7 · barra de progresso no topo com rótulos de seção) -->
  <nav data-secao="nav" class="barra">
    <div class="dr-container barra__linha">
      <a class="marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="56" height="56"></a>
      <div class="trilhos" data-trilhos>
        <a class="trilho" href="#problema"><span class="trilho__rotulo" data-c="problema.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#funcionalidades"><span class="trilho__rotulo" data-c="funcionalidades.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#como-funciona"><span class="trilho__rotulo" data-c="comoFunciona.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#para-quem"><span class="trilho__rotulo" data-c="paraQuem.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#tecnologia"><span class="trilho__rotulo" data-c="tecnologia.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#equipe"><span class="trilho__rotulo" data-c="equipe.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
        <a class="trilho" href="#contato"><span class="trilho__rotulo" data-c="contato.eyebrow"></span><span class="trilho__barra"><i></i></span></a>
      </div>
      <span class="barra__atual" aria-hidden="true" data-atual></span>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
  </nav>

  <main>

    <!-- SEÇÃO: hero (título + leitura dos números; o gráfico de linha ocupa a largura toda) -->
    <section data-secao="hero" id="inicio">
      <div class="dr-container hero__grade">
        <div>
          <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
          <h1 class="dr-display hero__titulo" data-c="hero.titulo"></h1>
          <p class="hero__sub" data-c="hero.subtitulo"></p>
          <div class="acoes">
            <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
            <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
            <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
          </div>
        </div>
        <!-- SEÇÃO: prova (fundida no hero: legenda de leitura do gráfico) -->
        <section data-secao="prova">
          <ul class="leituras" data-c-lista="prova.stats">
            <template>
              <li class="leitura">
                <span class="leitura__rotulo" data-c="rotulo"></span>
                <span class="leitura__valor prov" data-c="valor"></span>
              </li>
            </template>
          </ul>
        </section>
      </div>
      <div class="grafico" data-grafico-hero>
        <svg viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="g-area" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#2E8B82" stop-opacity=".26"/>
              <stop offset="1" stop-color="#2E8B82" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="c-hero"><rect data-revela x="0" y="-20" width="1200" height="440"/></clipPath>
          </defs>
          <g class="grade" data-grade></g>
          <g class="tiques" data-tiques></g>
          <g clip-path="url(#c-hero)">
            <path class="anterior" data-anterior d=""/>
            <path class="area" data-area d=""/>
            <path class="curva" data-curva d=""/>
          </g>
          <path class="projecao" data-projecao d=""/>
        </svg>
        <span class="cabecote" data-cabecote aria-hidden="true"><i></i></span>
      </div>
    </section>

    <!-- SEÇÃO: problema -->
    <section data-secao="problema" id="problema">
      <div class="dr-container dupla">
        <div>
          <header class="cabeca">
            <p class="dr-eyebrow" data-c="problema.eyebrow"></p>
            <h2 class="dr-h2" data-c="problema.titulo"></h2>
          </header>
          <div class="anel">
            <div class="anel__figura">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="anel__fundo" cx="60" cy="60" r="50"/>
                <circle class="anel__arco" data-anel cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="95 100"/>
              </svg>
              <span class="anel__valor" data-c="problema.estatistica.valor"></span>
            </div>
            <p class="dr-body-lg" data-c="problema.estatistica.texto"></p>
          </div>
        </div>
        <ul class="filetes" data-c-lista="problema.consequencias">
          <template>
            <li class="item">
              <svg class="dr-icone" aria-hidden="true" style="color: var(--erro)"><use href="#dr-alerta"></use></svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '#';
      var SVGNS = 'http://www.w3.org/2000/svg';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }
      function linha(g, x1, y1, x2, y2) {
        var l = document.createElementNS(SVGNS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        g.appendChild(l);
      }
      /* Curva suave (Catmull-Rom → Bézier) a partir de pontos. */
      function suave(p) {
        var d = 'M' + p[0][0] + ' ' + p[0][1];
        for (var i = 0; i < p.length - 1; i++) {
          var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
          d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) +
               ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) +
               ' ' + p2[0] + ' ' + p2[1];
        }
        return d;
      }
      /* Forma ilustrativa de produção ao longo de duas safras (sem valores). */
      function pontosProducao(n, W, H, fase, amp) {
        var p = [];
        for (var i = 0; i < n; i++) {
          var t = i / (n - 1);
          var safra = 0.5 + 0.5 * Math.sin(t * Math.PI * 4 - 1.6 + fase);
          var y = 0.86 - t * 0.38 - safra * amp - Math.sin(i * 1.7 + fase) * 0.025;
          p.push([+(t * W).toFixed(1), +(Math.min(0.96, Math.max(0.06, y)) * H).toFixed(1)]);
        }
        return p;
      }
      function yEm(p, x) {
        for (var i = 0; i < p.length - 1; i++) {
          if (x <= p[i + 1][0]) { var k = (x - p[i][0]) / (p[i + 1][0] - p[i][0] || 1); return p[i][1] + (p[i + 1][1] - p[i][1]) * k; }
        }
        return p[p.length - 1][1];
      }

      /* N7: progresso por seção e rótulo atual (não é movimento; roda sempre). */
      function ligarProgresso() {
        var trilhos = Array.prototype.slice.call(document.querySelectorAll('[data-trilhos] .trilho'));
        var secoes = trilhos.map(function (t) { return document.querySelector(t.getAttribute('href')); });
        var atual = document.querySelector('[data-atual]');
        var navH = function () { return document.querySelector('.barra').offsetHeight; };
        function medir() {
          var ativo = -1, topo = navH() + window.innerHeight * 0.25;
          secoes.forEach(function (s, i) {
            if (!s) return;
            var r = s.getBoundingClientRect();
            var p = Math.min(1, Math.max(0, (topo - r.top) / r.height));
            trilhos[i].querySelector('i').style.transform = 'scaleX(' + p.toFixed(3) + ')';
            if (r.top <= topo) ativo = i;
          });
          trilhos.forEach(function (t, i) { t.classList.toggle('ativo', i === ativo); });
          if (atual) atual.textContent = ativo >= 0 ? trilhos[ativo].querySelector('.trilho__rotulo').textContent : '';
        }
        window.addEventListener('scroll', medir, { passive: true });
        window.addEventListener('resize', medir);
        medir();
      }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) { if (email) a.setAttribute('href', 'mailto:' + email.v); });
        document.querySelectorAll('[data-ano]').forEach(function (el) { el.textContent = '© ' + new Date().getFullYear(); });

        // Gráfico do hero: grade, tiques, curva atual e a da safra anterior.
        var W = 1200, H = 400;
        var g = document.querySelector('[data-grade]');
        for (var k = 1; k <= 4; k++) linha(g, 0, k * H / 5, W, k * H / 5);
        var tq = document.querySelector('[data-tiques]');
        for (var m = 0; m <= 24; m++) linha(tq, m * W / 24, H - (m % 6 === 0 ? 14 : 7), m * W / 24, H);
        var FIM = W * 0.9; // a curva para em 90%; o resto é projeção pontilhada
        var pts = pontosProducao(25, FIM, H, 0, 0.26);
        var ant = pontosProducao(25, FIM, H, 0.5, 0.16).map(function (p) { return [p[0], Math.min(H - 6, p[1] + 46)]; });
        var dCurva = suave(pts);
        document.querySelector('[data-curva]').setAttribute('d', dCurva);
        document.querySelector('[data-area]').setAttribute('d', dCurva + ' L' + FIM + ' ' + H + ' L0 ' + H + ' Z');
        var ult = pts[pts.length - 1];
        document.querySelector('[data-projecao]').setAttribute('d', 'M' + ult[0] + ' ' + ult[1] + ' C ' + (ult[0] + 40) + ' ' + (ult[1] - 10) + ', ' + (W - 40) + ' ' + (ult[1] - 30) + ', ' + W + ' ' + (ult[1] - 34));
        document.querySelector('[data-anterior]').setAttribute('d', suave(ant));
        var grafico = document.querySelector('[data-grafico-hero]');
        var cabecote = document.querySelector('[data-cabecote]');
        function porCabecote(x) {
          cabecote.style.left = (x / W * 100) + '%';
          cabecote.querySelector('i').style.top = (yEm(pts, x) / H * 100) + '%';
        }
        porCabecote(FIM - 0.01);
        cabecote.classList.add('pulsa');

        // Sinais dos sensores (tecnologia).
        var gs = document.querySelector('[data-grade-sinais]');
        for (var j = 1; j <= 3; j++) linha(gs, 0, j * 35, 600, j * 35);
        var s1 = [], s2 = [];
        for (var i = 0; i <= 40; i++) {
          var x = i * 15;
          s1.push([x, +(70 - Math.sin(i * 0.32) * 26 - Math.sin(i * 1.1) * 6).toFixed(1)]);
          s2.push([x, +(92 + Math.cos(i * 0.28 + 1) * 18 - Math.sin(i * 0.9) * 5).toFixed(1)]);
        }
        document.querySelector('[data-s1]').setAttribute('d', suave(s1));
        document.querySelector('[data-s2]').setAttribute('d', suave(s2));
        ligarProgresso();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // Hero: a cabeça de leitura percorre o eixo e a curva aparece atrás dela (~1,3 s).
          var revela = grafico.querySelector('[data-revela]');
          var estado = { x: 0 };
          cabecote.classList.remove('pulsa');
          gsap.set(revela, { attr: { width: 0 } });
          gsap.from('[data-projecao]', { autoAlpha: 0, duration: 0.4, delay: 1.35 });
          gsap.to(estado, {
            x: FIM, duration: 1.2, ease: 'power2.inOut', delay: 0.15,
            onUpdate: function () { revela.setAttribute('width', estado.x); porCabecote(Math.max(0.01, Math.min(FIM - 0.01, estado.x))); },
            onComplete: function () { cabecote.classList.add('pulsa'); }
          });
          gsap.from('.grafico .grade line', { scaleX: 0, transformOrigin: '0 50%', duration: 0.8, ease: 'power2.out', stagger: 0.06 });

          // Gráficos das seções se desenham ao entrar na tela.
          [['[data-percurso]', 1200, 1.4], ['[data-sinais]', 600, 1.6]].forEach(function (c) {
            var bloco = document.querySelector(c[0]);
            var rect = bloco.querySelector('[data-revela]');
            gsap.fromTo(rect, { attr: { width: 0 } }, {
              attr: { width: c[1] }, duration: c[2], ease: 'power2.inOut',
              scrollTrigger: { trigger: bloco, start: 'top 80%', once: true }
            });
          });
          gsap.fromTo('[data-anel]', { strokeDashoffset: 95 }, {
            strokeDashoffset: 0, duration: 1.4, ease: 'power2.out',
            scrollTrigger: { trigger: '.anel', start: 'top 80%', once: true }
          });

          // C1: filetes entram linha a linha.
          gsap.utils.toArray('.filetes, .passos, .leituras').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, y: 12, duration: 0.5, ease: 'power2.out', stagger: 0.07,
              scrollTrigger: lista.classList.contains('leituras') ? null : { trigger: lista, start: 'top 85%', once: true },
              delay: lista.classList.contains('leituras') ? 0.4 : 0
            });
          });

          return function () { revela.setAttribute('width', W); porCabecote(FIM - 0.01); cabecote.classList.add('pulsa'); };
        });
      });
    })();
  </script>
