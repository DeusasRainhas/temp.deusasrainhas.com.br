<!doctype html>
<html lang="pt-BR" data-template="29">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 29 Bolso</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       29 Bolso · app · N8 / C2 / R4
       O site inteiro é um app: coluna estreita centrada mesmo no desktop,
       botões grandes na zona do polegar, navegação em bottom sheet que se
       arrasta (ou abre com um toque) e coroa no canto que abre em leque.
       Números de seção gigantes em mono marcam o ritmo (na margem escura
       no desktop, no topo de cada seção no celular).
       - nada de opacity < 1 fora do gsap.matchMedia (fechado = escala/clip);
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --col: 440px; --peek: 104px; --app-fundo: #FFF8E6; }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }

    body {
      background: radial-gradient(ellipse 50% 70% at 50% 40%, rgba(32,32,32,.35), rgba(32,32,32,.92)), url(../img/padroes/favo-escuro.svg), var(--grafite);
      background-attachment: fixed;
    }
    .app {
      position: relative; width: min(100%, var(--col)); margin-inline: auto; min-height: 100vh;
      background: var(--creme); counter-reset: secao;
      padding-bottom: calc(var(--peek) + 24px);
    }
    @media (min-width: 600px) {
      .app { margin-block: 24px 0; border-radius: 40px 40px 0 0; box-shadow: 0 0 0 10px #151515, 0 0 0 11px #3a3a3a, 0 40px 120px rgba(0,0,0,.5); }
    }
    main > section { position: relative; padding: var(--sp-7) 20px; scroll-margin-top: 80px; }

    /* ---------- R4: número de seção gigante em mono ---------- */
    main > section:not([data-secao="hero"]) { counter-increment: secao; }
    .marco { display: block; height: 0; position: relative; }
    .marco::before {
      content: counter(secao, decimal-leading-zero); position: absolute; right: 0; top: -12px;
      font-family: var(--mono); font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -.06em;
      color: transparent; -webkit-text-stroke: 1.5px var(--linha-forte);
    }
    @media (min-width: 1000px) {
      /* Trilho absoluto do tamanho da seção; o número (pseudo sticky) solta antes da próxima. */
      .marco { position: absolute; inset: var(--sp-7) 0 var(--sp-7) 0; height: auto; z-index: 0; pointer-events: none; }
      .marco::before {
        position: sticky; top: 96px; display: block; width: max-content; right: auto;
        margin-left: calc(-1 * (50vw - var(--col) / 2) + 6vw); padding-bottom: 20px;
        font-size: clamp(120px, 12vw, 210px); color: var(--mel); -webkit-text-stroke: 0;
        background: linear-gradient(var(--mel-escuro), var(--mel-escuro)) left bottom / 64px 3px no-repeat;
      }
    }

    /* ---------- Barra do app + N8: coroa no canto que abre em leque ---------- */
    nav[data-secao="nav"] { position: sticky; top: 0; z-index: 40; }
    .barra { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 14px; background: var(--creme); border-bottom: var(--bd); }
    @media (min-width: 600px) { .barra { border-radius: 40px 40px 0 0; padding-top: 14px; } }
    .barra__marca img { width: 64px; height: 64px; }
    .leque { position: relative; width: 60px; height: 60px; }
    .leque__botao {
      position: relative; z-index: 3; width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--mel); box-shadow: var(--sh-mel); display: grid; place-items: center; transition: transform .35s cubic-bezier(.3,1.4,.5,1);
    }
    .leque__botao img { width: 30px; height: auto; }
    .leque.aberto .leque__botao { transform: rotate(-12deg) scale(.94); background: var(--mel-escuro); }
    .leque__itens li {
      position: absolute; z-index: 2; left: 6px; top: 6px; width: 48px; height: 48px;
      transform: scale(.2); pointer-events: none; transition: transform .4s cubic-bezier(.3,1.3,.5,1);
    }
    .leque__itens li:nth-child(1) { transition-delay: 0s; }
    .leque__itens li:nth-child(2) { transition-delay: .03s; }
    .leque__itens li:nth-child(3) { transition-delay: .06s; }
    .leque__itens li:nth-child(4) { transition-delay: .09s; }
    .leque.aberto .leque__itens li { pointer-events: auto; }
    /* Leque em arco: cada item desce 62px e abre um pouco mais para a esquerda */
    .leque.aberto .leque__itens li:nth-child(1) { transform: translate(-4px, 70px); }
    .leque.aberto .leque__itens li:nth-child(2) { transform: translate(-22px, 132px); }
    .leque.aberto .leque__itens li:nth-child(3) { transform: translate(-52px, 194px); }
    .leque.aberto .leque__itens li:nth-child(4) { transform: translate(-96px, 256px); }
    .leque__itens a { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--grafite); color: var(--mel); box-shadow: var(--sh-md); }
    .leque__itens .dr-icone { width: 22px; height: 22px; }
    .leque__rotulo {
      position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap;
      padding: 4px 10px; border-radius: var(--r-pill); background: var(--branco); box-shadow: var(--sh-sm);
      font-size: 12px; font-weight: 700; color: var(--ink); clip-path: inset(0 0 0 100% round 999px); transition: clip-path .3s ease .15s;
    }
    .leque.aberto .leque__rotulo { clip-path: inset(0 0 0 0 round 999px); }
    .leque__veu { position: fixed; inset: 0; z-index: 1; display: none; }
    .leque.aberto .leque__veu { display: block; }

    /* ---------- Botões da zona do polegar ---------- */
    .polegar { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); width: 100%; min-height: 64px; border-radius: 20px; font-size: 18px; }
    .polegar + .polegar { margin-top: var(--sp-3); }
    .polegar svg { width: 22px; height: 22px; }

    /* ---------- Hero: layout mobile exagerado ---------- */
    [data-secao="hero"] { padding-top: var(--sp-6); }
    .status { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 6px 12px 6px 10px; border-radius: var(--r-pill); background: var(--sucesso-veu); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sucesso); box-shadow: 0 0 0 3px rgba(62,142,90,.2); }
    .status .dr-eyebrow { color: var(--sucesso); font-size: 11px; letter-spacing: .14em; }
    .hero__titulo { margin-top: var(--sp-5); font-size: 50px; line-height: .98; letter-spacing: -.03em; }
    .hero__sub { margin-block: var(--sp-4) var(--sp-6); }
    .previa { position: relative; margin-top: var(--sp-6); height: 300px; overflow: hidden; border-radius: 28px; background: var(--mel-veu); }
    .previa img { position: absolute; left: 50%; top: 28px; width: 62%; transform: translateX(-50%) rotate(-4deg); border-radius: 22px; border: 6px solid var(--grafite); box-shadow: var(--sh-lg); }
    .previa::after { content: ""; position: absolute; inset: auto 0 0; height: 70px; background: linear-gradient(transparent, var(--mel-veu)); }
    .gesto { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); margin-top: var(--sp-4); color: var(--terra-clara); }
    .gesto svg { width: 22px; height: 22px; }

    /* ---------- Cabeça ---------- */
    .cabeca { position: relative; z-index: 1; margin-bottom: var(--sp-5); padding-top: 64px; }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-2); }
    .cabeca .dr-h2 { font-size: 32px; text-wrap: balance; }
    .cabeca .dr-body { margin-top: var(--sp-3); }
    @media (min-width: 1000px) { .cabeca { padding-top: 0; } }

    /* ---------- C2: tiles sólidos em creme-papel com número grande em mono ---------- */
    .tile { position: relative; background: var(--creme-papel); border-radius: 22px; padding: var(--sp-5); overflow: hidden; }
    .tile__num { display: block; font-family: var(--mono); font-weight: 500; font-size: 44px; line-height: 1; letter-spacing: -.04em; color: var(--terra-escura); font-variant-numeric: tabular-nums; }
    .tile .dr-h4 { font-size: 19px; margin-top: var(--sp-3); }
    .tile .dr-body { margin-top: var(--sp-2); font-size: 15px; }
    .tile .dr-icone { color: var(--terra); }
    .tiles { display: grid; gap: 10px; }
    .tiles--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles--icone .tile { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: var(--sp-4); }
    .tiles--icone .tile .dr-icone { grid-row: span 2; }
    .tiles--icone .tile .dr-h4 { margin-top: 2px; }

    /* Prova */
    .prova .tile__num { font-size: 40px; }
    .prova .tile p { margin-top: var(--sp-2); font-size: 14px; color: var(--corpo); line-height: 1.4; }
    .prova .tile:first-of-type { background: var(--mel); }
    .prova .tile:first-of-type p { color: var(--terra-escura); }

    /* Problema */
    .tile--grande { background: var(--grafite); color: var(--creme); }
    .tile--grande .tile__num { font-size: 104px; color: var(--mel); }
    .tile--grande p { color: var(--creme); margin-top: var(--sp-3); font-size: 17px; line-height: 1.5; }
    .linhas { margin-top: 10px; display: grid; gap: 10px; }
    .linhas li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
    .linhas .dr-icone { color: var(--erro); }

    /* Funcionalidades: carrossel arrastável */
    .carrossel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 4px 20px 12px; scrollbar-width: none; cursor: grab; }
    .carrossel::-webkit-scrollbar { display: none; }
    .carrossel.arrastando { cursor: grabbing; scroll-snap-type: none; }
    .carrossel > li { flex: 0 0 78%; scroll-snap-align: start; }
    .carrossel .tile { height: 100%; display: flex; flex-direction: column; }
    .carrossel .tile__topo { display: flex; justify-content: space-between; align-items: center; }
    .carrossel .tile__num { color: var(--linha-forte); font-size: 56px; }
    .pontinhos { display: flex; justify-content: center; gap: 6px; margin-top: var(--sp-2); }
    .pontinhos i { width: 6px; height: 6px; border-radius: 6px; background: var(--linha-forte); transition: width .25s ease, background-color .25s ease; }
    .pontinhos i.on { width: 22px; background: var(--terra-escura); }

    /* Como funciona */
    .passo { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: var(--sp-4); align-items: center; }
    .passo__tela { width: 104px; height: 140px; overflow: hidden; border-radius: 16px; border: 4px solid var(--grafite); background: var(--app-fundo); }
    .passo__tela img { width: 100%; height: auto; }

    /* Para quem: alternador segmentado */
    .segmentos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: var(--superficie); }
    .segmentos button { min-height: 52px; border: 0; border-radius: 14px; background: transparent; font: inherit; font-weight: 700; font-size: 14px; color: var(--terra); cursor: pointer; padding: 6px; line-height: 1.2; }
    .segmentos button[aria-selected="true"] { background: var(--branco); color: var(--terra-escura); box-shadow: var(--sh-sm); }
    .perfis { margin-top: 10px; display: grid; gap: 10px; }
    .js-perfis .perfis > li[data-gerado]:not(.atual) { display: none; }
    .perfis .dr-h3 { font-family: var(--serif); font-weight: 500; color: var(--terra-escura); font-size: 24px; }

    /* Equipe */
    .pessoas { display: grid; gap: 10px; }
    .pessoa { display: flex; align-items: center; gap: var(--sp-4); }
    .pessoa img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; }
    .pessoa .dr-h4 { margin: 0; font-size: 17px; }
    .pessoa__cargo { font-size: 14px; color: var(--suave); line-height: 1.4; }
    .origem { margin-bottom: var(--sp-4); }
    .apoios { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px; border-radius: 22px; background: var(--grafite); }
    .apoio { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
    .apoio__logo { display: grid; place-items: center; width: 100%; height: 64px; padding: 6px; border-radius: 12px; }
    .apoio__logo img { max-height: 48px; width: auto; max-width: 100%; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mel-claro); }

    /* Depoimento: bolha de mensagem */
    .conversa { display: grid; gap: var(--sp-3); }
    .bolha { position: relative; max-width: 92%; padding: var(--sp-4) var(--sp-5); border-radius: 22px 22px 22px 6px; background: var(--branco); box-shadow: var(--sh-sm); }
    .bolha .dr-quote { font-size: 21px; color: var(--terra-escura); line-height: 1.4; }
    .remetente { display: flex; align-items: center; gap: var(--sp-3); }
    .remetente img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .remetente b { display: block; color: var(--ink); font-size: 15px; }
    .remetente span span { font-size: 13px; color: var(--suave); }

    /* Contato */
    .form { display: grid; gap: var(--sp-3); }
    .campo { display: grid; gap: 6px; }
    .campo label { font-weight: 700; font-size: 14px; color: var(--ink); padding-left: 4px; }
    .campo input, .campo textarea { font: inherit; font-size: 17px; color: var(--ink); background: var(--branco); border: var(--bd-forte); border-radius: 18px; padding: 16px 18px; width: 100%; min-height: 60px; }
    .campo textarea { min-height: 120px; resize: vertical; }
    .canais { display: grid; gap: 10px; margin-top: var(--sp-5); }
    .canal { display: flex; align-items: center; gap: var(--sp-3); min-height: 64px; padding: 0 18px; border-radius: 20px; background: var(--creme-papel); text-decoration: none; font-weight: 700; color: var(--terra-escura); overflow-wrap: anywhere; }
    .canal svg { color: var(--petroleo); flex: none; }

    /* Rodapé */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding: var(--sp-6) 20px var(--sp-6); border-radius: 28px 28px 0 0; margin-top: var(--sp-5); }
    .rodape img { width: 64px; height: 64px; margin-bottom: var(--sp-3); }
    .rodape p { font-size: 13.5px; line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    .rodape > div + div { margin-top: var(--sp-3); }
    footer > [data-aviso-provisorio] { margin-top: var(--sp-4); color: var(--tenue); }

    /* ---------- Efeito: bottom sheet arrastável ---------- */
    .sheet {
      position: fixed; z-index: 55; bottom: 0; left: 50%; width: min(100%, var(--col)); margin-left: calc(min(100%, var(--col)) / -2);
      background: var(--branco); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(32,32,32,.22);
      padding: 0 16px 20px; touch-action: none; will-change: transform;
    }
    .sheet__alca { display: block; width: 100%; height: 30px; border: 0; background: transparent; cursor: grab; position: relative; }
    .sheet__alca::before { content: ""; position: absolute; left: 50%; top: 10px; width: 44px; height: 5px; margin-left: -22px; border-radius: 5px; background: var(--linha-forte); }
    .sheet__peek { display: flex; gap: 10px; align-items: center; }
    .sheet__peek .polegar { flex: 1; min-height: 58px; }
    .sheet__menu { flex: none; width: 58px; height: 58px; border-radius: 18px; border: var(--bd-forte); background: var(--creme); display: grid; place-items: center; cursor: pointer; color: var(--terra-escura); }
    .sheet__menu svg { width: 24px; height: 24px; transition: transform .3s ease; }
    .sheet.aberta .sheet__menu svg { transform: rotate(180deg); }
    @media (max-width: 599px) { .sheet__peek { padding-right: 118px; } }
    .sheet__lista { margin-top: var(--sp-5); display: grid; gap: 6px; }
    .sheet__lista a {
      display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: var(--sp-3);
      min-height: 60px; padding: 0 12px; border-radius: 18px; background: var(--creme-papel); color: var(--terra-escura); text-decoration: none; font-weight: 700; font-size: 17px;
    }
    .sheet__lista a:active { background: var(--mel-veu); }
    .sheet__lista .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--branco); color: var(--terra); }
    .sheet__lista .chev { width: 20px; height: 20px; color: var(--terra-clara); }
    .sheet__rodape { margin-top: var(--sp-4); }
    @media (max-width: 599px) { .sheet__rodape { padding-bottom: 118px; } } /* livra a pílula do switcher */
  </style>
</head>
<body>
  <div class="app">

    <!-- SEÇÃO: nav (N8 · coroa no canto que abre em leque; o bottom sheet também mora aqui) -->
    <nav data-secao="nav" aria-label="Navegação">
      <div class="barra">
        <a class="barra__marca" href="#inicio"><img src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64"></a>
        <div class="leque" data-leque>
          <span class="leque__veu" data-leque-veu></span>
          <ul class="leque__itens">
            <li><a href="#funcionalidades" tabindex="-1"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-colmeia"></use></svg><span class="leque__rotulo" data-c="funcionalidades.eyebrow"></span></a></li>
            <li><a href="#como-funciona" tabindex="-1"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-revisao"></use></svg><span class="leque__rotulo" data-c="comoFunciona.eyebrow"></span></a></li>
            <li><a href="#equipe" tabindex="-1"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-abelha"></use></svg><span class="leque__rotulo" data-c="equipe.eyebrow"></span></a></li>
            <li><a href="#contato" tabindex="-1"><svg class="dr-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span class="leque__rotulo" data-c="contato.eyebrow"></span></a></li>
          </ul>
          <button class="leque__botao" type="button" aria-expanded="false" aria-label="Atalhos" data-leque-botao><img src="../img/logos/coroa-terra.png" alt="" width="30" height="22"></button>
        </div>
      </div>

      <!-- Bottom sheet: arraste a alça para cima/baixo ou toque para abrir -->
      <div class="sheet" data-sheet>
        <button class="sheet__alca" type="button" aria-expanded="false" aria-label="Abrir navegação" data-sheet-alca></button>
        <div class="sheet__peek">
          <a class="dr-btn dr-btn--primario polegar" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
          <button class="sheet__menu" type="button" aria-expanded="false" aria-label="Abrir navegação" data-sheet-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
        </div>
        <ul class="sheet__lista" inert>
          <li><a href="#funcionalidades"><span class="ic"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-colmeia"></use></svg></span><span data-c="funcionalidades.eyebrow"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></li>
          <li><a href="#como-funciona"><span class="ic"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-revisao"></use></svg></span><span data-c="comoFunciona.eyebrow"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></li>
          <li><a href="#para-quem"><span class="ic"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-florada"></use></svg></span><span data-c="paraQuem.eyebrow"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></li>

  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }
      var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)');

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Fiação (sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
            var num = el.querySelector('[data-num]');
            if (num) num.textContent = String(i + 1).padStart(2, '0');
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) { if (email) a.setAttribute('href', 'mailto:' + email.v); });
        document.querySelectorAll('[data-ano]').forEach(function (el) { el.textContent = '© ' + new Date().getFullYear(); });

        /* ---- N8: coroa abre o leque ---- */
        var leque = document.querySelector('[data-leque]');
        var lequeBotao = document.querySelector('[data-leque-botao]');
        var lequeLinks = leque.querySelectorAll('.leque__itens a');
        function lequeAbrir(abrir) {
          leque.classList.toggle('aberto', abrir);
          lequeBotao.setAttribute('aria-expanded', String(abrir));
          lequeLinks.forEach(function (a) { a.setAttribute('tabindex', abrir ? '0' : '-1'); });
        }
        lequeBotao.addEventListener('click', function () { lequeAbrir(!leque.classList.contains('aberto')); });
        document.querySelector('[data-leque-veu]').addEventListener('click', function () { lequeAbrir(false); });
        lequeLinks.forEach(function (a) { a.addEventListener('click', function () { lequeAbrir(false); }); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lequeAbrir(false); if (aberta) sheetIr(false, true); } });

        /* ---- Efeito: bottom sheet com arrasto e toque ---- */
        var sheet = document.querySelector('[data-sheet]');
        var alca = document.querySelector('[data-sheet-alca]');
        var toggle = document.querySelector('[data-sheet-toggle]');
        var fechadoY = 0, y = 0, aberta = false;
        function medir() {
          var peek = sheet.querySelector('.sheet__peek');
          fechadoY = Math.max(0, sheet.offsetHeight - (peek.offsetTop + peek.offsetHeight + 16));
          por(aberta ? 0 : fechadoY, true);
        }
        function por(alvo, instantaneo) {
          y = alvo;
          if (window.gsap && !instantaneo && !reduzido.matches) {
            gsap.to(sheet, { y: alvo, duration: 0.45, ease: 'power3.out', overwrite: true });
          } else if (window.gsap) {
            gsap.set(sheet, { y: alvo });
          } else {
            sheet.style.transform = 'translateY(' + alvo + 'px)';
          }
        }
        var fechaveis = sheet.querySelectorAll('.sheet__lista, .sheet__rodape');
        // focar: ao abrir, leva o foco ao primeiro link; ao fechar, devolve ao botão de seta.
        function sheetIr(abrir, focar) {
          aberta = abrir;
          sheet.classList.toggle('aberta', abrir);
          var nome = abrir ? 'Fechar navegação' : 'Abrir navegação';
          [alca, toggle].forEach(function (b) {
            b.setAttribute('aria-expanded', String(abrir));
            b.setAttribute('aria-label', nome);
          });
          fechaveis.forEach(function (el) { el.inert = !abrir; });
          por(abrir ? 0 : fechadoY);
          if (focar) {
            if (abrir) { var l = sheet.querySelector('.sheet__lista a'); if (l) l.focus({ preventScroll: true }); }
            else toggle.focus({ preventScroll: true });
          }
        }
        toggle.addEventListener('click', function () { sheetIr(!aberta, true); });
        sheet.querySelectorAll('.sheet__lista a').forEach(function (a) { a.addEventListener('click', function () { sheetIr(false); }); });

        // Arrastar pela alça ou pelo topo do sheet (pointer events: dedo e mouse).
        var arrasto = null;
        function inicio(e) {
          if (e.target.closest('a, .sheet__menu')) return;
          // A captura redireciona o pointerup para .sheet: guarda aqui se o toque começou na alça.
          arrasto = { y0: e.clientY, base: y, t: performance.now(), ult: e.clientY, moveu: false, naAlca: !!e.target.closest('.sheet__alca') };
          sheet.setPointerCapture(e.pointerId);
          if (window.gsap) gsap.killTweensOf(sheet);
        }
        function mover(e) {
          if (!arrasto) return;
          var dy = e.clientY - arrasto.y0;
          if (Math.abs(dy) > 4) arrasto.moveu = true;
          var alvo = arrasto.base + dy;
          if (alvo < 0) alvo = alvo / 3; // resistência elástica acima do topo
          if (alvo > fechadoY) alvo = fechadoY + (alvo - fechadoY) / 3;
          arrasto.vel = (e.clientY - arrasto.ult) / Math.max(1, performance.now() - arrasto.t);
          arrasto.ult = e.clientY; arrasto.t = performance.now();
          por(alvo, true);
        }
        function fim(e) {
          if (!arrasto) return;
          var a = arrasto; arrasto = null;
          try { sheet.releasePointerCapture(e.pointerId); } catch (err) { /* já liberado */ }
          if (!a.moveu) { if (a.naAlca) sheetIr(!aberta, true); return; }
          var vel = a.vel || 0;
          if (vel < -0.4) sheetIr(true);
          else if (vel > 0.4) sheetIr(false);
          else sheetIr(y < fechadoY / 2);
        }
        sheet.addEventListener('pointerdown', inicio);
        sheet.addEventListener('pointermove', mover);
        sheet.addEventListener('pointerup', fim);
        sheet.addEventListener('pointercancel', fim);
        alca.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sheetIr(!aberta, true); } });
        window.addEventListener('resize', medir);
        medir();
        if (document.fonts) document.fonts.ready.then(medir);

        /* ---- Carrossel: arrastar com o mouse + pontinhos ---- */
        var car = document.querySelector('[data-carrossel]');
        var cards = car.querySelectorAll(':scope > [data-gerado]');
        var pts = document.querySelector('[data-pontinhos]');
        cards.forEach(function (_, i) { var b = document.createElement('i'); if (!i) b.className = 'on'; pts.appendChild(b); });
        car.addEventListener('scroll', function () {
          var i = Math.round(car.scrollLeft / (cards[0] ? cards[0].offsetWidth + 12 : 1));
          pts.querySelectorAll('i').forEach(function (b, k) { b.classList.toggle('on', k === i); });
        }, { passive: true });
        var drag = null;
        car.addEventListener('pointerdown', function (e) {
          if (e.pointerType !== 'mouse') return;
          drag = { x: e.clientX, s: car.scrollLeft }; car.classList.add('arrastando');
        });
        window.addEventListener('pointermove', function (e) { if (drag) car.scrollLeft = drag.s - (e.clientX - drag.x); });
        window.addEventListener('pointerup', function () {
          if (!drag) return; drag = null; car.classList.remove('arrastando');
          var w = cards[0] ? cards[0].offsetWidth + 12 : 1;
          car.scrollTo({ left: Math.round(car.scrollLeft / w) * w, behavior: reduzido.matches ? 'auto' : 'smooth' });
        });

        /* ---- Para quem: alternador segmentado (sem JS, os três ficam visíveis) ---- */
        var seg = document.querySelector('[data-segmentos]');
        var perfis = Array.prototype.slice.call(document.querySelectorAll('.perfis > [data-gerado]'));
        if (perfis.length) {
          seg.hidden = false;
          document.querySelector('[data-secao="para-quem"]').classList.add('js-perfis');
          perfis[0].parentElement.setAttribute('role', 'none');
          var abas = [];
          function selecionar(i, focar) {
            abas.forEach(function (x, k) {
              x.setAttribute('aria-selected', String(k === i));
              x.tabIndex = k === i ? 0 : -1;
            });
            perfis.forEach(function (x, k) { x.classList.toggle('atual', k === i); });
            if (focar) abas[i].focus();
            if (window.gsap && !reduzido.matches) gsap.from(perfis[i], { y: 12, autoAlpha: 0, duration: 0.35, ease: 'power2.out' });
          }
          perfis.forEach(function (p, i) {
            var b = document.createElement('button');
            b.type = 'button'; b.setAttribute('role', 'tab');
            b.id = 'aba-perfil-' + i;
            p.id = 'painel-perfil-' + i;
            b.setAttribute('aria-controls', p.id);
            p.setAttribute('role', 'tabpanel');
            p.setAttribute('aria-labelledby', b.id);
            b.textContent = p.querySelector('h3').textContent;
            b.addEventListener('click', function () { selecionar(i, false); });
            seg.appendChild(b);
            abas.push(b);
          });
          // Setas/Home/End movem entre as abas (preventDefault evita a troca de template do switcher).
          seg.addEventListener('keydown', function (e) {
            var i = abas.indexOf(document.activeElement);
            if (i < 0) return;
            var n = abas.length, alvo = null;
            if (e.key === 'ArrowRight') alvo = (i + 1) % n;
            else if (e.key === 'ArrowLeft') alvo = (i - 1 + n) % n;
            else if (e.key === 'Home') alvo = 0;
            else if (e.key === 'End') alvo = n - 1;
            if (alvo === null) return;
            e.preventDefault(); e.stopPropagation();
            selecionar(alvo, true);
          });
          abas.forEach(function (x, k) { x.setAttribute('aria-selected', String(k === 0)); x.tabIndex = k === 0 ? 0 : -1; });
          perfis[0].classList.add('atual');
        }

        /* ---- Movimento ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          // Carga: o "app" abre e o sheet sobe do rodapé (assenta em ~1s).
          gsap.from('main', { y: 40, duration: 0.8, ease: 'power3.out', clearProps: 'transform' });
          gsap.from('[data-secao="hero"] > *', { y: 20, autoAlpha: 0, duration: 0.5, stagger: 0.06, ease: 'power2.out', delay: 0.1 });
          gsap.fromTo(sheet, { y: function () { return fechadoY + 140; } }, { y: function () { return fechadoY; }, duration: 0.7, ease: 'back.out(1.4)', delay: 0.35 });
          // O sheet dá uma "piscadinha" para mostrar que arrasta.
          gsap.to(sheet, { y: function () { return fechadoY - 18; }, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1, delay: 2.4 });
          gsap.from('.previa img', { yPercent: 30, rotation: 4, duration: 1, ease: 'power3.out', delay: 0.2 });
          gsap.utils.toArray('.tiles, .linhas, .pessoas, .canais').forEach(function (g) {
            gsap.from(g.children, { y: 24, scale: 0.97, autoAlpha: 0, duration: 0.5, stagger: 0.06, ease: 'power2.out',
              scrollTrigger: { trigger: g, start: 'top 90%', once: true } });
          });
        });
        // Números gigantes da margem deslizam com o scroll (só desktop, com movimento).
        mm.add('(prefers-reduced-motion: no-preference) and (min-width: 1000px)', function () {
          gsap.utils.toArray('main > section:not([data-secao="hero"])').forEach(function (s) {
            gsap.from(s.querySelector('.cabeca, .tiles, .conversa'), { y: 30, duration: 0.6, ease: 'power2.out', scrollTrigger: { trigger: s, start: 'top 80%', once: true } });
          });
        });
      });
    })();
  </script>
</body>
</html>
