<!doctype html>
<html lang="pt-BR" data-template="30">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 30 Notificação</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       30 Notificação · app · N9 / C4 / R7
       O hero é uma tela de bloqueio com as notificações do app empilhadas.
       Com movimento, os cards chegam um a um: o mais novo fica na frente,
       os anteriores encolhem e afundam na pilha (no scroll, ≥900px, com o
       hero pinado). Sem movimento ou abaixo de 900px: lista empilhada estática.
       Ritmo R7: scroll contínuo, sem divisórias; só a tipografia marca as seções.
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --cab-h: 92px; --respiro: 136px; }
    @media (max-width: 899px) { :root { --cab-h: 72px; --respiro: 88px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--petroleo); outline-offset: 2px; }
    body { padding-top: var(--cab-h); }
    main > section { padding-block: calc(var(--respiro) / 2); scroll-margin-top: 72px; }

    /* ---------- N9: cabeçalho que encolhe e vira só coroa + CTA ---------- */
    .cab { position: fixed; inset: 0 0 auto; z-index: 60; transition: background-color .3s ease, box-shadow .3s ease; }
    .cab__barra { display: flex; align-items: center; gap: var(--sp-6); height: var(--cab-h); transition: height .35s cubic-bezier(.3,.7,.2,1); }
    .cab__marca { position: relative; display: block; flex: none; width: 64px; height: 64px; transition: width .35s ease, height .35s ease; }
    .cab__marca img { position: absolute; inset: 0; margin: auto; transition: transform .35s ease, clip-path .35s ease; }
    .cab__abelha { width: 64px; height: 64px; }
    .cab__coroa { width: 40px; height: auto; transform: scale(.4); clip-path: inset(0 0 100% 0); }
    .cab__links { display: flex; gap: var(--sp-5); margin-inline: auto; transition: transform .35s ease, clip-path .35s ease; clip-path: inset(0 0 0 0); }
    .cab__links a { font-size: 15px; font-weight: 600; color: var(--terra); text-decoration: none; }
    .cab__links a:hover { color: var(--terra-escura); text-decoration: underline; text-decoration-color: var(--mel); text-underline-offset: 6px; text-decoration-thickness: 2px; }
    .cab .dr-btn { flex: none; margin-left: auto; transition: padding .35s ease; }
    .cab.encolhido { background: rgba(255,251,230,.92); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--linha), 0 8px 24px rgba(78,52,46,.06); }
    .cab.encolhido .cab__barra { height: 60px; }
    .cab.encolhido .cab__marca { width: 44px; height: 44px; }
    .cab.encolhido .cab__abelha { transform: scale(.4); clip-path: inset(100% 0 0 0); }
    .cab.encolhido .cab__coroa { transform: none; clip-path: inset(0 0 0 0); }
    .cab.encolhido .cab__links { transform: translateY(-12px); clip-path: inset(0 0 100% 0); pointer-events: none; }
    .cab.encolhido .dr-btn { padding: 8px 18px; }
    @media (max-width: 899px) { .cab__links { display: none; } .cab__marca, .cab__abelha { width: 52px; height: 52px; } }

    /* ---------- Hero ---------- */
    .hero { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--sp-8); align-items: center; min-height: calc(100vh - var(--cab-h) - 40px); }
    .hero h1 { margin-top: var(--sp-4); font-size: clamp(44px, 6vw, 88px); line-height: .98; letter-spacing: -.032em; text-wrap: balance; }
    .hero__sub { margin-top: var(--sp-5); max-width: 40ch; font-size: 20px; }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
    @media (max-width: 899px) { .hero { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); min-height: 0; } }

    /* Tela de bloqueio */
    .bloqueio {
      position: relative; border-radius: 36px; padding: var(--sp-6) var(--sp-5) var(--sp-6);
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,192,44,.22), transparent 70%), radial-gradient(ellipse at center, rgba(32,32,32,.2), rgba(32,32,32,.75)), url(../img/padroes/favo-escuro.svg), var(--grafite);
      box-shadow: 0 30px 80px -30px rgba(78,52,46,.55); overflow: hidden; isolation: isolate;
    }
    .relogio { text-align: center; color: var(--creme); }
    .relogio time { display: block; font-family: var(--mono); font-weight: 500; font-size: clamp(56px, 6vw, 84px); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .relogio span { display: block; margin-top: var(--sp-2); font-size: 14px; color: var(--mel-claro); text-transform: capitalize; letter-spacing: .02em; }
    .pilha { position: relative; margin-top: var(--sp-6); display: grid; gap: 10px; }
    .notif {
      display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--sp-3); align-items: start;
      padding: 14px 16px; border-radius: 22px; background: var(--creme); box-shadow: 0 8px 24px rgba(0,0,0,.18);
      transform-origin: 50% 100%;
    }
    .notif__icone { width: 40px; height: 40px; border-radius: 11px; background: var(--mel); display: grid; place-items: center; }
    .notif__icone img { width: 24px; height: auto; }
    .notif__app { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
    .notif__app svg { width: 14px; height: 14px; color: var(--petroleo); }
    .notif h3 { margin-top: 2px; font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .notif p { margin-top: 2px; font-size: 14px; line-height: 1.45; color: var(--corpo); }
    .bloqueio__base { display: flex; justify-content: space-between; align-items: center; margin-top: var(--sp-6); padding-inline: var(--sp-3); color: var(--creme); }
    .bloqueio__base span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,251,230,.14); }
    .bloqueio__base span svg { width: 20px; height: 20px; }
    .bloqueio__base i { width: 120px; height: 5px; border-radius: 5px; background: rgba(255,251,230,.6); }
    @media (max-width: 599px) { .bloqueio { border-radius: 28px; padding: var(--sp-5) 12px; } }

    /* Pilha viva (classe posta pelo JS só com movimento e ≥900px) */
    .pilha-viva [data-secao="hero"] { padding-block: 0; }
    .pilha-viva .hero { height: calc(100vh - 60px); min-height: 640px; }
    .pilha-viva .pilha { display: block; height: var(--pilha-h, 340px); }
    .pilha-viva .pilha > .notif { position: absolute; left: 0; right: 0; top: 0; }

    /* ---------- Cabeças tipográficas (R7: sem divisórias) ---------- */
    .cabeca { max-width: 820px; margin-bottom: var(--sp-8); }
    .cabeca .dr-eyebrow { display: inline-flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .cabeca .dr-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mel); }
    .cabeca h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(36px, 4.6vw, 64px); line-height: 1.04; letter-spacing: -.024em; color: var(--terra-escura); text-wrap: balance; }
    .cabeca .dr-body-lg { margin-top: var(--sp-5); max-width: 52ch; font-size: 20px; }
    .cabeca--centro { margin-inline: auto; text-align: center; }
    .cabeca--centro .dr-body-lg { margin-inline: auto; }
    @media (max-width: 767px) { .cabeca { margin-bottom: var(--sp-6); } .cabeca .dr-body-lg { font-size: 18px; } }

    /* ---------- C4: hexágonos com conteúdo centralizado ---------- */
    .hexes { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 12px 10px; }
    .hex {
      --hw: 300px; width: var(--hw); aspect-ratio: 1.1547 / 1; flex: none;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: calc(var(--hw) * .07) calc(var(--hw) * .17); background: var(--superficie); min-width: 0;
    }
    .hexes > .hex:nth-of-type(even) { margin-top: calc(var(--hw) / 1.1547 / 2); }
    .hex .dr-icone { color: var(--petroleo); margin-bottom: var(--sp-2); }
    .hex .dr-h4 { font-size: 17px; line-height: 1.25; }
    .hex .dr-body { font-size: 13.5px; line-height: 1.45; margin-top: var(--sp-1); }
    .hex--mel { background: var(--mel); }
    .hex--escuro { background: var(--grafite); }
    .hex--escuro .dr-h4, .hex--escuro .dr-body { color: var(--creme); }
    @media (max-width: 1023px) { .hexes > .hex:nth-of-type(even) { margin-top: 0; } }
    @media (max-width: 599px) { .hex { --hw: min(340px, calc(100vw - 32px)); } }

    .pilares .hex { --hw: 272px; }
    .perfis .hex:nth-of-type(2) { background: var(--mel-veu); }
    @media (max-width: 599px) { .pilares .hex { --hw: min(340px, calc(100vw - 32px)); } }

    /* Prova */
    .prova .hex { --hw: 240px; padding-inline: 34px; }
    .prova .hex:nth-of-type(odd) { background: var(--mel-veu); }
    .prova__valor { font-family: var(--serif); font-weight: 500; font-size: 52px; line-height: 1; color: var(--terra-escura); letter-spacing: -.02em; }
    .prova__rotulo { margin-top: var(--sp-2); font-size: 14px; color: var(--corpo); line-height: 1.35; }
    @media (max-width: 599px) { .prova .hex { --hw: calc((100vw - 32px - 10px) / 2); padding-inline: 18px; } .prova__valor { font-size: 34px; } .prova__rotulo { font-size: 12.5px; } .prova .hexes > .hex:nth-of-type(even) { margin-top: 0; } }

    /* Problema: declaração tipográfica */
    .problema { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: end; }
    .problema__num { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(120px, 17vw, 260px); line-height: .8; letter-spacing: -.05em; color: var(--terra-escura); }
    .problema__texto { margin-top: var(--sp-4); font-size: 20px; max-width: 30ch; }
    .frases li { font-family: var(--serif); font-size: clamp(22px, 2.4vw, 30px); line-height: 1.3; color: var(--terra); padding-block: var(--sp-3); }
    .frases li::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 14px; border-radius: 50%; background: var(--erro); transform: translateY(-3px); }
    @media (max-width: 899px) { .problema { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Como funciona */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-7); }
    .passo__num { display: block; font-family: var(--serif); font-size: 88px; line-height: .9; color: var(--mel-escuro); letter-spacing: -.04em; }
    .passo .dr-h3 { margin-top: var(--sp-3); font-size: 23px; }
    .passo .dr-body { margin-top: var(--sp-2); }
    .passo figure { margin-top: var(--sp-5); height: 260px; overflow: hidden; border-radius: 28px 28px 0 0; border: 8px solid var(--grafite); border-bottom: 0; background: #FFF8E6; max-width: 260px; }
    .passo figure img { width: 100%; height: auto; }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); } }

    /* Equipe */
    .pessoa { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-3); width: 260px; }
    .pessoa__foto { width: 200px; aspect-ratio: 1.1547 / 1; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); object-fit: cover; background: var(--creme-papel); }
    .pessoa .dr-h4 { font-size: 19px; }
    .pessoa__cargo { font-size: 14px; color: var(--suave); }
    .origem { max-width: 52ch; margin: 0 auto var(--sp-7); text-align: center; font-family: var(--serif); font-size: clamp(22px, 2.4vw, 28px); line-height: 1.4; color: var(--terra); }
    .apoios { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-5) var(--sp-8); margin-top: var(--sp-8); padding: var(--sp-6); background: var(--grafite); border-radius: 999px; }
    .apoio { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
    .apoio__logo { display: grid; place-items: center; height: 72px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); }
    .apoio__logo img { max-height: 56px; width: auto; max-width: 160px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }
    @media (max-width: 767px) { .apoios { border-radius: var(--r-xl); } }

    /* Depoimento: uma notificação grande */
    .depo { max-width: 860px; margin-inline: auto; }
    .depo .notif { grid-template-columns: 56px minmax(0, 1fr); padding: var(--sp-6); border-radius: 32px; background: var(--branco); box-shadow: var(--sh-lg); gap: var(--sp-5); }
    .depo .notif__icone { width: 56px; height: 56px; border-radius: 16px; overflow: hidden; background: var(--creme-papel); }
    .depo .notif__icone img { width: 56px; height: 56px; object-fit: cover; }
    .depo .dr-quote { margin-top: var(--sp-3); font-size: clamp(22px, 2.8vw, 34px); color: var(--terra-escura); line-height: 1.35; }
    .depo__quem { margin-top: var(--sp-4); font-size: 15px; color: var(--suave); }
    .depo__quem b { color: var(--ink); }
    @media (max-width: 599px) { .depo .notif { grid-template-columns: minmax(0, 1fr); padding: var(--sp-5); } }

    /* Contato */
    .contato { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--sp-8); align-items: start; }
    .form { display: grid; gap: var(--sp-4); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); }
    .campo input, .campo textarea { font: inherit; color: var(--ink); background: var(--branco); border: var(--bd-forte); border-radius: 16px; padding: 14px 16px; width: 100%; }
    .campo textarea { min-height: 140px; resize: vertical; }
    .form .dr-btn { justify-self: start; }
    .canais li { padding-block: var(--sp-4); display: flex; align-items: center; gap: var(--sp-4); }
    .canais svg { color: var(--petroleo); flex: none; }
    .canais a { font-family: var(--serif); font-size: clamp(20px, 2.2vw, 26px); color: var(--terra-escura); text-decoration-color: var(--mel); text-underline-offset: 5px; overflow-wrap: anywhere; }
    .contato .acoes { margin-top: var(--sp-5); }
    @media (max-width: 899px) { .contato { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Rodapé */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding: var(--sp-7) 0 96px; margin-top: calc(var(--respiro) / 2); }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) { .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); } footer > [data-aviso-provisorio] { padding-inline: 16px; } }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N9 · cabeçalho que encolhe ao rolar e vira só coroa + CTA) -->
  <nav data-secao="nav" class="cab" data-cab>
    <div class="dr-container cab__barra">
      <a class="cab__marca" href="#inicio">
        <img class="cab__abelha" src="../img/logos/logo-abelha-cor.png" alt="" data-c-alt="marca.alt" width="64" height="64">
        <img class="cab__coroa" src="../img/logos/coroa-cor.png" alt="" width="40" height="29">
      </a>
      <div class="cab__links">
        <a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a>
        <a href="#como-funciona" data-c="comoFunciona.eyebrow"></a>
        <a href="#para-quem" data-c="paraQuem.eyebrow"></a>
        <a href="#equipe" data-c="equipe.eyebrow"></a>
        <a href="#contato" data-c="contato.eyebrow"></a>
      </div>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
  </nav>

  <main>

    <!-- SEÇÃO: hero (notificações do app empilhadas numa tela de bloqueio) -->
    <section data-secao="hero" id="inicio">
      <div class="dr-container hero">
        <div>
          <p class="dr-eyebrow" data-c="hero.eyebrow"></p>
          <h1 class="dr-display" data-c="hero.titulo"></h1>
          <p class="dr-body-lg hero__sub" data-c="hero.subtitulo"></p>
          <div class="acoes">
            <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
            <a class="dr-btn dr-btn--secundario" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
            <a class="dr-btn dr-btn--secundario" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
          </div>
        </div>

        <div class="bloqueio">
          <div class="relogio" aria-hidden="true"><time data-hora></time><span data-hoje></span></div>
          <!-- SEÇÃO: funcionalidades (fundida ao hero: cada função chega como notificação) -->
          <div data-secao="funcionalidades" id="funcionalidades">
            <h2 class="dr-sr-only" data-c="funcionalidades.titulo"></h2>
            <ul class="pilha" data-pilha data-c-lista="funcionalidades.itens">
              <template>
                <li class="notif">
                  <span class="notif__icone"><img src="../img/logos/coroa-terra.png" alt="" width="24" height="17"></span>
                  <div>
                    <p class="notif__app"><span data-c-x="marca"></span><svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg></p>
                    <h3 data-c="titulo"></h3>
                    <p data-c="texto"></p>
                  </div>
                </li>
              </template>
            </ul>
          </div>
          <div class="bloqueio__base" aria-hidden="true">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6M10 2v4.5L6 14a5 5 0 0 0 4.5 8h3a5 5 0 0 0 4.5-8l-4-7.5V2"/></svg></span>
            <i></i>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
          </div>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: prova (favo de números) -->
    <section data-secao="prova">
      <div class="dr-container">
        <ul class="hexes prova" data-c-lista="prova.stats">
          <template>
            <li class="hex">
              <span class="prova__valor" data-c="valor"></span>
              <span class="prova__rotulo" data-c="rotulo"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: problema (declaração tipográfica) -->
    <section data-secao="problema" id="problema">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="problema.eyebrow"></p>
          <h2 data-c="problema.titulo"></h2>
        </header>
        <div class="problema">
          <div>
            <span class="problema__num" data-c="problema.estatistica.valor"></span>
            <p class="dr-body-lg problema__texto" data-c="problema.estatistica.texto"></p>
          </div>
          <ul class="frases" data-c-lista="problema.consequencias">
            <template><li data-c="texto"></li></template>
          </ul>
        </div>
      </div>
    </section>

    <!-- SEÇÃO: como-funciona -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Fiação (sempre) ---- */
        var marca = DR.valor('marca.nome');
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
            var m = el.querySelector('[data-c-x="marca"]');
            if (m && marca) m.textContent = marca.v; // nome do app vem de marca.nome
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) { if (email) a.setAttribute('href', 'mailto:' + email.v); });
        document.querySelectorAll('[data-ano]').forEach(function (el) { el.textContent = '© ' + new Date().getFullYear(); });
        // Relógio da tela de bloqueio: hora e data de agora (não é cópia).
        function relogio() {
          var agora = new Date();
          var h = document.querySelector('[data-hora]');
          h.setAttribute('datetime', agora.toISOString());
          h.textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          document.querySelectorAll('[data-hoje]').forEach(function (el) {
            el.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
          });
        }
        relogio();
        setInterval(relogio, 30000);

        /* ---- N9: cabeçalho encolhe ao rolar (estado) ---- */
        var cab = document.querySelector('[data-cab]');
        function encolher() { cab.classList.toggle('encolhido', window.scrollY > 40); }
        window.addEventListener('scroll', encolher, { passive: true });
        encolher();

        /* ---- Movimento ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();

        // Efeito principal: notificações chegam e as anteriores encolhem na pilha.
        mm.add('(prefers-reduced-motion: no-preference) and (min-width: 900px)', function () {
          var raiz = document.documentElement;
          var pilha = document.querySelector('[data-pilha]');
          var cards = gsap.utils.toArray('.pilha > .notif');
          if (!cards.length) return;
          raiz.classList.add('pilha-viva');
          var GAP = 10, PEEK = 11, VISIVEIS = 4;

          // Alturas medidas no layout absoluto (largura igual à da pilha).
          function alturas() { return cards.map(function (c) { return c.offsetHeight; }); }
          var hs = alturas();
          var hMax = Math.max.apply(null, hs);
          pilha.style.setProperty('--pilha-h', (hMax * 2 + GAP + PEEK * (VISIVEIS - 2) + 8) + 'px');

          // Estado com n notificações recebidas: a mais nova (n-1) na frente, a anterior logo
          // abaixo, e as demais afundam numa pilha que encolhe a cada nível.
          function estado(n) {
            return cards.map(function (c, i) {
              if (i >= n) return { y: -90, scale: 1, autoAlpha: 0, zIndex: 0 };
              var d = n - 1 - i;
              if (d === 0) return { y: 0, scale: 1, autoAlpha: 1, zIndex: 50 };
              var topoSegunda = hs[n - 1] + GAP;
              if (d === 1) return { y: topoSegunda, scale: 1, autoAlpha: 1, zIndex: 49 };
              var baseSegunda = topoSegunda + hs[n - 2];
              return {
                y: baseSegunda - hs[i] + PEEK * (d - 1), scale: 1 - 0.06 * (d - 1),
                autoAlpha: d <= VISIVEIS - 1 ? 1 - 0.18 * (d - 1) : 0, zIndex: 50 - d
              };
            });
          }

          var tl = gsap.timeline({ paused: true, defaults: { duration: 1, ease: 'power3.out' } });
          cards.forEach(function (c, i) { gsap.set(c, estado(0)[i]); });
          for (var n = 1; n <= cards.length; n++) {
            var e = estado(n);
            tl.addLabel('n' + n);
            cards.forEach(function (c, i) {
              if (i >= n) return;
              tl.to(c, e[i], 'n' + n);
              // Na pilha, só a borda do card aparece: o conteúdo some ao afundar.
              tl.to(c.children, { autoAlpha: n - 1 - i <= 1 ? 1 : 0, duration: 0.5 }, 'n' + n);
            });
          }
          tl.addLabel('fim');
          var t3 = tl.labels.n3 + 1;          // três notificações já empilhadas na carga
          var tFim = tl.duration();

          // Carga: chegam as três primeiras (~1,2s).
          gsap.to(tl, { time: t3, duration: 1.2, ease: 'power1.inOut' });

          // Scroll: o hero pina e as demais chegam, afundando as anteriores.
          var st = ScrollTrigger.create({
            trigger: '[data-secao="hero"]', start: 'top top+=60', end: '+=140%', pin: true, anticipatePin: 1,
            onUpdate: function (self) {
              gsap.to(tl, { time: t3 + (tFim - t3) * self.progress, duration: 0.5, ease: 'power2.out', overwrite: true });
            }
          });

          return function () {
            st.kill();
            raiz.classList.remove('pilha-viva');
            pilha.style.removeProperty('--pilha-h');
            gsap.set(cards, { clearProps: 'all' });
          };
        });

        // Abaixo de 900px: a lista empilhada chega em cascata na carga.
        mm.add('(prefers-reduced-motion: no-preference) and (max-width: 899px)', function () {
          gsap.from('.pilha > .notif', { y: -24, scale: 0.96, autoAlpha: 0, duration: 0.5, stagger: 0.09, ease: 'power3.out', delay: 0.15 });
        });

        // Revelações por tipografia e hexágonos (só com movimento).
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          gsap.from('.hero h1, .hero .dr-eyebrow, .hero__sub, .hero .acoes', { y: 26, autoAlpha: 0, duration: 0.7, stagger: 0.08, ease: 'power3.out' });
          gsap.utils.toArray('.cabeca h2, .problema__num, .origem').forEach(function (h) {
            gsap.from(h, { yPercent: 30, autoAlpha: 0, duration: 0.8, ease: 'power3.out', scrollTrigger: { trigger: h, start: 'top 88%', once: true } });
          });
          gsap.utils.toArray('.hexes, .frases, .passos').forEach(function (g) {
            gsap.from(g.children, { scale: 0.8, autoAlpha: 0, duration: 0.6, stagger: 0.08, ease: 'back.out(1.6)', scrollTrigger: { trigger: g, start: 'top 85%', once: true } });
          });
        });
      });
    })();
  </script>
