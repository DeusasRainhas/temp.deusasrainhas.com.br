<!doctype html>
<html lang="pt-BR" data-template="32">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deusas Rainhas · 32 Abertura</title>
  <link rel="icon" href="../img/logos/coroa-cor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* =================================================================
       32 Abertura · cinema · N7 / C9 / R9
       A página abre como um filme: tarjas pretas se afastam, a coroa
       acende, o nome se espaça, a frase sobe. A sequência roda uma vez
       por sessão (sessionStorage), dura ~1,4s, prende o scroll só enquanto
       roda e pula em qualquer tecla, toque ou roda do mouse. Com movimento
       reduzido, nada disso acontece: o hero já nasce pronto.
       Depois da abertura, a luz entra: cada seção muda de fundo (creme,
       papel, superfície, véu de mel) e o conteúdo flui em chips e pílulas.
       Regras herdadas do 01:
       - nada de opacity < 1 fora do gsap.matchMedia;
       - canto inferior direito livre (pílula do switcher).
       ================================================================= */

    :root { --nav-h: 60px; --respiro: var(--sp-9); --chip-r: 40px; }
    @media (max-width: 767px) { :root { --nav-h: 56px; --respiro: 64px; --chip-r: 28px; } }

    h1, h2, h3, p, figure, blockquote, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: var(--petroleo); }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--petroleo); outline-offset: 2px;
    }
    main > section { padding-block: var(--respiro); scroll-margin-top: var(--nav-h); }

    /* ---------- N7: barra de progresso no topo com rótulos de seção ---------- */
    .barra {
      position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--nav-h);
      background: var(--grafite); color: var(--creme);
      border-bottom: 1px solid rgba(255, 251, 230, .1);
    }
    .barra__dentro { height: 100%; display: flex; align-items: center; gap: var(--sp-5); }
    .barra__coroa { display: block; flex: none; padding: 6px 4px; }
    .barra__coroa img { width: 44px; height: auto; }
    .rotulos { display: flex; gap: var(--sp-1); margin-inline: auto; }
    .rotulos a {
      position: relative; padding: 8px 12px; border-radius: var(--r-pill);
      font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em;
      text-transform: uppercase; color: var(--tenue); text-decoration: none; white-space: nowrap;
    }
    .rotulos a:hover { color: var(--creme); }
    .rotulos a[aria-current="true"] { color: var(--grafite); background: var(--mel); }
    .rotulos a:focus-visible { outline-color: var(--mel); }
    .barra .dr-btn { padding: 8px 16px; font-size: var(--fs-small); flex: none; }
    .barra .dr-btn:focus-visible { outline-color: var(--mel); }
    .progresso {
      position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
      background: var(--mel); transform-origin: left center; transform: scaleX(0);
    }
    /* Abaixo de 1180px só o rótulo da seção atual fica visível */
    @media (max-width: 1179px) {
      .rotulos a { display: none; }
      .rotulos a[aria-current="true"] { display: inline-block; }
    }
    @media (max-width: 420px) { .rotulos a { font-size: 10px; letter-spacing: .1em; padding: 6px 10px; } }

    /* ---------- Hero: tela escura que abre em sequência ---------- */
    [data-secao="hero"] {
      position: relative; overflow: hidden;
      min-height: 100svh; padding: calc(var(--nav-h) + var(--sp-7)) 0 var(--sp-8) !important;
      display: grid; place-items: center; text-align: center;
      background: radial-gradient(ellipse 60% 50% at 50% 42%, #2E2A20 0%, var(--grafite) 70%);
      color: var(--creme);
    }
    /* Favo só nas bordas, apagado por máscara no centro: nunca atrás do texto */
    .hero__favo {
      position: absolute; inset: 0; pointer-events: none;
      background: url(../img/padroes/favo-escuro.svg);
      -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 55%, #000 100%);
              mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 55%, #000 100%);
    }
    /* Tarjas de cinema: na abertura cobrem a tela; depois ficam como moldura fina */
    .tarja { position: absolute; left: 0; right: 0; height: 18px; background: #111; z-index: 2; pointer-events: none; }
    .tarja--cima { top: var(--nav-h); }
    .tarja--baixo { bottom: 0; }
    .hero__palco { position: relative; z-index: 1; display: grid; justify-items: center; gap: var(--sp-5); max-width: 980px; }
    .hero__coroa { width: clamp(96px, 9vw, 129px); height: auto; filter: none; }
    .hero__brilho {
      position: absolute; top: -40px; left: 50%; width: 360px; height: 260px; margin-left: -180px;
      background: radial-gradient(closest-side, rgba(245, 192, 44, .22), transparent);
      pointer-events: none; z-index: -1;
    }
    .hero__nome {
      font-family: var(--mono); font-weight: 500; font-size: clamp(13px, 1.3vw, 16px);
      letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--mel);
    }
    .hero__titulo {
      font-family: var(--serif); font-weight: 500; color: var(--creme);
      font-size: clamp(42px, 7vw, 104px); line-height: 1; letter-spacing: -.025em; text-wrap: balance;
    }
    .hero__sub { max-width: 46ch; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.6; color: #D8CFBB; }
    .acoes { display: flex; flex-wrap: wrap; gap: var(--sp-3); justify-content: center; }
    .dr-btn--escuro { background: transparent; color: var(--creme); border: 1.5px solid rgba(255, 251, 230, .4); }
    .dr-btn--escuro:hover { background: rgba(255, 251, 230, .08); border-color: var(--creme); }
    [data-secao="hero"] .dr-btn:focus-visible { outline-color: var(--mel); }
    .hero__linha { width: 1px; height: 56px; background: linear-gradient(var(--mel), transparent); margin-top: var(--sp-4); }

    /* ---------- R9: o fundo muda por seção ---------- */
    .f-creme { background: var(--creme); }
    .f-papel { background: var(--creme-papel); }
    .f-superficie { background: var(--superficie); }
    .f-veu { background: var(--mel-veu); }

    /* ---------- Cabeça de seção ---------- */
    .cabeca { max-width: 760px; margin-inline: auto; text-align: center; }
    .cabeca .dr-eyebrow { margin-bottom: var(--sp-4); }
    .cabeca .dr-h2 { font-size: clamp(32px, 4.2vw, 52px); line-height: 1.08; text-wrap: balance; }
    .cabeca .dr-body-lg { margin: var(--sp-5) auto 0; max-width: 54ch; }
    .cabeca + * { margin-top: var(--sp-7); }

    /* ---------- C9: chips e pílulas em fluxo ---------- */
    .nuvem { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); }
    .chip {
      display: inline-flex; align-items: center; gap: var(--sp-3);
      padding: 10px 20px 10px 10px; border-radius: var(--r-pill);
      background: var(--branco); border: 1.5px solid var(--linha-forte);
      color: var(--ink); font-weight: 600;
    }
    .chip__icone {
      flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
      background: var(--mel); color: var(--terra-escura);
    }
    .chip--rico { align-items: flex-start; border-radius: var(--chip-r); padding: 14px 26px 16px 14px; max-width: 470px; text-align: left; }
    .chip--rico .chip__icone { width: 48px; height: 48px; }
    .chip--rico .dr-h4 { font-size: 18px; margin-block: 2px 4px; }
    .chip--rico .dr-body { font-size: 15px; line-height: 1.55; font-weight: 400; }
    .chip--rico:nth-child(3n+2) { max-width: 400px; }
    .chip--rico:nth-child(3n) { max-width: 520px; }

    /* Prova: números em pílula */
    [data-secao="prova"] { padding-block: var(--sp-7) !important; }
    .chip--stat { padding: 12px 24px 12px 12px; gap: var(--sp-4); }
    .chip--stat .dr-data {
      display: grid; place-items: center; min-width: 64px; height: 48px; padding-inline: 14px; border-radius: var(--r-pill);
      background: var(--grafite); color: var(--mel); font-size: 20px;
    }
    .chip--stat span:last-child { font-family: var(--mono); font-size: var(--fs-eyebrow); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); }

    /* Problema */
    .problema-grade { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: center; }
    .problema-grade .cabeca { text-align: left; margin: 0; }
    .grande-pilula {
      display: inline-flex; align-items: baseline; gap: var(--sp-4); margin-top: var(--sp-6);
      padding: 18px 32px; border-radius: var(--r-pill); background: var(--grafite); color: var(--creme);
    }
    .grande-pilula .dr-data { font-size: clamp(48px, 6vw, 76px); line-height: 1; color: var(--mel); }
    .grande-pilula + p { margin-top: var(--sp-4); max-width: 36ch; }
    .nuvem--esq { justify-content: flex-start; }
    .chip--alerta { border-radius: var(--chip-r); padding: 14px 24px 14px 14px; align-items: center; font-weight: 500; }
    .chip--alerta .chip__icone { background: var(--terra-escura); color: var(--mel); }
    .chip--alerta p { color: var(--corpo); font-size: var(--fs-body-lg); line-height: 1.5; }
    @media (max-width: 899px) { .problema-grade { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }

    /* Como funciona */
    .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
    .passo { display: grid; justify-items: center; text-align: center; gap: var(--sp-3); align-content: start; }
    .passo__chip { display: inline-flex; align-items: center; gap: var(--sp-3); padding: 8px 20px 8px 8px; border-radius: var(--r-pill); background: var(--grafite); color: var(--creme); }
    .passo__chip .dr-data { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--mel); color: var(--terra-escura); font-size: 15px; }
    .passo__chip .dr-h4 { color: var(--creme); font-size: 17px; }
    .passo .dr-body { max-width: 34ch; }
    .passo img {
      margin-top: var(--sp-3); width: 100%; max-width: 230px; aspect-ratio: 393 / 600; object-fit: cover; object-position: top;
      border-radius: 28px; border: 6px solid var(--grafite); background: var(--grafite);
    }
    .passo figcaption { margin-top: var(--sp-2); max-width: 240px; }
    @media (max-width: 899px) { .passos { grid-template-columns: minmax(0, 1fr); gap: var(--sp-7); } }

    /* Para quem */
    .chip--perfil { flex-direction: column; align-items: flex-start; gap: var(--sp-2); padding: 22px 30px; border-radius: var(--chip-r); max-width: 360px; border-color: var(--mel-escuro); }
    .chip--perfil .dr-h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; color: var(--terra-escura); }
    .chip--perfil .dr-body { font-weight: 400; }

    /* Equipe */
    .chip--pessoa { padding: 8px 24px 8px 8px; }
    .chip--pessoa img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--linha-forte); }
    .chip--pessoa .dr-h4 { font-size: 17px; }
    .chip--pessoa .cargo { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--terra); font-weight: 500; }
    .origem { max-width: 60ch; margin: var(--sp-5) auto 0; text-align: center; }
    .apoios { margin-top: var(--sp-6); }
    .apoio { display: inline-flex; align-items: center; gap: var(--sp-3); padding: 8px 20px 8px 8px; border-radius: var(--r-pill); background: var(--grafite); }
    .apoio__logo { display: grid; place-items: center; height: 56px; padding: 6px 14px; border-radius: var(--r-pill); }
    .apoio__logo img { max-height: 40px; width: auto; max-width: 120px; }
    .apoio[data-fundo="claro"] .apoio__logo { background: var(--creme); }
    .apoio__nome { font-family: var(--mono); font-size: var(--fs-eyebrow); letter-spacing: .2em; text-transform: uppercase; color: var(--mel-claro); }

    /* Depoimento */
    .citacao { max-width: 860px; margin-inline: auto; text-align: center; }
    .citacao .dr-quote { font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; color: var(--terra-escura); text-wrap: balance; }
    .citacao figcaption { margin-top: var(--sp-6); }
    .citacao .chip { padding-right: 24px; }
    .citacao .chip img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .citacao__local { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); font-weight: 500; text-align: left; }

    /* Contato */
    .contato-grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-7); align-items: start; }
    .contato-grade .cabeca { text-align: left; margin: 0; }
    .canais { margin-top: var(--sp-6); }
    .canais .chip { font-weight: 600; text-decoration: none; color: var(--ink); overflow-wrap: anywhere; }
    .canais .chip:hover { border-color: var(--mel-escuro); }
    .canais .chip__icone { width: 36px; height: 36px; }
    .contato-grade .acoes { justify-content: flex-start; margin-top: var(--sp-6); }
    .form { display: grid; gap: var(--sp-4); padding: var(--sp-6); border-radius: 32px; background: var(--branco); border: 1.5px solid var(--linha-forte); }
    .campo { display: grid; gap: var(--sp-2); }
    .campo label { font-weight: 600; font-size: var(--fs-small); color: var(--ink); padding-left: var(--sp-4); }
    .campo input, .campo textarea {
      font: inherit; font-size: var(--fs-body); color: var(--ink);
      background: var(--creme); border: var(--bd-forte); border-radius: var(--r-pill);
      padding: var(--sp-3) var(--sp-5); width: 100%;
    }
    .campo textarea { min-height: 140px; resize: vertical; border-radius: 24px; }
    .form .dr-btn { justify-self: start; border-radius: var(--r-pill); }
    @media (max-width: 899px) { .contato-grade { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 599px) { .form { padding: var(--sp-5); } }

    /* ---------- Rodapé: a tela volta a escurecer ---------- */
    footer[data-secao="rodape"] { background: var(--grafite); color: var(--tenue); padding-block: var(--sp-7) 96px; }
    .rodape { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-6); align-items: start; }
    .rodape img { width: 72px; height: 72px; }
    .rodape p { font-size: var(--fs-small); line-height: 1.7; }
    .rodape__razao { color: var(--creme); font-weight: 600; }
    .rodape a { color: var(--creme); text-underline-offset: 3px; }
    footer > [data-aviso-provisorio] { max-width: 1200px; margin: var(--sp-5) auto 0; padding-inline: 32px; color: var(--tenue); }
    @media (max-width: 767px) {
      .rodape { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
      footer > [data-aviso-provisorio] { padding-inline: 16px; }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO: nav (N7 · barra de progresso no topo com rótulos de seção) -->
  <nav data-secao="nav" class="barra" aria-label="Seções">
    <div class="dr-container barra__dentro">
      <a class="barra__coroa" href="#inicio"><img src="../img/logos/coroa-negativa.png" alt="" data-c-alt="marca.alt" width="129" height="93"></a>
      <div class="rotulos">
        <a href="#problema" data-c="problema.eyebrow"></a>
        <a href="#funcionalidades" data-c="funcionalidades.eyebrow"></a>
        <a href="#como-funciona" data-c="comoFunciona.eyebrow"></a>
        <a href="#para-quem" data-c="paraQuem.eyebrow"></a>
        <a href="#tecnologia" data-c="tecnologia.eyebrow"></a>
        <a href="#equipe" data-c="equipe.eyebrow"></a>
        <a href="#contato" data-c="contato.eyebrow"></a>
      </div>
      <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
    </div>
    <span class="progresso" aria-hidden="true"></span>
  </nav>

  <main>

    <!-- SEÇÃO: hero (tela escura que abre em sequência: coroa, nome, frase) -->
    <section data-secao="hero" id="inicio">
      <div class="hero__favo" aria-hidden="true"></div>
      <div class="tarja tarja--cima" aria-hidden="true"></div>
      <div class="tarja tarja--baixo" aria-hidden="true"></div>
      <div class="dr-container hero__palco">
        <span class="hero__brilho" aria-hidden="true"></span>
        <img class="hero__coroa" src="../img/logos/coroa-negativa.png" alt="" width="129" height="93">
        <p class="hero__nome" data-c="marca.nome"></p>
        <h1 class="hero__titulo" data-c="hero.titulo"></h1>
        <p class="hero__sub" data-c="hero.subtitulo"></p>
        <div class="acoes">
          <a class="dr-btn dr-btn--primario" data-c="cta.baixar.texto" data-c-href="cta.baixar.url"></a>
          <a class="dr-btn dr-btn--escuro" target="_blank" rel="noopener" data-c="cta.falar.texto" data-c-href="cta.falar.url"></a>
          <a class="dr-btn dr-btn--escuro" hidden data-c="cta.ios.texto" data-c-href="cta.ios.url"></a>
        </div>
        <span class="hero__linha" aria-hidden="true"></span>
      </div>
    </section>

    <!-- SEÇÃO: prova (números em pílulas) · fundo creme -->
    <section data-secao="prova" class="f-creme">
      <div class="dr-container">
        <ul class="nuvem" data-c-lista="prova.stats">
          <template>
            <li class="chip chip--stat">
              <span class="dr-data" data-c="valor"></span>
              <span data-c="rotulo"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: problema · fundo papel -->
    <section data-secao="problema" id="problema" class="f-papel">
      <div class="dr-container problema-grade">
        <div>
          <header class="cabeca">
            <p class="dr-eyebrow" data-c="problema.eyebrow"></p>
            <h2 class="dr-h2" data-c="problema.titulo"></h2>
          </header>
          <div class="grande-pilula"><span class="dr-data" data-c="problema.estatistica.valor"></span></div>
          <p class="dr-body-lg" data-c="problema.estatistica.texto"></p>
        </div>
        <ul class="nuvem nuvem--esq" data-c-lista="problema.consequencias">
          <template>
            <li class="chip chip--alerta">
              <span class="chip__icone"><svg class="dr-icone" aria-hidden="true"><use href="../img/icones/sprite-icones.svg#dr-alerta"></use></svg></span>
              <p data-c="texto"></p>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: funcionalidades (nuvem de chips) · fundo superfície -->
    <section data-secao="funcionalidades" id="funcionalidades" class="f-superficie">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="funcionalidades.eyebrow"></p>
          <h2 class="dr-h2" data-c="funcionalidades.titulo"></h2>
        </header>
        <ul class="nuvem" data-c-lista="funcionalidades.itens">
          <template>
            <li class="chip chip--rico">
              <span class="chip__icone"><svg class="dr-icone" aria-hidden="true"><use data-icone></use></svg></span>
              <span>
                <h3 class="dr-h4" data-c="titulo"></h3>
                <p class="dr-body" data-c="texto"></p>
              </span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- SEÇÃO: como-funciona · fundo véu de mel -->
    <section data-secao="como-funciona" id="como-funciona" class="f-veu">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="comoFunciona.eyebrow"></p>
          <h2 class="dr-h2" data-c="comoFunciona.titulo"></h2>
        </header>
        <ol class="passos" data-c-lista="comoFunciona.passos">
          <template>
            <li class="passo">
              <span class="passo__chip"><span class="dr-data" data-c="numero"></span><h3 class="dr-h4" data-c="titulo"></h3></span>
              <p class="dr-body" data-c="texto"></p>
              <figure>
                <img data-c-src="imagem" data-c-alt="alt" alt="" loading="lazy">
                <figcaption class="dr-caption" data-c="alt"></figcaption>
              </figure>
            </li>
          </template>
        </ol>
      </div>
    </section>

    <!-- SEÇÃO: para-quem · fundo creme -->
    <section data-secao="para-quem" id="para-quem" class="f-creme">
      <div class="dr-container">
        <header class="cabeca">
          <p class="dr-eyebrow" data-c="paraQuem.eyebrow"></p>
          <h2 class="dr-h2" data-c="paraQuem.titulo"></h2>
        </header>
        <ul class="nuvem" data-c-lista="paraQuem.perfis">
          <template>
            <li class="chip chip--perfil">
              <h3 class="dr-h3" data-c="titulo"></h3>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/conteudo.js"></script>
  <script src="../js/hidratar.js"></script>
  <script src="../js/catalogo.js"></script>
  <script src="../js/switcher.js"></script>
  <script>
    (function () {
      'use strict';
      var SPRITE = '../img/icones/sprite-icones.svg#';
      var CHAVE = 'dr.abertura.32';
      function v(x) { return x && typeof x === 'object' && 'v' in x ? x.v : x; }
      function jaViu() { try { return window.sessionStorage.getItem(CHAVE) === '1'; } catch (e) { return false; } }
      function marcarVisto() { try { window.sessionStorage.setItem(CHAVE, '1'); } catch (e) { /* sem storage: roda de novo */ } }

      document.addEventListener('conteudo:pronto', function () {
        /* ---- Ligações que não são movimento (rodam sempre) ---- */
        document.querySelectorAll('[data-c-lista]').forEach(function (lista) {
          var r = DR.valor(lista.getAttribute('data-c-lista'));
          var itens = r && Array.isArray(r.v) ? r.v : [];
          lista.querySelectorAll(':scope > [data-gerado]').forEach(function (el, i) {
            var item = itens[i] || {};
            var use = el.querySelector('use[data-icone]');
            if (use && item.icone) use.setAttribute('href', SPRITE + v(item.icone));
            if (item.fundo) el.setAttribute('data-fundo', v(item.fundo));
          });
        });
        var form = document.querySelector('[data-form-contato]');
        var endpoint = DR.valor('contato.formEndpoint');
        if (form && endpoint) form.setAttribute('action', endpoint.v);
        var email = DR.valor('contato.email');
        document.querySelectorAll('[data-mailto]').forEach(function (a) {
          if (email) a.setAttribute('href', 'mailto:' + email.v);
        });
        document.querySelectorAll('[data-ano]').forEach(function (el) {
          el.textContent = '© ' + new Date().getFullYear();
        });

        // N7: barra de progresso + rótulo da seção atual (funciona também com movimento reduzido).
        var progresso = document.querySelector('.progresso');
        var rotulos = Array.prototype.slice.call(document.querySelectorAll('.rotulos a'));
        var alvos = rotulos.map(function (a) { return document.querySelector(a.getAttribute('href')); });
        function atualizar() {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
          progresso.style.transform = 'scaleX(' + p.toFixed(4) + ')';
          var linha = window.innerHeight * 0.4, ativo = -1;
          alvos.forEach(function (s, i) { if (s && s.getBoundingClientRect().top <= linha) ativo = i; });
          rotulos.forEach(function (a, i) {
            if (i === ativo) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
          });
        }
        window.addEventListener('scroll', atualizar, { passive: true });
        window.addEventListener('resize', atualizar);
        atualizar();

        /* ---- Movimento: só com GSAP e sem pedido de movimento reduzido ---- */
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);
        var mm = gsap.matchMedia();
        mm.add('(prefers-reduced-motion: no-preference)', function () {
          var raiz = document.documentElement;
          var tl = null;
          function soltar() {
            raiz.style.overflow = '';
            ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (ev) {
              window.removeEventListener(ev, pular, true);
            });
          }
          function pular() { if (tl) tl.progress(1); }

          // Efeito principal: a sequência de abertura, uma vez por sessão.
          if (!jaViu() && window.scrollY < 10) {
            marcarVisto();
            raiz.style.overflow = 'hidden';
            ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (ev) {
              window.addEventListener(ev, pular, { capture: true, passive: true });
            });
            var meia = window.innerHeight / 2;
            tl = gsap.timeline({ defaults: { ease: 'power3.out' }, onComplete: soltar });
            tl.set('.tarja--cima', { height: meia })
              .set('.tarja--baixo', { height: meia })
              // 1. as tarjas se abrem como cortina de cinema
              .to('.tarja', { height: 18, duration: 0.55, ease: 'expo.inOut' }, 0.05)
              // 2. a coroa acende
              .from('.hero__coroa', { autoAlpha: 0, scale: 0.6, y: 12, duration: 0.45, ease: 'back.out(1.6)' }, 0.35)
              .from('.hero__brilho', { autoAlpha: 0, scale: 0.4, duration: 0.6 }, 0.4)
              // 3. o nome se espaça
              .from('.hero__nome', { autoAlpha: 0, letterSpacing: '1.2em', duration: 0.5 }, 0.6)
              // 4. a frase sobe
              .from('.hero__titulo', { autoAlpha: 0, y: 36, duration: 0.55 }, 0.75)
              .from('.hero__sub, .acoes, .hero__linha', { autoAlpha: 0, y: 16, duration: 0.4, stagger: 0.06 }, 0.95)
              .from('.barra__dentro', { autoAlpha: 0, duration: 0.35 }, 1.05)
              .from('.hero__favo', { autoAlpha: 0, duration: 0.6 }, 0.9);
          }

          // Depois da abertura: o conteúdo flui em chips.
          gsap.utils.toArray('.nuvem, .passos').forEach(function (lista) {
            gsap.from(lista.children, {
              autoAlpha: 0, scale: 0.92, y: 14, duration: 0.55, ease: 'back.out(1.4)', stagger: 0.07,
              scrollTrigger: { trigger: lista, start: 'top 86%', once: true }
            });
          });
          gsap.utils.toArray('main > section:not([data-secao="hero"]) .cabeca, .citacao blockquote').forEach(function (el) {
            gsap.from(el, { autoAlpha: 0, y: 20, duration: 0.7, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
          });

          return function () {
            if (tl) tl.progress(1).kill();
            soltar();
          };
        });
      });
    })();
  </script>
